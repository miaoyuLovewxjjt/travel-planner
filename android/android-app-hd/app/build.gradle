plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zcode.travelapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.zcode.travelapp.hd"
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName "2.5"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            // 页面单一事实源：与手机版共用 android/shared/assets/index.html（改动只改这一份）
            assets.srcDirs = ['../../shared/assets']
        }
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.8.0'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
    }
}

// 打包完成后把 APK 复制到 android/dist/（代码路径收敛输出，方便直接取用）
tasks.register('apkToDist') {
    dependsOn 'assembleDebug'
    doLast {
        def distDir = new File(rootProject.projectDir.parentFile, 'dist')
        def apkFile = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        if (!apkFile.exists()) throw new GradleException("未找到 APK: ${apkFile}")
        copy {
            from apkFile
            into distDir
            rename { "travel-app-hd-v${android.defaultConfig.versionName}.apk" }
        }
        println "→ APK 已输出: ${distDir}/travel-app-hd-v${android.defaultConfig.versionName}.apk"
    }
}
