<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌍 我的行程</title>
<!-- Leaflet 地图（动态加载：jsdelivr 优先，失败自动切 unpkg；免费无需 Key） -->
<script>
(function () {
  function loadScript(urls, ok, fail) {
    if (!urls.length) return fail();
    var s = document.createElement('script');
    s.src = urls[0];
    s.onload = ok;
    s.onerror = function () { loadScript(urls.slice(1), ok, fail); };
    document.head.appendChild(s);
  }
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
  css.onerror = function () { css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; };
  document.head.appendChild(css);
  loadScript(['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'],
             function () { window.leafletReady = true; },
             function () { window.__mapFail = true; });
})();
</script>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f4f4f7; --card:#ffffff; --ink:#1c1c28; --sub:#8a8a9a;
  --line:#ececf1; --radius:16px;
  --accent:#FF6B6B; --accent2:var(--accent2); --accent-soft:var(--accent-soft); --accent-border:var(--accent-border); --accent-shadow:var(--accent-shadow);
  --shadow:0 2px 14px rgba(28,28,60,.07);
}
/* 主题切换（设置面板选择）；accent2 保持足够深，确保白字可读 */
body.theme-blue{--accent:#2E7BE0;--accent2:#5AA0F0;--accent-soft:#eef4ff;--accent-border:#c9dcff;--accent-shadow:rgba(46,123,224,.35)}
body.theme-green{--accent:#2FA35C;--accent2:#3EBD73;--accent-soft:#eefaf1;--accent-border:#bdecd0;--accent-shadow:rgba(47,163,92,.35)}
body.theme-purple{--accent:#6B4DE0;--accent2:#8A6FF5;--accent-soft:#f3efff;--accent-border:#d4c8ff;--accent-shadow:rgba(107,77,224,.35)}
body.theme-orange{--accent:#E07B2A;--accent2:#E8912E;--accent-soft:#fff4e8;--accent-border:#ffd9a8;--accent-shadow:rgba(224,123,42,.35)}
body.theme-pink{--accent:#D94F8C;--accent2:#E85590;--accent-soft:#fff0f6;--accent-border:#ffc9de;--accent-shadow:rgba(217,79,140,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{padding:2px;width:42px;height:32px;cursor:pointer}
textarea{resize:vertical}
.hidden{display:none!important}

/* ============ 顶栏 ============ */
#topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 22px;
}
#topbar .logo{font-size:20px;font-weight:800;letter-spacing:.5px}
#topbar .logo span{color:var(--accent)} /* 跟随主题色 */
/* 顶栏按钮纯图标（所有设备），文字隐藏；导出/导入入口在 ⚙️ 设置中 */
#topbar .lbl{display:none}
#btn-export,#btn-import{display:none}
#btn-back,#btn-preview,#btn-pdf{padding:8px 12px}
#btn-new{padding:9px 14px}
#btn-data{padding:8px 10px}
#topbar .spacer{flex:1}
#save-state{font-size:12px;color:var(--sub);margin-right:6px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;transition:transform .1s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#FF6B6B,var(--accent2));color:#fff;box-shadow:0 4px 14px var(--accent-shadow)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#d8d8e0}
.btn-danger{background:#fff;color:#e5484d;border:1px solid #f3c1c3}
.btn-small{padding:4px 10px;font-size:12px;border-radius:999px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:#55556a;transition:background .15s,color .15s}
.icon-btn:hover{background:#e8e8ef;color:var(--ink)}
.icon-btn:hover .trash-icon{stroke:#e5484d}
.icon-btn:hover .pencil-icon{stroke:#3d5af1}
.trash-icon,.pencil-icon{display:block;flex-shrink:0}
/* 编辑控件字体统一 */
.seg-row input,.seg-row select,.seg-detail input,.seg-detail select,
.exp-row input,.exp-row select,.lodge-grid input,.lodge-grid select{
  font-size:13px!important;font-weight:500}
.done-btn,.icon-btn,.add-row-btn,.pax-add-btn{font-size:13px}

/* ============ 列表页 ============ */
#view-list{max-width:1080px;margin:26px auto;padding:0 22px}
#view-list .hero{margin-bottom:22px}
#view-list .hero h1{font-size:26px;font-weight:800}
#view-list .hero p{color:var(--sub);margin-top:2px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.trip-card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s,box-shadow .2s;display:flex;flex-direction:column;
}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,28,60,.12)}
.trip-cover{
  position:relative;height:118px;display:flex;align-items:center;justify-content:center;
}
.trip-cover::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 55%)}
.trip-cover .big-emoji{font-size:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));z-index:1}
.trip-cover .days-chip{
  position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);color:var(--ink);
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;z-index:1;
}
.trip-body{padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.trip-body h3{font-size:17px;font-weight:800}
.trip-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--sub);font-size:12.5px}
.trip-meta .dot{color:#d5d5dd}
.trip-foot{display:flex;align-items:center;gap:10px;margin-top:4px}
.budget-bar{flex:1;height:7px;border-radius:99px;background:#f0f0f5;overflow:hidden}
.budget-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6B6B,#FFC24B);transition:width .4s}
.trip-foot .spend{font-size:12.5px;color:var(--sub);white-space:nowrap}
.empty-state{
  text-align:center;padding:70px 20px;color:var(--sub);
}
.empty-state .big{font-size:52px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* ============ 详情页 ============ */
#view-detail{max-width:1180px;margin:0 auto;padding:0 22px 60px}
.detail-head{display:flex;align-items:center;gap:14px;padding:22px 0 6px;flex-wrap:wrap}
.detail-head h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.detail-head .sub{color:var(--sub);font-size:13px;margin-top:2px}
.stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 6px}
.stat-card{
  background:var(--card);border-radius:14px;padding:10px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:110px;
}
.stat-card .num{font-size:19px;font-weight:800}
.stat-card .lbl{font-size:11.5px;color:var(--sub)}
/* 合并长框：日期 / 天数 / 出行人 / 总预算 / 总花费 / 预算结余（内容自适应长度，窄屏自动换行） */
.stat-card.stat-long{flex-direction:row;align-items:center;gap:14px 22px;min-width:0;flex:1 1 auto;max-width:780px;flex-wrap:wrap;width:fit-content}
.stat-long .sl-item{display:flex;flex-direction:column;white-space:nowrap}
.stat-long .sl-item .num{font-size:16px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.stat-long .sl-item .lbl{font-size:11px;color:var(--sub)}
.stat-long .sl-item .num.over{color:#e5484d}
.stat-long .sl-div{width:1px;height:30px;background:var(--line)}
.detail-body{display:grid;grid-template-columns:210px 1fr;gap:26px;margin-top:20px;align-items:start}
.day-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:8px}
.day-nav .nav-title{font-size:12px;color:var(--sub);font-weight:700;margin:4px 0 2px;padding-left:4px}
.day-nav button{
  text-align:left;padding:9px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;gap:9px;transition:all .15s;font-size:13px;
}
.day-nav button:hover{border-color:#d8d8e0;transform:translateX(2px)}
.day-nav button .d{font-weight:800;font-size:15px;min-width:34px}
.day-nav button .info{color:var(--sub);font-size:11.5px;margin-left:auto;white-space:nowrap}
.day-nav button.empty{opacity:.55;border-style:dashed}
.day-nav button.active{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--accent-shadow)}
.day-nav button.active .info{color:rgba(255,255,255,.85)}
.days-col{display:flex;flex-direction:column;gap:26px}

/* —— 每日卡片 —— */
.day-card{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--line);
}
.day-card.flash{animation:flashBg 1.6s ease}
@keyframes flashBg{0%{box-shadow:0 0 0 3px rgba(255,107,107,.5)}100%{box-shadow:var(--shadow)}}
.day-head{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#fff,#fafaff);
}
.day-badge{
  min-width:56px;height:56px;border-radius:14px;background:linear-gradient(160deg,var(--accent),var(--accent2));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
  box-shadow:0 4px 12px var(--accent-shadow);flex-shrink:0;
}
.day-badge .n{font-size:20px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.day-badge .w{font-size:11px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.day-head .day-info{flex:1}
.day-head .day-info h3{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-head .day-info .day-sub{font-size:12.5px;color:var(--sub)}
.day-head .day-cost{text-align:right;align-self:flex-end;padding-bottom:2px}
.day-head .day-cost .amt{font-size:18px;font-weight:800;color:var(--accent)}
.day-head .day-cost .lbl{font-size:11px;color:var(--sub)}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.block{padding:22px 26px;border-bottom:1px solid var(--line)}
.block.col-left{grid-column:1;border-right:1px solid var(--line)}
.block.col-right{grid-column:2;border-right:none}
.block.full{grid-column:1/-1;border-right:none}
.block.lodge-block{padding:22px 26px 12px} /* 标题与其余区块对齐（上/左 22px 26px），底部收窄让总览上移 */
/* 左右独立列：左列（住宿+总览）紧贴，右列（记账）独立高度，互不影响 */
.day-col{display:flex;flex-direction:column}
.day-col .block{border-right:none}
.day-col.col-l{border-right:1px solid var(--line)}
@media(max-width:860px){.detail-body{grid-template-columns:1fr}.day-nav{position:static;flex-direction:row;flex-wrap:wrap}
  .day-grid{grid-template-columns:1fr}.block.col-left,.block.col-right{grid-column:1/-1;border-right:none}.day-col{grid-column:1/-1}.day-col.col-l{border-right:none}}
.block-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:1px;margin-bottom:14px;
  display:flex;align-items:center;gap:7px}
.block-title .tag{font-size:14px;display:inline-flex;align-items:center}
.add-row-btn{
  display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;border:1.5px dashed var(--accent-border);transition:all .15s;margin:8px 0 2px;
}
.add-row-btn:hover{background:var(--accent-soft)}

/* 路线段 */
.seg-wrap.editing{border:1.5px dashed var(--accent-border);background:#fffaf5;border-radius:14px;padding:8px 12px;margin:6px 0}
.seg-view{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.seg-wrap .seg-view:last-child{border-bottom:none}
.seg-view-time{font-size:13px;font-weight:600;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:8px;white-space:nowrap}
.seg-view-path{font-weight:700;font-size:14.5px;color:var(--ink)}
.seg-view-path .arr{color:var(--sub);font-weight:400;margin:0 4px}
.seg-view-sub{font-size:11.5px;color:var(--sub);padding-left:2px;flex:1;min-width:70px}
.seg-view-trans{font-size:13px;font-weight:600;color:#55556a;background:#f0f0f5;padding:3px 10px;border-radius:8px;white-space:nowrap}
.seg-view-chip{font-size:13px;font-weight:600;color:#55556a;background:#f0f0f5;padding:3px 10px;border-radius:8px;white-space:nowrap}
.seg-view-price{font-size:13px;font-weight:800;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:8px;white-space:nowrap}
.seg-view-actions{margin-left:auto;display:flex;gap:4px}
.drag-handle{color:#c9c9d4;font-size:13px;cursor:grab;user-select:none;flex-shrink:0;letter-spacing:-3px;padding:2px 4px;border-radius:6px}
.drag-handle:hover{color:var(--accent);background:var(--accent-soft)}
.seg-view[draggable="true"]{cursor:grab}
.seg-view[draggable="true"]:active{cursor:grabbing}
.seg-view.dragging,.exp-view.dragging{opacity:.35}
.seg-view.drag-over,.exp-view.drag-over{box-shadow:0 -3px 0 0 var(--accent)}
.seg-view.drag-over-after,.exp-view.drag-over-after{box-shadow:0 3px 0 0 var(--accent)}
.done-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  background:#eef7ef;color:#2e8b57;font-weight:900;flex-shrink:0;transition:all .15s}
.done-btn:hover{background:#d8efdb;transform:scale(1.08)}
.done-btn.gray{background:#f2f2f7;color:var(--sub)}
.done-btn.gray:hover{background:#e6e6ee;color:#e5484d}
.seg-row{display:flex;align-items:center;gap:5px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:nowrap}
@media(max-width:860px){.seg-row{flex-wrap:wrap}}
.seg-row:last-child{border-bottom:none}
.seg-time{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:8px;white-space:nowrap}
.seg-path{font-weight:700;font-size:13.5px;white-space:nowrap}
.seg-path .arr{color:var(--sub);font-weight:400;margin:0 3px}
.seg-trans{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;
  background:var(--ink);padding:2px 10px;border-radius:999px;white-space:nowrap}
.seg-note{font-size:12px;color:var(--sub);flex:1;min-width:80px}
.seg-row input{width:88px;padding:4px 6px;font-size:12.5px;border-radius:8px}
.seg-row input[type=time]{width:80px;padding:4px 3px;font-size:13px;flex-shrink:0}
.seg-row input.seg-time{width:80px;padding:4px 6px;font-size:13px;flex-shrink:0;text-align:center}
.seg-row input.seg-note-input{flex:1;min-width:40px;width:auto}
.seg-row input.seg-price{width:76px;flex-shrink:0}
.seg-view-price{font-size:13px;font-weight:800;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:8px;white-space:nowrap}
.exp-note-input{flex-basis:100%;width:100%!important;padding:4px 8px;font-size:12px;border-radius:8px;border-color:#eee}
.exp-view-note{flex-basis:100%;font-size:11.5px;color:var(--sub);padding-left:2px}
.seg-row select{width:82px;padding:4px 4px;font-size:12.5px;border-radius:8px;flex-shrink:0}
.seg-row .arr{flex-shrink:0}
.seg-toggle{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--sub);background:#f2f2f7;font-size:11px;font-weight:800;flex-shrink:0;transition:transform .2s,background .15s}
.seg-toggle:hover{background:#e6e6ee}
.seg-toggle.open{transform:rotate(90deg);background:var(--accent);color:#fff}
.seg-detail{display:none;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;background:#fafafc;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:8px 0 12px}
.seg-detail.open{display:grid}
.seg-detail-label{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;display:flex;align-items:center}
.seg-detail-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-detail-row .f{display:flex;flex-direction:column;gap:2px}
.seg-detail-row .f label{font-size:10.5px;color:var(--sub);font-weight:700}
.seg-detail-row input{width:110px;padding:5px 8px;font-size:12.5px;border-radius:8px}
.seg-detail-row input.small{width:80px}
.seg-detail-row input.wide{width:150px}
.seg-detail-row input[type=time]{width:92px}
.seg-pax-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.seg-pax-chips .chip{padding:3px 10px;font-size:12px;background:#eef4ff;color:#3d5af1}
.seg-pax-chips .chip.self{background:#fff4e8;color:#b0712e}
.pax-add-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px;border:1.5px dashed var(--accent-border);white-space:nowrap}
.pax-add-btn:hover{background:var(--accent-soft)}

/* 住宿（紧凑：一晚上的事，不占大空间） */
.lodge-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.lodge-grid .f{display:flex;flex-direction:column;gap:2px}
.lodge-grid .f label{font-size:11px;color:var(--sub)}
.lodge-grid input{padding:4px 8px;font-size:13px}
.lodge-grid input.amount{width:110px}
.lodge-grid select{width:110px;padding:4px 8px;font-size:13px;border-radius:10px}
.lodge-notes{margin-top:6px}
.lodge-notes input{width:100%;padding:4px 8px;font-size:13px}
.lodge-none{color:var(--sub);font-size:12.5px;font-style:italic;margin:6px 0 12px}
/* 住宿展示态（紧凑对齐版） */
.lodge-view{display:flex;flex-direction:column;gap:3px;padding:1px 0}
.lodge-view-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lodge-view-type{font-size:14px;line-height:1.5;display:inline-flex;align-items:center;flex-shrink:0}
.lodge-view-name{font-weight:800;font-size:15px;color:var(--ink);line-height:1.5}
.lodge-view-price{font-size:14px;font-weight:800;color:var(--accent);margin-left:auto;white-space:nowrap;line-height:1.5}
.lodge-view-sub{font-size:13px;color:var(--sub);padding-left:2px;line-height:1.5}
.lodge-view-actions{display:flex;gap:2px}

/* 乘客选择面板 */
.pax-panel .pax-list{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 14px}
.pax-panel .pax-opt{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;
  border:2px solid var(--line);font-size:14px;font-weight:700;transition:all .15s;user-select:none}
.pax-panel .pax-opt:hover{border-color:#ffb8b8}
.pax-panel .pax-opt.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(255,107,107,.3)}
.pax-panel .pax-custom{display:flex;gap:8px;align-items:center;margin-top:4px}
.pax-panel .pax-custom input{flex:1}
.pax-panel .pax-hint{font-size:11.5px;color:var(--sub);margin-top:8px}
.pax-seats{display:flex;flex-direction:column;gap:8px;margin:12px 0 2px}
.pax-seat-row{display:flex;align-items:center;gap:8px;background:#fafafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pax-seat-name{font-weight:700;font-size:13px;min-width:72px}
.pax-seat-input{flex:1;max-width:220px;padding:5px 10px;font-size:12.5px;border-radius:8px}

/* 出行人 */
.traveler-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f2f2f7;border-radius:999px;
  padding:4px 12px;font-size:13px;font-weight:600}
.chip .x{cursor:pointer;color:var(--sub);font-weight:800;padding:0 2px}
.chip .x:hover{color:#e5484d}
.chip.inherit{background:#fff4e8;color:#b0712e;font-size:12px}
.traveler-add{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;border:1.5px dashed var(--accent-border)}
.traveler-add:hover{background:var(--accent-soft)}

/* 备注 */
.notes-box textarea{width:100%;min-height:64px;font-size:13px;background:#fafafc;border-color:transparent}
.notes-box textarea:hover{border-color:var(--line)}

/* 记账 */
.exp-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.exp-row:last-child{border-bottom:none}
.exp-row select{width:86px;padding:4px 6px;font-size:12.5px;border-radius:8px}
.exp-row select.src{width:128px}
.exp-row .item{flex:1;min-width:110px;padding:4px 8px;font-size:12.5px;border-radius:8px}
.exp-row .amt{width:88px;padding:4px 8px;font-size:12.5px;border-radius:8px;text-align:right}
.exp-row .when{width:64px;padding:4px 6px;font-size:12px;border-radius:8px}
.exp-row .src-custom{width:130px;padding:4px 8px;font-size:12px;border-radius:8px;border-color:#ffd9a8}
.exp-src-chip{display:inline-flex;align-items:center;gap:4px;background:#eef7ef;color:#2e8b57;border-radius:999px;
  padding:2px 10px;font-size:11px;font-weight:700;margin-left:auto}
.exp-src-chip.other{background:#f2f2f7;color:var(--sub)}
.exp-view{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.exp-view:last-child{border-bottom:none}
.exp-view-cat{font-size:12.5px;font-weight:800;background:#f2f2f7;padding:2px 9px;border-radius:99px;color:var(--sub);white-space:nowrap}
.exp-view-item{font-weight:700;font-size:14px;flex:1;min-width:90px}
.exp-view-amt{font-weight:800;color:var(--accent);white-space:nowrap;font-size:14px}
.exp-view .exp-src-chip{margin-left:0}
.exp-view-actions{display:flex;gap:4px}
.exp-view[draggable="true"]{cursor:grab}
.exp-view[draggable="true"]:active{cursor:grabbing}
.exp-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:2px solid var(--line)}
.exp-total .t{font-size:12px;color:var(--sub);font-weight:700}
.exp-total .amt{font-size:16px;font-weight:800;color:var(--accent)}

/* 途经点 */
.pin-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pin-chip{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;color:#3d5af1;border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:600}
.pin-chip .x{cursor:pointer;font-weight:800;padding:0 2px}
.pin-chip .x:hover{color:#e5484d}
.map-hint{font-size:11.5px;color:var(--sub);margin-top:6px}

/* 每日总览 */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ov-item{background:#fafafc;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:1px}
.ov-item .num{font-size:15.5px;font-weight:800}
.ov-item .lbl{font-size:11px;color:var(--sub)}
.ov-note{grid-column:1/-1;font-size:12px;color:var(--sub);background:#fff8f0;border-radius:10px;padding:8px 12px}
.ov-route{grid-column:1/-1;background:#fafafc;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ov-route .lbl{font-size:11px;color:var(--sub);font-weight:700}
.block-hint{font-size:11.5px;color:var(--sub);background:#f7f7fa;border-radius:8px;padding:5px 10px;margin-bottom:10px}
/* 提醒 */
.rem-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rem-row input[type=date]{width:132px;padding:4px 8px;font-size:13px;border-radius:8px}
.rem-row input[type=time]{width:92px;padding:4px 6px;font-size:13px;border-radius:8px}
.rem-row .rem-title{flex:1;min-width:110px;padding:4px 8px;font-size:13px;border-radius:8px}
.rem-view{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rem-view:last-child{border-bottom:none}
.rem-dot{width:11px;height:11px;border:2px solid var(--accent);border-radius:50%;flex-shrink:0;background:#fff}
.rem-view-time{font-size:13px;font-weight:600;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:8px;white-space:nowrap}
.rem-view-title{font-size:14px;font-weight:700;color:var(--ink)}
.rem-view-actions{display:flex;gap:2px;margin-left:auto}
.exp-donut{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.exp-donut .lbl{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:2px}
.donut-wrap{display:flex;align-items:center;gap:16px;padding:6px 0;flex-wrap:wrap}
.donut{width:98px;height:98px;border-radius:50%;position:relative;flex-shrink:0}
.donut-hole{position:absolute;inset:22%;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;color:var(--accent);text-align:center;line-height:1.2}
.donut-legend{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--sub)}
.donut-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-legend span{white-space:nowrap;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s}
.donut-legend span:hover{background:#f0f0f5}
.donut-detail{margin-top:2px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.dd-row{display:flex;justify-content:space-between;font-size:12px;color:#55556a;gap:12px}
.dd-row b{color:var(--ink);white-space:nowrap}
.route-bar{display:flex;width:100%;height:32px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f0f0f5}
.rb-seg{display:flex;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:11px;font-weight:800;
  min-width:34px;white-space:nowrap;transition:filter .15s;cursor:default}
.rb-seg:hover{filter:brightness(1.12)}
.rb-seg .rb-txt{overflow:hidden;text-overflow:ellipsis}

/* 添加一天 */
.add-day-wrap{padding:20px;display:flex;justify-content:center}
.add-day-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:999px;
  border:2px dashed #d8d8e0;color:var(--sub);font-weight:700;font-size:14px;transition:all .2s}
.add-day-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff}

/* ============ 模态 ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,20,40,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal{
  background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto;
  padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popIn .2s ease;
}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12px;font-weight:700;color:var(--sub)}
.form-field input,select{padding:9px 12px;border-radius:12px}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s}
.color-dot:hover{transform:scale(1.15)}
.color-dot.sel{border-color:var(--ink);transform:scale(1.1)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* 数据管理面板 */
.st-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:1px;margin-bottom:10px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px dashed var(--line);font-size:14px;font-weight:600}
.set-row.clickable{cursor:pointer}
.set-row.clickable:hover{background:#fafafc;border-radius:8px;padding-left:6px;padding-right:6px}
.set-opts{display:flex;gap:6px}
.set-opt{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);
  background:#f2f2f7;border:1.5px solid transparent;transition:all .15s}
.set-opt:hover{border-color:var(--accent-border)}
.set-opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.set-version{margin-top:8px;background:#fafafc;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.set-version a{color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all}
/* 大字体 */
body.font-large{font-size:15.5px}
body.font-large .seg-view-time,body.font-large .seg-view-chip,body.font-large .seg-view-trans,body.font-large .seg-view-price{font-size:14px}
body.font-large .seg-view-path{font-size:15.5px}
body.font-large .exp-view-item{font-size:15px}
body.font-large .exp-view-cat{font-size:13px}
body.font-large .lodge-view-name{font-size:16px}
body.font-large .lodge-view-sub{font-size:14px}
body.font-large .rem-view-time{font-size:14px}
body.font-large .rem-view-title{font-size:15px}
body.font-large .btn{font-size:14.5px}
/* 渐变壁纸 */
body.wall-gradient{background:linear-gradient(165deg,var(--accent-soft) 0%,var(--bg) 45%)}
body.wall-gradient .trip-card,body.wall-gradient .day-card{box-shadow:0 4px 18px rgba(28,28,60,.08)}
.theme-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 0 4px}
.theme-dot{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .15s;position:relative}
.theme-dot:hover{transform:scale(1.12)}
.theme-dot.sel{border-color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.theme-dot i{color:#fff;font-size:14px;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.theme-name{font-size:13px;font-weight:700;color:var(--sub)}
.data-panel .dp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.data-panel .dp-row span{color:var(--sub);font-weight:700;white-space:nowrap}
.data-panel .dp-row b{font-weight:700;text-align:right}
.data-panel .dp-note{font-size:12px;color:var(--sub);background:#f7f7fa;border-radius:10px;
  padding:9px 12px;margin-top:12px;line-height:1.7}
.data-panel .dp-warn{font-size:12px;color:#e5484d;background:var(--accent-soft);border:1px solid #f3c1c3;
  border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.7}

/* ============ 旅行记录（独立页面视图） ============ */
#view-journal{max-width:900px;margin:0 auto;padding:0 20px 60px;min-height:100vh}
.journal-toolbar{display:flex;align-items:center;gap:10px;padding:16px 4px;color:var(--ink);flex-wrap:wrap}
.journal-toolbar .t{font-weight:900;font-size:16px;margin-right:auto;color:#6b4f1d;
  font-family:'STXingkai','KaiTi','STKaiti',serif;letter-spacing:2px}
.journal-toolbar .btn{background:#fdf6e3;color:#6b4f1d;border:1.5px solid #c9a86a;
  box-shadow:0 2px 6px rgba(120,95,50,.12)}
.journal-toolbar .btn:hover{background:#f4e6c8}
#view-journal .diy-bar{background:#fdf6e3;border:1.5px dashed #c9a86a;border-radius:12px;
  margin:0 0 14px;padding:10px 14px;color:#6b4f1d;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#view-journal .diy-bar .diy-t{font-weight:800;font-size:13px}
#view-journal .diy-bar .diy-hint{font-size:11px;color:#9a8458;flex-basis:100%}
#view-journal .diy-bar .btn{background:#fff;border-color:#c9a86a;color:#6b4f1d}
.journal-scroll{padding:6px 0 30px;display:flex;justify-content:center}
/* 照片角（宝丽来风格） */
.post-photos{margin:10px 26px 6px}
.post-photos .pp-title{font-size:13px;font-weight:900;color:#6b4f1d;letter-spacing:2px;margin-bottom:10px;
  font-family:'KaiTi','STKaiti',serif}
.post-photos .pp-grid{display:flex;flex-wrap:wrap;gap:14px}
.post-photos .pp-item{position:relative;background:#fff;padding:8px 8px 14px;border-radius:6px;
  box-shadow:0 4px 14px rgba(120,90,40,.22);width:150px;transition:transform .2s}
.post-photos .pp-item:hover{transform:scale(1.04) rotate(0deg)!important}
.post-photos .pp-item img{width:100%;height:112px;object-fit:cover;border-radius:3px;display:block}
.post-photos .pp-item .pp-cap{font-size:10.5px;color:#7a6540;text-align:center;margin-top:7px;
  font-family:'KaiTi','STKaiti',serif}
.post-photos .pp-del{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;
  background:#c0392b;color:#fff;border:none;font-size:12px;font-weight:900;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  opacity:.55;transition:opacity .15s,transform .15s}
.post-photos .pp-item:hover .pp-del,.post-photos .pp-del:hover{opacity:1;transform:scale(1.1)}
.post-photos .pp-empty{font-size:12px;color:#9a8458;font-style:italic;padding:4px 0 10px}
.post-photos .pp-add{display:inline-flex;align-items:center;gap:5px;margin-top:4px;color:#6b4f1d;
  background:#fdf6e3;border:1.5px dashed #c9a86a;border-radius:999px;padding:5px 14px;
  font-size:12px;font-weight:800;cursor:pointer;transition:all .15s}
.post-photos .pp-add:hover{background:#f4e6c8}
.post{
  position:relative;width:min(640px,94vw);background:#faf3e3;border-radius:24px;overflow:hidden;
  height:fit-content;
  box-shadow:inset 0 -10px 16px -10px rgba(140,110,60,.28),
    0 1px 2px rgba(120,90,40,.25),0 6px 14px rgba(120,90,40,.22),0 30px 80px rgba(0,0,0,.35),
    0 0 0 6px #efe2c8,0 0 0 7px #d8c9a8;
}
/* 纸张横纹 + 折痕（像被对折过的地图纸） */
.post::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    linear-gradient(90deg,transparent 49.5%,rgba(150,115,60,.14) 49.9%,rgba(255,255,255,.38) 50.1%,transparent 50.5%),
    linear-gradient(180deg,transparent 74.5%,rgba(150,115,60,.11) 74.9%,rgba(255,255,255,.3) 75.1%,transparent 75.5%),
    linear-gradient(180deg,transparent 49.5%,rgba(150,115,60,.07) 49.9%,rgba(255,255,255,.22) 50.1%,transparent 50.5%),
    repeating-linear-gradient(0deg,transparent 0 26px,rgba(139,115,72,.05) 26px 27px);
}
/* 旧纸泛黄：边缘与底部的岁月痕迹 */
.post::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:
    radial-gradient(ellipse at 50% 108%,rgba(150,110,50,.16),transparent 55%),
    radial-gradient(ellipse at -8% 45%,rgba(150,110,50,.1),transparent 45%),
    radial-gradient(ellipse at 108% 20%,rgba(150,110,50,.08),transparent 40%)}
.post-cover{
  position:relative;padding:46px 34px 40px;color:#fff;overflow:hidden;
}
/* 顶端贴纸胶带（像地图被贴在手账上） */
.post .tape{position:absolute;top:16px;left:50%;transform:translateX(-50%) rotate(-2.5deg);z-index:6;
  width:122px;height:24px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,240,190,.78) 0 7px,rgba(250,228,168,.78) 7px 14px);
  border-left:1px solid rgba(190,160,100,.5);border-right:1px solid rgba(190,160,100,.5);
  box-shadow:0 2px 5px rgba(120,90,40,.2);backdrop-filter:blur(1px)}
.post-cover .tape::after{content:"";position:absolute;inset:0;opacity:.5;
  background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 40%,rgba(150,110,50,.12))}
.post-cover::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);top:-110px;right:-90px}
.post-cover::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);bottom:-80px;left:-40px}
.post-cover .deco{position:absolute;opacity:.55;z-index:1;animation:float 4.5s ease-in-out infinite;filter:drop-shadow(0 3px 6px rgba(0,0,0,.15))}
.post-cover .deco.d1{top:16px;left:24px;font-size:26px}
.post-cover .deco.d2{top:52px;right:56px;font-size:19px;animation-delay:.8s}
.post-cover .deco.d3{bottom:64px;left:64px;font-size:21px;animation-delay:1.6s}
.post-cover .deco.d4{top:90px;left:38%;font-size:15px;animation-delay:2.3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.post-day{cursor:pointer;transition:background .18s}
.post-day:hover{background:#fff6f0}
.post-day:hover .post-day-head .pd-t{color:var(--accent)}
.post-cover .pc-emoji{font-size:52px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25));position:relative;z-index:1}
.post-cover h1{font-size:30px;font-weight:900;margin-top:10px;letter-spacing:2px;position:relative;z-index:1;line-height:1.3;
  font-family:'STXingkai','KaiTi','STKaiti',serif;text-shadow:0 2px 8px rgba(0,0,0,.25)}
.post-cover .pc-dates{margin-top:8px;font-size:14px;font-weight:600;opacity:.95;position:relative;z-index:1;
  font-family:'KaiTi','STKaiti',serif;letter-spacing:1px}
.post-cover .pc-travelers{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap;position:relative;z-index:1}
.post-cover .pc-travelers span{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);
  padding:3px 13px;border-radius:999px;font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}
.post-map{position:relative;margin:16px 16px 0;border-radius:16px;overflow:hidden;
  height:clamp(320px,46vh,480px);
  border:2px solid #b99b6b;outline:3px solid #faf3e3;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),inset 0 0 34px rgba(140,110,60,.12),0 10px 26px rgba(120,95,50,.18)}
/* 地图右下角卷起（像纸角被折过） */
.post-map .map-curl{position:absolute;right:-2px;bottom:-2px;width:44px;height:44px;z-index:700;pointer-events:none;
  background:linear-gradient(315deg,#f3e9d2 0 50%,rgba(150,115,60,.45) 50% 56%,rgba(90,70,35,.28) 56% 100%);
  border-radius:14px 0 14px 0;box-shadow:-4px -4px 8px rgba(150,115,60,.18)}
.post-map .map-curl::before{content:"";position:absolute;left:-6px;bottom:-6px;width:12px;height:12px;border-radius:50%;
  background:radial-gradient(circle,rgba(150,115,60,.2),transparent 70%)}
/* 指南针 */
.post-map .compass{position:absolute;left:12px;bottom:12px;z-index:600;width:36px;height:36px;opacity:.9;pointer-events:none;
  background:#fdf6e3;border:1.5px solid #c9a86a;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(120,90,40,.2);transform:rotate(-8deg)}
.post-map .compass svg{width:24px;height:24px}
.post-map .leaflet-tile-pane{filter:sepia(.3) saturate(.75) contrast(.94) brightness(1.04)}

/* 折线上交通徽标 */

.post-moneys .post-budget{flex:1;min-width:210px;display:flex;align-items:center;gap:14px;margin:0;padding:0;background:none;border:none}
.post-moneys .pb-face{

  background:radial-gradient(circle at 35% 30%,#fff8e8,#f0d9a8);
  border:2px solid #c9a86a;box-shadow:inset 0 0 0 3px #faf3e3,0 3px 8px rgba(120,95,50,.18);
  display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)}
.post-moneys .pb-txt{flex:1}
.post-moneys .pb-txt .t{font-size:12px;font-weight:800;color:#8a6a30;letter-spacing:2px;
  font-family:'KaiTi','STKaiti',serif}
.post-moneys .pb-txt .amt{font-size:26px;font-weight:900;color:#6b4f1d;margin-top:2px;
  font-family:'KaiTi','STKaiti',serif;text-shadow:1px 1px 0 rgba(255,255,255,.6)}
.post-moneys .pb-txt .amt em{font-style:normal;color:#c0392b}
.post-moneys .pb-txt .amt.ok{color:#2e8b57}
.post-moneys .pb-txt .pb-sub{font-size:11px;color:#9a8458;margin-top:3px;letter-spacing:.5px}
.post-moneys .post-donut{flex:1;min-width:250px;margin:0;padding:0}
.post-moneys .post-donut .donut-wrap{background:rgba(255,255,255,.5);border:1.5px dashed #c9a86a;
  border-radius:12px;padding:12px 16px}
.post-moneys .donut-legend span{color:#7a6540}
.post-moneys .donut-legend span:hover{background:#f4e6c8}
.post-day{
  padding:20px 26px 14px;border-top:1px dashed var(--line);
}
.post-day-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.post-day-badge{min-width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,var(--accent),var(--accent2));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.post-day-badge .n{font-size:19px;font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.post-day-badge .w{font-size:10.5px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.post-day-head .pd-t{font-size:16px;font-weight:800}

.post-timeline{position:relative;padding-left:20px}

.pt-item{position:relative;padding:0 0 14px 4px}
.pt-item::before{content:"";position:absolute;left:-18px;top:5px;width:12px;height:12px;border-radius:50%;

.pt-item .t{font-size:11.5px;font-weight:800;color:var(--accent)}
.pt-item .p{font-size:13.5px;font-weight:700;margin:1px 0}

.post-lodge{display:flex;align-items:center;gap:10px;background:#fff8f0;border:1px solid #ffe8cc;border-radius:14px;
  padding:10px 14px;margin:2px 0 12px;font-size:12.5px}

.post-lodge .pl-price{color:#b0712e;font-weight:700;margin-left:auto;white-space:nowrap}
.post-exp{margin-top:2px}
.post-exp .pe-line{display:flex;align-items:baseline;gap:8px;font-size:12px;padding:2.5px 0;color:#55556a}
.post-exp .pe-line .c{font-size:10px;font-weight:800;background:#f2f2f7;padding:1px 8px;border-radius:99px;color:var(--sub)}
.post-exp .pe-line .i{flex:1;font-weight:600}
.post-exp .pe-line .a{font-weight:800;color:var(--ink)}
.post-exp .pe-total{display:flex;justify-content:space-between;border-top:1.5px solid var(--ink);
  margin-top:6px;padding-top:7px;font-weight:900;font-size:13px}
.post-note{font-size:12px;color:var(--sub);background:#f7f7fa;border-radius:12px;padding:9px 13px;margin-top:12px;
  font-style:italic}
.post-note:empty{display:none}
.post-total{background:linear-gradient(135deg,#6b4f1d,#4a3512);color:#fdf6e3;padding:22px 28px;margin-top:12px}

.post-total .row b{font-weight:800}
.post-total .row.main{font-size:20px;font-weight:900;opacity:1;margin-top:8px;padding-top:10px;border-top:1px solid rgba(253,246,227,.22)}
.post-total .row.main .amt{color:#FFD98A}
.post-total .row.main .amt.over{color:#ff8f8f}
.post-foot{text-align:center;padding:16px;font-size:11px;color:#9a8458;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;gap:10px}
/* 印章（手账落款） */
.post-foot .stamp{display:inline-block;padding:2px 10px;border:1.6px solid rgba(180,70,60,.55);
  color:rgba(180,70,60,.7);border-radius:6px;font-size:10px;letter-spacing:3px;font-weight:800;
  font-family:'KaiTi','STKaiti',serif;transform:rotate(-5deg);
  box-shadow:inset 0 0 0 1px rgba(180,70,60,.12),0 1px 2px rgba(0,0,0,.06);
  background:radial-gradient(circle at 28% 28%,rgba(255,255,255,.55),transparent 62%)}

/* ============ 迷你地图选点 ============ */
#pinmap-modal .modal{max-width:640px}
#pinmap-box{height:340px;border-radius:14px;border:1px solid var(--line);z-index:0}
.pinmap-form{display:flex;gap:8px;margin-top:12px;align-items:center}
.pinmap-form input{flex:1}
.pinmap-form .hint{font-size:12px;color:var(--sub)}
#pinmap-modal .leaflet-container{z-index:1}

/* ============ 提示 ============ */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:999;
  background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ PDF 文档视图 ============ */
#doc{position:fixed;inset:0;background:rgba(20,20,40,.6);backdrop-filter:blur(6px);z-index:320;display:flex;flex-direction:column}
.doc-toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px;color:#fff}
.doc-toolbar .t{font-weight:800;font-size:15px;margin-right:auto}
.doc-toolbar .btn{background:rgba(255,255,255,.15);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.doc-toolbar .btn:hover{background:rgba(255,255,255,.28)}
.doc-scroll{flex:1;overflow:auto;padding:22px 20px 60px;display:flex;justify-content:center}
.doc-body{background:#fff;width:100%;max-width:820px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.3);padding:46px 54px;height:fit-content}
.doc-cover{position:relative;color:#fff;border-radius:18px;padding:34px 34px 30px;overflow:hidden}
.doc-cover::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 65%);top:-100px;right:-80px}
.doc-cover .doc-emoji{font-size:40px;position:relative;z-index:1}
.doc-cover h1{font-size:27px;font-weight:900;margin-top:8px;position:relative;z-index:1;line-height:1.35}
.doc-meta{margin-top:6px;font-size:13px;opacity:.92;position:relative;z-index:1}
.doc-toc{margin:26px 0 8px;padding:22px 26px;background:#fafafc;border:1px solid var(--line);border-radius:16px}
.doc-toc h2{font-size:15px;font-weight:900;letter-spacing:2px;margin-bottom:14px;color:var(--ink)}
.toc-item{display:flex;align-items:baseline;gap:10px;padding:7px 0;text-decoration:none;color:var(--ink);border-bottom:1px dashed #e5e5ec;font-size:13.5px}
.toc-item:last-child{border-bottom:none}
.toc-item:hover .toc-date{color:var(--accent)}
.toc-no{font-weight:900;color:var(--accent);font-size:12px;min-width:46px}
.toc-date{font-weight:700}
.toc-dots{flex:1;border-bottom:2px dotted #d5d5dd;transform:translateY(-3px)}
.toc-sum{color:var(--sub);font-size:12px;white-space:nowrap}
.doc-day{padding:22px 0 6px;border-top:1px solid var(--line);margin-top:18px}
.doc-day-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;margin-bottom:12px}
.doc-day-no{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.doc-day-wk{color:var(--sub);font-weight:600;font-size:13px}
.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 12px}
.doc-table th{background:#f6f6f9;text-align:left;padding:7px 10px;font-size:11px;color:var(--sub);font-weight:800;letter-spacing:.5px}
.doc-table td{padding:7px 10px;border-bottom:1px solid #f0f0f4;vertical-align:top}
.doc-table .d-time{white-space:nowrap;font-weight:700;color:var(--accent);font-size:11.5px}
.doc-table .d-path{font-weight:700}
.doc-table .d-trans{white-space:nowrap}
.doc-table .d-det{color:#55556a;font-size:11.5px}
.doc-table .d-note{color:var(--sub);font-size:11.5px}
.doc-table.exp{width:72%}
.doc-table .d-amt{font-weight:800;text-align:right;white-space:nowrap}
.doc-empty{color:var(--sub);font-size:12.5px;font-style:italic;margin:6px 0 12px}
.doc-lodge{display:inline-flex;align-items:center;gap:8px;background:#fff8f0;border:1px solid #ffe8cc;border-radius:12px;padding:9px 15px;font-size:12.5px;margin:4px 0 12px}
.doc-lodge-price{color:#b0712e;font-weight:800;margin-left:8px}
.doc-day-sum{display:flex;flex-wrap:wrap;gap:8px 18px;background:#fafafc;border-radius:12px;padding:10px 15px;font-size:12.5px;color:var(--sub);margin-top:6px}
.doc-day-sum b{color:var(--accent)}
.doc-note{font-style:italic;color:var(--sub);flex-basis:100%}
.doc-total{display:flex;flex-wrap:wrap;gap:10px 30px;background:linear-gradient(135deg,var(--ink),#3a3a52);color:#fff;border-radius:16px;padding:18px 26px;margin-top:26px;font-size:14px}
.doc-total b{color:#FFC24B}

/* ============ 平板适配（HD 版，body.pad） ============ */
/* 平板逻辑宽度常落在 700~1100px，强制走宽屏双列布局 + 加大触控目标 */
body.pad { font-size: 15px; }

body.pad .day-head { padding: 16px 22px; }

body.pad .modal { max-width: 720px; }

body.pad .seg-row input { width: 108px; }

/* ============ 手机端适配（≤560px） ============ */

  .day-badge { min-width: 46px; height: 46px; }

/* ============ 打印 ============ */
@media print{
  body *{visibility:hidden!important}
  #view-journal,#view-journal *{visibility:visible!important}
  #doc,#doc *{visibility:visible!important}
  #view-journal{position:static!important;background:#fff!important}
  #doc{position:static!important;background:#fff!important;display:block!important}
  .journal-toolbar{display:none!important}
  .doc-toolbar{display:none!important}

}

<body>

<header id="topbar">
  <div class="logo">🌍 <span>我的行程</span></div>
  <div class="spacer"></div>
  <span id="save-state"></span>
  <button class="btn btn-ghost btn-small" id="btn-export" title="导出数据（备份/迁移）">📤 <span class="lbl">导出</span></button>
  <button class="btn btn-ghost btn-small" id="btn-import" title="导入数据">📥 <span class="lbl">导入</span></button>
  <button class="btn btn-ghost btn-small" id="btn-data" title="设置">⚙️</button>
  <button class="btn btn-ghost" id="btn-back" hidden>← <span class="lbl">返回列表</span></button>
  <button class="btn btn-ghost" id="btn-preview" hidden>📖<span class="lbl"> 旅行记录</span></button>
  <button class="btn btn-ghost" id="btn-pdf" hidden>📄<span class="lbl"> 生成 PDF 文档</span></button>
  <button class="btn btn-primary" id="btn-new">＋<span class="lbl"> 新建大行程</span></button>
</header>

<main>
  <!-- 视图1：大行程列表 -->
  <section id="view-list">
    <div class="hero">
      <h1>我的大行程</h1>

/** 地图库是否已就绪（Leaflet 为异步动态加载） */
const isMapReady = () => window.leafletReady === true || !!window.L;
/** 瓦片层：高德栅格瓦片（国内快、中文标注、免 Key）优先，连续失败自动降级 OpenStreetMap */
function baseTileLayer() {
  const urls = [
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',

/* ================================================================

let state = { trips: [] };
let currentTripId = null;
let saveTimer = null;
let saving = false;
let dataMode = 'server'; // 'server'（电脑 Node 服务）| 'local'（手机本地 localStorage，APK/离线模式）

async function loadData() {
  try {
    const r = await fetch('/api/trips');
    if (!r.ok) throw new Error(String(r.status));
    state = await r.json();
    if (!Array.isArray(state.trips)) state = { trips: [] };
    dataMode = 'server';
  } catch (e) {
    // 电脑服务不可用（如 APK 内 WebView）→ 降级为手机本地存储
    dataMode = 'local';
    try {
      const raw = localStorage.getItem('trips-data');
      state = raw ? JSON.parse(raw) : { trips: [] };
    } catch (_) { state = { trips: [] }; }
    if (!Array.isArray(state.trips)) state = { trips: [] };
  }
  render();
  // App 启动后重新同步提醒到系统闹钟（覆盖已过期的）
  (state.trips || []).forEach(t => syncReminders(t));
}

function saveNow() {
  if (saving) { scheduleSave(); return; }
  saving = true;
  setSaveState('保存中…');
  clearTimeout(saveTimer);
  if (dataMode === 'local') {
    try {
      localStorage.setItem('trips-data', JSON.stringify(state));
      setSaveState('✓ 已保存到本机 ' + new Date().toTimeString().slice(0, 5));
    } catch (_) { setSaveState('⚠️ 保存失败'); }

  }
  fetch('/api/trips', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },

  }).then(r => {
    if (!r.ok) throw new Error(r.status);
    setSaveState('✓ 已保存 ' + new Date().toTimeString().slice(0, 5));
  }).catch(() => setSaveState('⚠️ 保存失败，请检查服务'))
    .finally(() => { saving = false; });
}
const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); };
function setSaveState(t) { $('#save-state').textContent = t; }

/** 收集大行程全部提醒 [{id, title, ts}] */
function collectReminders(t) {
  const list = [];
  Object.keys(t.days || {}).forEach(d => {
    (t.days[d].reminders || []).forEach(r => {
      if (r.title && r.date && !r.draft) {
        const ts = new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime();
        if (!isNaN(ts) && ts > Date.now()) list.push({ id: t.id + '-' + d + '-' + r.id, title: r.title, ts });
      }
    });
  });
  return list;
}
/** 检查通知/闹钟授权：未授权则提醒保存失败（自动删除该行） */
async function canRemind() {
  if (window.AndroidBridge && window.AndroidBridge.getNotifyPermission) {
    // Android：13+ 未授权 → 发起请求并视为失败；13- 默认允许
    if (window.AndroidBridge.getNotifyPermission() === 'denied') {
      if (window.AndroidBridge.requestNotifyPermission) window.AndroidBridge.requestNotifyPermission();
      return false;
    }
    return true;
  }
  if (window.Notification) {
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'default') {
      try { return (await Notification.requestPermission()) === 'granted'; } catch (_) { return true; }
    }
    return false;
  }
  return true; // 无 Notification 支持（极老浏览器）→ 允许（页面内提示仍可用）
}

/** 同步提醒：手机 App → Android 系统闹钟；网页 → 浏览器通知（页面打开时） */
function syncReminders(t) {
  if (!t) return;
  const list = collectReminders(t);
  if (window.AndroidBridge && window.AndroidBridge.scheduleAllReminders) {
    try { window.AndroidBridge.scheduleAllReminders(JSON.stringify(list)); } catch (_) {}
  } else if (Notification && Notification.permission === 'default' && list.length) {
    Notification.requestPermission();
  }
}
/** 网页到期检测：每分钟检查，到期弹浏览器通知 + 页面提示（页面需保持打开） */
function checkWebReminders() {
  const now = Date.now();
  let hit = false;
  (state.trips || []).forEach(t => Object.keys(t.days || {}).forEach(d => {
    (t.days[d].reminders || []).forEach(r => {
      if (r.title && r.date && !r.draft && !r.reminded) {
        const ts = new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime();
        if (!isNaN(ts) && ts <= now) {
          r.reminded = true;
          hit = true;
          showToast('⏰ 提醒：' + r.title);
          if (Notification && Notification.permission === 'granted') {
            try { new Notification('⏰ 我的行程提醒', { body: r.title }); } catch (_) {}
          }
        }
      }
    });
  }));
  if (hit) scheduleSave();
}
setInterval(checkWebReminders, 60000);

/** 导出全部数据为 JSON 文件（电脑 ⇄ 手机迁移） */

const getTrip = id => state.trips.find(t => t.id === id);
const emptyDay = () => ({ notes: '', lodging: { name: '', location: '', pricePerNight: 0, notes: '' },
  travelers: [], expenses: [], segments: [], pins: [] });

/* —— 统计 —— */
const CAT_COLORS = { '交通': '#4D96FF', '餐饮': 'var(--accent2)', '住宿': '#7B5CF0', '门票': '#4ECB71', '购物': '#F0619B', '其他': '#B0B0BC' };
function dayStats(day) {
  // 手动记账 + 路线价格（交通）+ 住宿价格（住宿）自动计入
  const segs = day.segments || [];
  const segExp = segs.reduce((s, x) => s + num(x.price), 0);
  const lodge = day.lodging;
  const lodgeExp = (lodge && (lodge.name || lodge.location)) ? num(lodge.pricePerNight) : 0;
  const expByCat = {};
  (day.expenses || []).forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + num(e.amount); });
  if (segExp) expByCat['交通'] = (expByCat['交通'] || 0) + segExp;
  if (lodgeExp) expByCat['住宿'] = (expByCat['住宿'] || 0) + lodgeExp;
  const exp = Object.values(expByCat).reduce((a, b) => a + b, 0);
  return {
    exp, expByCat, segs: segs.length,
    lodge: lodge && (lodge.name || lodge.location) ? lodge : null,
    pins: (day.pins || []).length,
  };
}
/** 每日总览环形图（按类别占比，中间总金额；图例可点击展开明细） */
function donutChart(expByCat) {
  const cats = Object.keys(expByCat || {}).filter(c => expByCat[c] > 0);
  const total = cats.reduce((s, c) => s + expByCat[c], 0);
  if (!total) return '';
  let acc = 0;
  const stops = cats.map(c => {
    const start = acc / total * 360;
    acc += expByCat[c];
    return `${CAT_COLORS[c] || '#B0B0BC'} ${start.toFixed(1)}deg ${(acc / total * 360).toFixed(1)}deg`;
  }).join(', ');
  const legend = cats.map(c =>
    `<span data-cat="${c}" title="点击查看该类别明细"><i style="background:${CAT_COLORS[c] || '#B0B0BC'}"></i>${catEmoji(c)}${c} ${Math.round(expByCat[c] / total * 100)}%</span>`).join('');
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${stops})"><div class="donut-hole">${fmtMoney(total)}</div></div>
    <div class="donut-legend">${legend}</div>
  </div>`;
}
/** 某类别下每一笔明细（手动记账 + 路线价格 + 住宿价格） */
function catDetails(day, cat) {
  const rows = [];
  (day.expenses || []).forEach(e => { if (e.category === cat && num(e.amount)) rows.push({ label: e.item || '未命名', amt: num(e.amount) }); });
  if (cat === '交通') (day.segments || []).forEach(s => { if (num(s.price)) rows.push({ label: `${emojiOf(s.transport)} ${(s.from || '?')}→${(s.to || '?')}`, amt: num(s.price) }); });
  if (cat === '住宿') {
    const lg = day.lodging;
    if (lg && num(lg.pricePerNight)) rows.push({ label: `${lodgeEmoji(lg.type && LODGE_TYPES.includes(lg.type) ? lg.type : '酒店')} 住宿${lg.name ? ' · ' + lg.name : ''}`, amt: num(lg.pricePerNight) });
  }
  return rows;
}
function tripStats(trip) {
  const dates = Object.keys(trip.days || {}).sort();
  let exp = 0, segs = 0, lodges = 0;
  dates.forEach(d => { const s = dayStats(trip.days[d]); exp += s.exp; segs += s.segs; if (s.lodge) lodges++; });
  const budget = num(trip.budget);
  return { days: dates.length, exp, segs, lodges, budget, dates };
}
function tripTravelers(trip) { return trip.travelers || []; }
function dayTravelers(trip, day) { return day.travelers && day.travelers.length ? day.travelers : tripTravelers(trip); }
function budgetColor(remain) { return remain >= 0 ? (remain < 100 ? '#FFC24B' : '#4ECB71') : '#e5484d'; }

/** 每日首末点：每天第一个行程段的出发地 + 最后一个行程段的到达地 */
function tripDayEndpoints(trip) {
  const st = tripStats(trip);
  const pts = [];
  st.dates.forEach(d => {
    const segs = (trip.days[d].segments || []).filter(s => !s.draft);
    if (!segs.length) return;
    const first = segs[0], last = segs[segs.length - 1];
    if (first && first.from && first.from.trim()) pts.push({ name: first.from.trim(), date: d, no: dayNo(trip, d) });
    if (last && last.to && last.to.trim() && !(first === last && first.from.trim() === last.to.trim()))
      pts.push({ name: last.to.trim(), date: d, no: dayNo(trip, d) });
  });
  return pts;
}

/** 全行程消费构成（按类别聚合，供预览页总环形图） */
function tripExpByCat(t) {
  const byCat = {};
  tripStats(t).dates.forEach(d => {
    const s = dayStats(t.days[d]);
    Object.entries(s.expByCat || {}).forEach(([c, v]) => { byCat[c] = (byCat[c] || 0) + v; });
  });
  return byCat;
}

/* —— 地理编码：根据地点文字找经纬度（免费无需 key，带本地缓存） ——
 * 优先 Open-Meteo（城市/地名中文支持好、响应快），失败回退 Photon（OSM 点位细、限定中国范围） */
const GEO_CACHE_KEY = 'geoCache';
function geoCache() { try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}'); } catch (e) { return {}; } }
async function geocodePlace(name) {
  const key = String(name).trim();
  if (!key) return null;
  const cache = geoCache();
  if (cache[key] !== undefined) return cache[key];
  let r = null;
  try {
    const u1 = 'https://geocoding-api.open-meteo.com/v1/search?count=1&language=zh&name=' + encodeURIComponent(key);
    const res1 = await fetch(u1, { headers: { 'Accept': 'application/json' } });
    if (res1.ok) {
      const d1 = await res1.json();
      const hit1 = d1 && d1.results && d1.results[0];
      if (hit1) r = { lat: parseFloat(hit1.latitude), lng: parseFloat(hit1.longitude) };
    }
  } catch (e) {}
  if (!r) {
    try {
      const u2 = 'https://photon.komoot.io/api/?limit=1&bbox=73.5,18.2,135.1,53.6&q=' + encodeURIComponent(key);
      const res2 = await fetch(u2, { headers: { 'Accept': 'application/json' } });
      if (res2.ok) {
        const d2 = await res2.json();
        const hit2 = d2 && d2.features && d2.features[0];
        if (hit2 && hit2.geometry) {
          const c = hit2.geometry.coordinates;
          if (c && c.length >= 2) r = { lat: parseFloat(c[1]), lng: parseFloat(c[0]) };
        }
      }
    } catch (e) {}
  }
  cache[key] = r;
  try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
  return r;
}

/* ================================================================
 * 渲染
 * ================================================================ */
function render() {
  const hash = location.hash;
  // 旅行记录独立页面：#/trip/{id}/journal
  const jm = hash.match(/^#\/trip\/([^\/]+)\/journal$/);
  if (jm) {
    const id = decodeURIComponent(jm[1]);
    if (getTrip(id)) { renderJournal(id); return; }
  }
  if (hash.startsWith('#/trip/')) {
    const id = decodeURIComponent(hash.slice(7));
    if (getTrip(id)) { renderDetail(id); return; }
  }
  renderList();
}

function renderList() {

/** 颜色变暗/变亮 */
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + pct / 100))));
  return '#' + [f(r), f(g), f(b)].map(x => pad2(x.toString(16))).join('');
}

/** 公共交通（显示车次/座位/乘客详情的交通方式） */
const PUB_TRANSPORTS = ['高铁', '飞机', '地铁', '公交', '游船'];
const LODGE_TYPES = ['酒店', '民宿', '青旅', '其他'];
const lodgeEmoji = ty => ({ '酒店': '🏨', '民宿': '🏡', '青旅': '🛏️', '其他': '🏠' })[ty] || '🏨';

/** 时间段显示：优先结构化 departTime/arriveTime，兼容旧 time 文本；跨天自动标 (+N) */
function timeRange(seg) {
  if (seg.departTime || seg.arriveTime) {
    const dep = seg.departTime || '';
    const arr = seg.arriveTime || '';
    if (dep && arr) {
      const cd = crossDays(seg);
      return cd > 0 ? dep + '-' + arr + ' (+' + cd + ')' : dep + '-' + arr;
    }
    return [dep, arr].filter(Boolean).join('-');
  }
  return seg.time || '—';
}
/** 跨天天数：显式 crossDays 优先；否则到达<出发自动视为 +1；结束≥开始且仅残留 +1 时按当天处理 */
function crossDays(seg) {
  if (seg.crossDays && Number(seg.crossDays) > 1) return Number(seg.crossDays); // 显式 +2/+3 必是用户设置
  if (seg.departTime && seg.arriveTime) {
    if (seg.arriveTime < seg.departTime) return Number(seg.crossDays) > 0 ? Number(seg.crossDays) : 1;
    // 结束 ≥ 开始：当天（除非显式 >1）
    return 0;
  }
  return 0;
}
const isCrossDay = seg => crossDays(seg) > 0;
/** 跨天可编辑的交通方式（长途交通可调 +1~+4；步行/地铁/公交等默认 +1 固定） */
const CROSS_EDITABLE = ['飞机', '高铁', '自驾', '租车'];
/** 跨天段的后续接续段（dayOffset=1..N）：全天接续 + 到达日 00:00→到达 */
function nextDayTails(day) {
  const tails = [];
  (day.segments || []).forEach(s => {
    const cd = crossDays(s);
    if (cd > 0 && s.arriveTime) {
      const [h, m] = s.arriveTime.split(':').map(Number);
      for (let k = 1; k <= cd; k++) {
        tails.push({
          from: s.from || '?', to: s.to || '?', transport: s.transport,
          dayOffset: k,
          arrive: k === cd ? s.arriveTime : '24:00',
          dur: k === cd ? h * 60 + m : 1440,
        });
      }
    }
  });
  return tails;
}
/** 段的当天部分时长（跨天段 = 出发→24:00；普通段 = 全程） */
function dayPartDuration(seg) {
  if (isCrossDay(seg)) {
    const [h, m] = seg.departTime.split(':').map(Number);
    return 1440 - (h * 60 + m);
  }
  return segDuration(seg);
}
/** 解析出出发/到达时间（供时间选择器回填；旧数据 time="10:30-11:30" 自动拆分） */
function segTimes(seg) {
  if (seg.departTime || seg.arriveTime) return { depart: seg.departTime || '', arrive: seg.arriveTime || '' };
  const m = String(seg.time || '').match(/(\d{1,2}:\d{2})\s*[-–—→~]\s*(\d{1,2}:\d{2})/);
  return m ? { depart: m[1], arrive: m[2] } : { depart: '', arrive: '' };
}
/** 交通方式颜色（每日总览路线条） */
const TRANS_COLORS = {
  '高铁': '#4D96FF', '飞机': '#7B5CF0', '地铁': '#0FB5AE', '公交': '#4ECB71',
  '打车': 'var(--accent2)', '自驾': '#FF8C42', '步行': '#B0B0BC', '游船': '#38B2AC',
  '骑行': '#F0619B', '其他': '#8A8A9A',
};
const transColor = tr => TRANS_COLORS[tr] || '#8A8A9A';
/** 计算路线段时长（分钟）：优先结构化时间（含跨天 +N 天），兼容 time 文本与 "4h" 写法 */
function segDuration(seg) {
  if (seg.departTime && seg.arriveTime) {
    const a = seg.departTime.split(':').map(Number), b = seg.arriveTime.split(':').map(Number);
    let m = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]) + 1440 * crossDays(seg);
    if (m < 0) m += 1440;
    return m;
  }
  const t = String(seg.time || '');
  const mm = t.match(/(\d{1,2}):(\d{2})\s*[-–—→~]\s*(\d{1,2}):(\d{2})/);
  if (mm) {
    let m = (Number(mm[3]) * 60 + Number(mm[4])) - (Number(mm[1]) * 60 + Number(mm[2]));
    if (m < 0) m += 1440;
    return m;
  }
  const h = t.match(/(\d+(?:\.\d+)?)\s*h/i);
  return h ? Math.round(parseFloat(h[1]) * 60) : 0;
}
/** 分钟 → "4h" / "45m" / "1h30m" */
function fmtDur(min) {
  if (!min) return '';
  if (min < 60) return min + 'm';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + 'h' + m + 'm' : h + 'h';
}
/** 乘客数据规范化：一律返回 [{name, seat}]（兼容旧数据字符串数组 + 单值 seat） */
function normPax(seg) {
  if (!seg || !Array.isArray(seg.passengers)) return [];
  const ps = seg.passengers;
  if (ps.length && typeof ps[0] === 'string') {
    // 旧数据：字符串数组，seg.seat 为整段单值 → 给第一个乘客
    return ps.map((n, i) => ({ name: n, seat: i === 0 && seg.seat ? seg.seat : '' }));
  }
  return ps.map(p => (typeof p === 'string' ? { name: p, seat: '' } : p));
}
/** 乘客展示文本：'我（3车5D）、小美' */
function paxText(seg) {
  return normPax(seg).map(p => p.seat ? `${p.name}（${p.seat}）` : p.name).join('、');
}
