<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌍 我的行程</title>
<!-- Leaflet 地图（动态加载：jsdelivr 优先，失败自动切 unpkg；免费无需 Key） -->
<script>
(function () {
  function loadScript(urls, ok, fail) {
    if (!urls.length) return fail();
    var s = document.createElement('script');
    s.src = urls[0];
    s.onload = ok;
    s.onerror = function () { loadScript(urls.slice(1), ok, fail); };
    document.head.appendChild(s);
  }
  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
  css.onerror = function () { css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; };
  document.head.appendChild(css);
  loadScript(['https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
              'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'],
             function () { window.leafletReady = true; },
             function () { window.__mapFail = true; });
})();
</script>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#f4f4f7; --card:#ffffff; --ink:#1c1c28; --sub:#8a8a9a;
  --line:#ececf1; --radius:16px;
  --accent:#FF6B6B; --accent2:#FF8F8F; --accent-soft:#fff0f0; --accent-border:#ffc9c9; --accent-shadow:rgba(255,107,107,.35);
  /* 消费构成色板默认值（珊瑚红派生，行程主题会覆盖）：交通深 → 其他浅 */
  --cat-1:#AD4949; --cat-2:#DB5C5C; --cat-3:#FF6B6B; --cat-4:#FF9A9A; --cat-5:#FFBCBC; --cat-6:#FFDADA;
  --shadow:0 2px 14px rgba(28,28,60,.07);
}
/* 大主题已移除：默认珊瑚红为应用底色；每个出行计划用自己创建时选的颜色（详情/记录/PDF 按行程独立配色） */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:7px 10px;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=color]{padding:2px;width:42px;height:32px;cursor:pointer}
textarea{resize:vertical}
.hidden{display:none!important}

/* ============ 顶栏 ============ */
#topbar{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 22px;
}
#topbar .logo{font-size:20px;font-weight:800;letter-spacing:.5px}
/* 顶栏按钮纯图标（所有设备），文字隐藏；导出/导入入口在 ⚙️ 设置中 */
#topbar .lbl{display:none}
#btn-export,#btn-import{display:none}
/* 顶栏图标按钮尺寸统一（纯图标、无文字） */
#btn-back,#btn-pdf,#btn-new,#btn-data{padding:8px 12px;font-size:13.5px}
#topbar .spacer{flex:1}
#save-state{font-size:12px;color:var(--sub);margin-right:6px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;transition:transform .1s,box-shadow .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#FF6B6B,var(--accent2));color:#fff;box-shadow:0 4px 14px var(--accent-shadow)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#d8d8e0}
.btn-danger{background:#fff;color:#e5484d;border:1px solid #f3c1c3}
.btn-small{padding:4px 10px;font-size:12px;border-radius:999px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:#55556a;transition:background .15s,color .15s}
.icon-btn:hover{background:#e8e8ef;color:var(--ink)}
.icon-btn:hover .trash-icon{stroke:#e5484d}
.icon-btn:hover .pencil-icon{stroke:#3d5af1}
.trash-icon,.pencil-icon{display:block;flex-shrink:0}
/* 编辑控件字体统一 */
.seg-row input,.seg-row select,.seg-detail input,.seg-detail select,
.exp-row input,.exp-row select,.lodge-grid input,.lodge-grid select{
  font-size:13px!important;font-weight:500}
.done-btn,.icon-btn,.add-row-btn,.pax-add-btn{font-size:13px}

/* ============ 列表页 ============ */
#view-list{max-width:1080px;margin:26px auto;padding:0 22px}
#view-list .hero{margin-bottom:22px;text-align:center}
#view-list .hero h1{font-size:26px;font-weight:800}
#view-list .hero p{color:var(--sub);margin-top:2px}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.trip-card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s,box-shadow .2s;display:flex;flex-direction:column;
}
.trip-card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(28,28,60,.12)}
.trip-cover{
  position:relative;height:118px;display:flex;align-items:center;justify-content:center;
}
.trip-cover::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.35),transparent 55%)}
.trip-cover .big-emoji{font-size:46px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18));z-index:1}
.trip-cover .days-chip{
  position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);color:var(--ink);
  font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;z-index:1;
}
.trip-body{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px}
.trip-body h3{font-size:17px;font-weight:800}
.trip-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--sub);font-size:12.5px}
.trip-meta .dot{color:#d5d5dd}
.trip-foot{display:flex;align-items:center;gap:10px;margin-top:4px}
.budget-bar{flex:1;height:7px;border-radius:99px;background:#f0f0f5;overflow:hidden}
.budget-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF6B6B,#FFC24B);transition:width .4s}
.trip-foot .spend{font-size:12.5px;color:var(--sub);white-space:nowrap}
.empty-state{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--sub);
}
.empty-state .big{font-size:52px;margin-bottom:12px}
.empty-state p{font-size:15px}

/* ============ 详情页 ============ */
#view-detail{max-width:1180px;margin:0 auto;padding:0 22px 60px}
.detail-head{display:flex;align-items:center;gap:14px;padding:18px 0 4px;flex-wrap:wrap}
.detail-head h1{font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.detail-head .sub{color:var(--sub);font-size:13px;margin-top:2px}
.stat-strip{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0 6px}
.stat-card{
  background:var(--card);border-radius:14px;padding:10px 18px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:110px;
}
.stat-card .num{font-size:19px;font-weight:800}
.stat-card .lbl{font-size:11.5px;color:var(--sub)}
/* 合并长框：日期 / 天数 / 出行人 / 总预算 / 总花费 / 预算结余（内容自适应长度，窄屏自动换行） */
.stat-card.stat-long{flex-direction:row;align-items:center;gap:14px 22px;min-width:0;flex:1 1 auto;max-width:780px;flex-wrap:wrap;width:fit-content}
.stat-long .sl-item{display:flex;flex-direction:column;white-space:nowrap}
.stat-long .sl-item .num{font-size:16px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.stat-long .sl-item .lbl{font-size:11px;color:var(--sub)}
.stat-long .sl-item .num.over{color:#e5484d}
.stat-long .sl-div{width:1px;height:30px;background:var(--line)}
.detail-body{display:grid;grid-template-columns:210px 1fr;gap:26px;margin-top:20px;align-items:start}
.day-nav{position:sticky;top:76px;display:flex;flex-direction:column;gap:8px}
/* 二级标题（左侧导航）：旅行清单 / 每日行程；文字黑色，金额（日期旁￥）保持主题色 */
.day-nav .nav-title{font-size:15px;font-weight:800;color:var(--ink);margin:8px 0 4px;padding-left:4px}
.day-nav .nav-link{cursor:pointer;border-radius:8px;padding:3px 4px}
.day-nav .nav-link:hover{background:transparent}
.day-nav button{
  text-align:left;padding:6px 8px;border-radius:8px;background:transparent;border:none;
  display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--ink);
  font-family:'PingFang SC','HarmonyOS Sans SC','MiSans','Noto Sans CJK SC',sans-serif;letter-spacing:.5px;
}
/* 纯文字日期导航：文字黑色、无底色；金额（日期旁￥）保持主题色 */
.day-nav button:hover{background:transparent;transform:none;color:var(--ink)}
.day-nav button .d{font-weight:900;font-size:13px;min-width:40px;flex:0 0 40px;text-align:left;color:var(--ink)}
.day-nav button .w{font-size:13px;font-weight:600;color:var(--ink)}
.day-nav button .info{color:var(--accent);font-weight:800;font-size:13px;margin-left:auto;white-space:nowrap;font-style:italic;text-align:right}
.day-nav button.empty{opacity:.45}
.day-nav .nav-dates.hidden{display:none}
/* 折叠箭头：主题色钝角箭头（约110°张角）；展开朝上 ▲（收起列表）、收起朝下 ▼（展开列表），180°翻转不变形；与标题文字垂直居中 */
.nav-caret{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;flex-shrink:0;
  color:var(--accent);vertical-align:middle;transition:transform .3s cubic-bezier(.4,1.4,.4,1)}
.nav-caret svg{display:block}
.day-nav .nav-title.collapsed .nav-caret{transform:rotate(180deg)}
.days-col{display:flex;flex-direction:column;gap:20px}

/* —— 每日卡片 —— */
.day-card{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;
  border:1px solid var(--line);
}
.day-card.flash{animation:flashBg 1.6s ease}
@keyframes flashBg{0%{box-shadow:0 0 0 3px rgba(255,107,107,.5)}100%{box-shadow:var(--shadow)}}
.day-head{
  display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(135deg,#fff,#fafaff);
}
.day-badge{
  min-width:56px;height:56px;border-radius:14px;background:linear-gradient(160deg,var(--accent),var(--accent2));
  color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;
  box-shadow:0 4px 12px var(--accent-shadow);flex-shrink:0;
}
.day-badge .n{font-size:20px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.day-badge .w{font-size:11px;opacity:.95;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.day-head .day-info{flex:1}
.day-head .day-info h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
.day-head .day-info h3 .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.day-head .day-cost{text-align:right;align-self:flex-end;padding-bottom:2px}
/* 天气徽章：胶囊浅底，悬停主题色；空态虚线占位 */
.wx-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#55556a;background:#f0f6ff;border:1px solid #d8e6fa;border-radius:999px;padding:2px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.wx-badge:hover{border-color:var(--accent);color:var(--accent)}
.wx-badge.wx-empty{background:#fafafc;border-style:dashed;color:var(--sub);font-weight:400}

/* 俏皮日期选择器：触发条（虚线）+ 自绘日历面板 */
.dp-trigger{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px;color:var(--ink);background:#fff;transition:border-color .15s}
.dp-trigger:hover{border-color:var(--accent)}
.dp-trigger::after{content:"📅";font-size:13px;opacity:.6}
.dp-trigger.empty{color:var(--sub)}
.dp-panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(28,28,60,.12);padding:12px;margin-top:8px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dp-head button{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:var(--accent);background:var(--accent-soft);border:none;cursor:pointer;transition:all .15s}
.dp-head button:hover{background:var(--accent-border);transform:scale(1.1)}
.dp-title{font-size:13.5px;font-weight:800;color:var(--ink)}
.dp-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10.5px;color:var(--sub);margin-bottom:4px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-d{height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;cursor:pointer;color:var(--ink);transition:background .12s}
.dp-d:hover{background:var(--accent-soft)}
.dp-d.disabled{color:#d9d9e2;pointer-events:none}
.dp-d.sel{background:var(--accent);color:#fff;font-weight:800}
.dp-d.today{position:relative;color:var(--accent);font-weight:700}
.dp-d.today::after{content:"";position:absolute;inset:0;border:1.5px dashed var(--accent);border-radius:50%;pointer-events:none}
.dp-d.today.sel{color:#fff}
.dp-d.today.sel::after{display:none}


.day-head .day-cost .amt{font-size:18px;font-weight:800;color:var(--accent)}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.block{padding:18px 24px;border-bottom:1px solid var(--line)}
.block.col-left{grid-column:1;border-right:1px solid var(--line)}
.block.col-right{grid-column:2;border-right:none}
.block.full{grid-column:1/-1;border-right:none}
.block.lodge-block{padding:18px 24px}
/* 左右独立列：左列（住宿+总览）紧贴，右列（记账）独立高度，互不影响 */
.day-col{display:flex;flex-direction:column}
.day-col .block{border-right:none}
.day-col.col-l{border-right:1px solid var(--line)}
@media(max-width:860px){.detail-body{grid-template-columns:1fr}.day-nav{position:static;flex-direction:row;flex-wrap:wrap}
  /* grid 子项允许收缩：防止 day-nav 横向滚动条/段内容把整页撑宽（手机端横向溢出） */
  .detail-body>*,.day-grid>*{min-width:0}
  .day-grid{grid-template-columns:1fr}.block.col-left,.block.col-right{grid-column:1/-1;border-right:none}.day-col{grid-column:1/-1}.day-col.col-l{border-right:none}}
.block-title{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:1px;margin-bottom:10px;
  display:flex;align-items:center;gap:7px}
.block-title .tag{font-size:16px;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;line-height:1}
.add-row-btn{
  display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;border:1.5px dashed var(--accent-border);transition:all .15s;margin:6px 0 0;
}
.add-row-btn:hover{background:var(--accent-soft)}

/* 路线段 */
.seg-wrap.editing{border:1.5px dashed var(--accent-border);background:#fffaf5;border-radius:14px;padding:8px 12px;margin:4px 0}
.seg-wrap{border-bottom:1px dashed var(--line)}
.seg-wrap:last-child{border-bottom:none}
/* ============ 路线段展示 ============
   统一间距：所有相邻列之间一律 12px（.seg-view / .seg-main / .seg-trail 的 gap 全为 12px）
   列顺序：≡ [时间戳] [出发地→目的地] [交通·乘客·价格] [编辑/删除]
   - 主行(时间/路径)永在一行、顶对齐 → 与 ≡ 天然平齐
   - 乘客+价格整组换行（seg-trail.newline），第二行起点与时间列左缘对齐
   - 按钮独立于主行容器，永远停第一行末尾（margin-left:auto + JS 校准中心） */
.seg-view{display:flex;align-items:flex-start;gap:12px;padding:6px 2px;line-height:1.5}
.seg-view .drag-handle{flex-shrink:0}
/* 主行容器：水平列距 12px（与全列统一），垂直行距 6px（乘客行紧凑贴主行，主次分明，避免与段间距同级） */
.seg-main{display:flex;align-items:flex-start;column-gap:12px;row-gap:6px;flex-wrap:wrap;flex:1;min-width:0}
/* 拖动图标：≡ 右对齐贴框右缘 → 与时间戳间距 = gap 6px（与其余列间距一致） */
.drag-handle{color:#c9c9d4;font-size:14px;cursor:grab;user-select:none;flex-shrink:0;letter-spacing:-3px;width:22px;line-height:1.5;padding:0;border-radius:6px;text-align:right}
.drag-handle:hover{color:var(--accent);background:var(--accent-soft)}
/* 时间列：内容宽、左对齐；等宽数字(tabular-nums)使 09:30-09:45 与 10:00-11:00 长度一致，不因数字字形占位不同而参差 */
.seg-view-time{flex:none;font-size:14px;font-weight:400;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;position:relative;margin-right:4px}
/* 跨天角标：绝对定位在时间列右缘（不占布局宽度）→ 跨天行与普通行时间列等宽，出发地列对齐 */
.seg-cross-badge{position:absolute;right:-13px;top:0;font-size:9px;font-weight:700;color:#a0a0b0;line-height:1;white-space:nowrap;pointer-events:none}
/* 路径：超长时缩小字号（优先完整显示）；极长才省略兜底 */
.seg-view-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw;min-width:0;flex-shrink:1;font-weight:400;font-size:14px;color:var(--ink);margin-right:2px}
.seg-view-path b{font-weight:400}
.seg-view-path.seg-path-sm{font-size:13px}
.seg-view-path.seg-path-xs{font-size:12.5px}
.seg-view-path .arr{color:var(--sub);font-weight:400;margin:0 4px}
/* 乘客 chip：宽度=文字长度，不压缩不溢出 */
.seg-view-dets{display:inline-flex;gap:6px;flex-wrap:wrap;min-width:0;flex-shrink:0}
/* 乘客+价格一组：有乘客时强制换行到第二行（flex-basis:100%），左缘与时间列对齐；无乘客（仅价格）留在主行 */
.seg-trail{display:inline-flex;align-items:center;gap:12px;flex-shrink:0;min-width:0}
.seg-trail.newline{flex-basis:100%}
.seg-view-trans{font-size:14px;font-weight:400;color:var(--ink);white-space:nowrap;flex-shrink:0}
.seg-view-chip{font-size:13px;font-weight:400;color:var(--ink);white-space:nowrap}
/* 金额：主题色加粗纯文字（跟随行程主题色），无底色 */
.seg-view-price{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;flex-shrink:0}
/* 编辑/删除：独立于主行，margin-left:auto 推右 → 永远在第一行末尾（JS 校准垂直居中） */
.seg-view-actions{margin-left:auto;align-self:flex-start;flex-shrink:0;display:flex;gap:2px}
/* 备注小图标（💬）：缩小与文字统一 */
.note-emoji{font-style:normal;font-size:10px;margin-right:2px}
/* 备注：最后一行；💬 图标左缘与拖动图标 ≡ 字符左缘对齐（≡ 右对齐贴框右缘，字符左缘约 19px） */
.seg-view-sub{font-size:12px;color:var(--sub);text-align:left;padding:0 0 4px 19px;line-height:1.5;margin-top:-5px}
.seg-view[draggable="true"]{cursor:grab}
.seg-view[draggable="true"]:active{cursor:grabbing}
.seg-view.dragging,.exp-view.dragging{opacity:.35}
.seg-view.drag-over,.exp-view.drag-over{box-shadow:0 -3px 0 0 var(--accent)}
.seg-view.drag-over-after,.exp-view.drag-over-after{box-shadow:0 3px 0 0 var(--accent)}
.done-btn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  background:#eef7ef;color:#2e8b57;font-weight:900;flex-shrink:0;transition:all .15s}
.done-btn:hover{background:#d8efdb;transform:scale(1.08)}
.done-btn.gray{background:#f2f2f7;color:var(--sub)}
.done-btn.gray:hover{background:#e6e6ee;color:#e5484d}
.seg-row{display:flex;align-items:center;gap:5px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
/* 编辑态行程表单：固定五行（①时间 ②出发地点 ③目的地 ④交通+价格 ⑤备注+按钮），不随意换行 */
.seg-wrap.editing .seg-row{flex-direction:column;align-items:stretch;gap:8px;flex-wrap:nowrap}
.seg-wrap.editing .seg-line{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.seg-wrap.editing .seg-line .arr{flex-shrink:0}
.seg-wrap.editing .seg-from,.seg-wrap.editing .seg-to{width:auto;flex:1;min-width:0}
.seg-wrap.editing .seg-trans{flex:0 1 auto;width:auto;min-width:0}
.seg-wrap.editing .seg-vehicle{width:150px;flex:0 1 auto;min-width:0}
.seg-wrap.editing .seg-price-row{width:148px}
.seg-wrap.editing .seg-note-input{width:100%;flex-basis:100%}
.seg-wrap.editing .seg-time-sel{width:64px}
/* 时间下拉（时/分）：两个小 select + 冒号，替代系统时间滚轮；「-」= 不输入 */
.time-sel{display:inline-flex;align-items:center;gap:1px;flex-shrink:0}
.time-sel .seg-time-sel{width:58px;flex-shrink:0;text-align:center;color:var(--ink);padding:5px 2px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:13.5px;font-weight:700;-webkit-appearance:none;appearance:none}
.time-sel .time-sel-colon{font-style:normal;color:var(--sub);font-weight:800}
.ef-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
/* 价格输入统一：无默认 0、斜体小字提示（全篇通用） */
/* 提示文字统一：所有 placeholder 斜体 13px（参考备注输入框提示） */
input::placeholder,textarea::placeholder{font-style:italic;font-size:13px;color:var(--sub);opacity:.8;text-align:left}
/* 价格输入框提示文字靠右（输入框已加宽，保证完整显示） */
.seg-price-row::placeholder,.edit-form .amount::placeholder,.edit-form .amt::placeholder,.exp-row .amt::placeholder,.lodge-grid input.amount::placeholder{text-align:right}
/* 去掉 number 输入框自带 +/- 箭头（会挡住靠右的提示文字） */
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-webkit-appearance:none;appearance:none;-moz-appearance:textfield}
.edit-form .amount{width:148px;flex:0 0 auto;text-align:right}
.edit-form .amt{width:148px;flex:0 0 auto;text-align:right}
/* 备注独占一行：输入长内容也能看全 */
.seg-row input.seg-note-input{flex-basis:100%;width:100%!important;min-width:0}
.seg-row:last-child{border-bottom:none}
.seg-time{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:8px;white-space:nowrap}
.seg-path{font-weight:700;font-size:13.5px;white-space:nowrap}
.seg-path .arr{color:var(--sub);font-weight:400;margin:0 3px}
.seg-trans{width:auto;padding:6px 9px;font-size:13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.seg-note{font-size:12px;color:var(--sub);flex:1;min-width:80px}
.seg-row input{width:88px;padding:4px 6px;font-size:12.5px;border-radius:8px}
/* 出发地/目的地输入框：尽量加长（20 字上限不吞字），行内弹性分配 */
.seg-row input.seg-from,.seg-row input.seg-to{flex:1 1 150px;min-width:120px}
.seg-row input[type=time]{width:80px;padding:4px 3px;font-size:13px;flex-shrink:0}
.seg-row input.seg-time{width:80px;padding:4px 6px;font-size:13px;flex-shrink:0;text-align:center}
.seg-row input.seg-price{width:76px;flex-shrink:0}
.exp-note-input{flex-basis:100%;width:100%!important;padding:4px 8px;font-size:12px;border-radius:8px;border-color:#eee}
.exp-view-note{font-size:12px;color:var(--sub);padding:0 0 4px 2px;line-height:1.5;margin-top:-2px}
.seg-row select{width:82px;padding:4px 4px;font-size:12.5px;border-radius:8px;flex-shrink:0}
/* 时间下拉：时/分窄下拉 + 冒号分隔，'-' 表示不输入 */
.seg-row input.seg-time-native{width:84px;flex-shrink:0;text-align:center;color:var(--ink)}
.seg-row input.seg-time-native::-webkit-datetime-edit{text-align:center}
.seg-row input.seg-time-native.empty{color:transparent}
.seg-row input.seg-time-native.empty::-webkit-datetime-edit-fields-wrapper{visibility:hidden}
.seg-row .arr{flex-shrink:0}
.seg-toggle{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;background:var(--accent);flex-shrink:0;transition:transform .2s,background .15s;
  box-shadow:0 2px 6px var(--accent-shadow)}
.seg-toggle svg{display:block}
.seg-toggle:hover{background:var(--accent2)}
.seg-toggle.open{transform:rotate(90deg);background:var(--accent);color:#fff}
.seg-detail{display:none;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;background:#fafafc;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;margin:6px 0 10px}
.seg-detail.open{display:grid}
.seg-detail-label{font-size:11px;color:var(--sub);font-weight:700;white-space:nowrap;display:flex;align-items:center}
.seg-detail-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg-detail-row .f{display:flex;flex-direction:column;gap:2px}
.seg-detail-row .f label{font-size:10.5px;color:var(--sub);font-weight:700}
.seg-detail-row input{width:110px;padding:5px 8px;font-size:12.5px;border-radius:8px}
.seg-detail-row input.small{width:80px}
.seg-detail-row input.wide{width:150px}
.seg-detail-row input[type=time]{width:92px}
.seg-pax-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.seg-pax-chips .chip{padding:3px 10px;font-size:12px;background:#eef4ff;color:#3d5af1}
.seg-pax-chips .chip.self{background:#fff4e8;color:#b0712e}
.pax-add-btn{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12px;font-weight:700;
  padding:4px 10px;border-radius:999px;border:1.5px dashed var(--accent-border);white-space:nowrap}
.pax-add-btn:hover{background:var(--accent-soft)}

/* 住宿（紧凑：一晚上的事，不占大空间） */
.lodge-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.lodge-grid .f{display:flex;flex-direction:column;gap:2px}
.lodge-grid .f label{font-size:11px;color:var(--sub)}
.lodge-grid input{padding:4px 8px;font-size:13px}
.lodge-grid input.amount{width:170px}
.lodge-grid select{width:110px;padding:4px 8px;font-size:13px;border-radius:10px}
.lodge-notes{margin-top:6px}
.lodge-notes input{width:100%;padding:4px 8px;font-size:13px}
.lodge-none{color:var(--sub);font-size:13px;font-style:italic;margin:6px 0 10px}
/* 住宿展示态（紧凑对齐版） */
.lodge-view{display:flex;flex-direction:column;gap:3px;padding:1px 0}
.lodge-view-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lodge-view-type{font-size:14px;line-height:1.5;display:inline-flex;align-items:center;flex-shrink:0}
.lodge-view-name{font-weight:400;font-size:14px;color:var(--ink);line-height:1.5}
.lodge-view-price{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap;line-height:1.5}
.lodge-view-sub{font-size:12px;color:var(--sub);padding-left:2px;line-height:1.5}
/* 住宿备注：独立一行（无论长短），与位置行同缩进 */
.lodge-view-note{font-size:12px;color:var(--sub);padding-left:2px;line-height:1.5}
.lodge-view-actions{display:flex;gap:2px;margin-left:auto}

/* 乘客选择面板 */
.pax-panel .pax-list{display:flex;flex-wrap:wrap;gap:9px;margin:6px 0 14px}
.pax-panel .pax-opt{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:999px;
  border:2px solid var(--line);font-size:14px;font-weight:700;transition:all .15s;user-select:none}
.pax-panel .pax-opt:hover{border-color:#ffb8b8}
.pax-panel .pax-opt.sel{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;
  box-shadow:0 3px 10px rgba(255,107,107,.3)}
.pax-panel .pax-custom{display:flex;gap:8px;align-items:center;margin-top:4px}
.pax-panel .pax-custom input{flex:1}
.pax-panel .pax-hint{font-size:13px;font-style:italic;color:var(--sub);margin-top:8px}
.pax-seats{display:flex;flex-direction:column;gap:8px;margin:12px 0 2px}
.pax-seat-row{display:flex;align-items:center;gap:8px;background:#fafafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pax-seat-name{font-weight:700;font-size:13px;min-width:72px}
.pax-seat-input{flex:1;max-width:220px;padding:5px 10px;font-size:12.5px;border-radius:8px}

/* 出行人 */
.traveler-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#f2f2f7;border-radius:999px;
  padding:4px 12px;font-size:13px;font-weight:600}
.chip .x{cursor:pointer;color:var(--sub);font-weight:800;padding:0 2px}
.chip .x:hover{color:#e5484d}
.chip.inherit{background:#fff4e8;color:#b0712e;font-size:12px}
.traveler-add{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:12.5px;font-weight:700;
  padding:5px 10px;border-radius:999px;border:1.5px dashed var(--accent-border)}
.traveler-add:hover{background:var(--accent-soft)}

/* 备注 */
.notes-box textarea{width:100%;min-height:64px;font-size:13px;background:#fafafc;border-color:transparent}
.notes-box textarea:hover{border-color:var(--line)}

/* 记账 */
.exp-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.exp-row:last-child{border-bottom:none}
/* 编辑表单通用容器（与「添加行程」同风格）：虚线圆角 + 竖排字段行 + 末行按钮 */
.edit-form{display:flex;flex-direction:column;gap:8px;border:1.5px dashed var(--accent-border);background:#fffaf5;border-radius:14px;padding:10px 12px;margin:6px 0}
.edit-form .ef-line{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.edit-form .ef-line input{flex:1;min-width:0}
.edit-form .ef-line select{flex:0 0 auto;min-width:0}
.edit-form .ef-line input.amount,.edit-form .ef-line input.amt{flex:0 0 auto;text-align:right}
.edit-form input,.edit-form select{width:100%;padding:6px 9px;font-size:13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.edit-form input:focus,.edit-form select:focus{border-color:var(--accent-border);outline:none}
.edit-form select{width:auto;flex:0 0 auto;padding:5px 8px;font-size:12.5px}
.edit-form .ef-actions{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.exp-row select{width:86px;padding:4px 6px;font-size:12.5px;border-radius:8px}
.exp-row .item{flex:1;min-width:110px;padding:4px 8px;font-size:12.5px;border-radius:8px}
.exp-row .amt{width:148px;padding:4px 8px;font-size:12.5px;border-radius:8px;text-align:right}
.exp-row .when{width:64px;padding:4px 6px;font-size:12px;border-radius:8px}
.exp-wrap{border-bottom:1px dashed var(--line)}
.exp-wrap:last-child{border-bottom:none}
.exp-view{display:flex;align-items:center;gap:8px;padding:5px 2px;flex-wrap:wrap;line-height:1.5}
.exp-view-cat{font-size:14px;font-weight:400;background:#f0f0f5;padding:3px 10px;border-radius:8px;color:#55556a;white-space:nowrap}
/* 内容区小图标（emoji）统一大小：12px 方块，视觉与 13-14px 文字协调 */
.ic{font-style:normal;font-size:12px;line-height:1;margin-right:2px}
.exp-view-item{font-weight:400;font-size:14px;flex:1;min-width:90px}
.exp-view-amt{font-weight:800;color:var(--accent);white-space:nowrap;font-size:14px;min-width:84px;text-align:right;flex-shrink:0}
.exp-view-actions{display:flex;gap:4px;min-width:64px;justify-content:flex-end;flex-shrink:0}
/* 自动计入条目（路线交通/住宿）：来源标签与手动行编辑/删除图标同列并居中（视觉对齐） */
.exp-wrap.auto-row .exp-view{opacity:.9}
.exp-wrap.auto-row .exp-view-actions{justify-content:center}
.auto-tag{font-size:11px;color:var(--sub);background:#f0f0f5;border-radius:99px;padding:2px 10px;flex-shrink:0;align-self:center}
.exp-view[draggable="true"]{cursor:grab}
.exp-view[draggable="true"]:active{cursor:grabbing}
/* 当日合计：金额右缘与各行金额对齐（各行金额右侧有编辑/删除按钮占 74px，合计行留出同宽内边距）；
   「当日合计」右移 2px 补偿 🧾 图标字形自带的内边距，使其与记账图标视觉左缘对齐 */
.exp-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:7px;padding-right:74px;border-top:2px solid var(--line)}
.exp-total .t{font-size:12px;color:var(--sub);font-weight:700;margin-left:2px}
.exp-total .amt{font-size:16px;font-weight:800;color:var(--accent)}

/* 途经点 */
.pin-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pin-chip{display:inline-flex;align-items:center;gap:5px;background:#eef4ff;color:#3d5af1;border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:600}
.pin-chip .x{cursor:pointer;font-weight:800;padding:0 2px}
.pin-chip .x:hover{color:#e5484d}
.map-hint{font-size:13px;font-style:italic;color:var(--sub);margin-top:6px}

/* 每日总览 */
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ov-item{background:#fafafc;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.ov-item .num{font-size:15.5px;font-weight:800}
/* 总览内图标与内容图标统一（12.5px） */
.ov-item .num .ov-emoji{font-size:12.5px;font-style:normal}
.ov-item .lbl{font-size:11px;color:var(--sub)}
.ov-note{grid-column:1/-1;font-size:12px;color:var(--sub);background:#fff8f0;border-radius:10px;padding:8px 12px}
.ov-route{grid-column:1/-1;background:#fafafc;border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ov-route .lbl{font-size:11px;color:var(--sub);font-weight:700}
/* 记账提示：斜体小字，与标题图标左对齐，位于标题与内容之间 */
.block-hint{font-size:13px;color:var(--sub);font-style:italic;margin:0 0 6px;line-height:1.5}
/* 记账区紧凑：标题、提示、内容间距收紧 */
.day-col.col-r .block-title{margin-bottom:8px}
/* 记账两栏：明细更宽（左 1.5），消费构成（右 1） */
.block.exp-split{display:grid;grid-template-columns:1.5fr 1fr;gap:0;padding:0}
.exp-split .exp-col{padding:18px 24px}
.exp-split .exp-col-l{border-right:1px solid var(--line)}
.exp-split .block-title{margin-bottom:8px}
/* 提醒 */
.rem-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.rem-row input[type=date]{width:132px;padding:4px 8px;font-size:13px;border-radius:8px}
.rem-row input[type=time]{width:92px;padding:4px 6px;font-size:13px;border-radius:8px}
.rem-row .rem-title{flex:1;min-width:110px;padding:4px 8px;font-size:13px;border-radius:8px}
.rem-view{display:flex;align-items:center;gap:10px;padding:4px 2px;border-bottom:1px dashed var(--line);flex-wrap:wrap;line-height:1.5}
.rem-view:last-child{border-bottom:none}
.rem-dot{width:11px;height:11px;border:2px solid var(--accent);border-radius:50%;flex-shrink:0;background:#fff}
.rem-view-time{font-size:12.5px;font-weight:600;color:var(--ink);background:var(--accent-soft);padding:3px 10px;border-radius:8px;white-space:nowrap}
.rem-view-title{font-size:14px;font-weight:700;color:var(--ink)}
.rem-view-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
/* 滑动开关：手机通知提醒开关，高度与 icon-btn(30px) 一致，位于编辑/删除左侧 */
.switch{position:relative;display:inline-flex;align-items:center;width:42px;height:30px;flex-shrink:0;cursor:pointer}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .track{width:40px;height:22px;border-radius:999px;background:#d8d8e0;transition:background .2s;position:relative}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(18px)}
/* 已过期提醒：置灰表示无需提醒 */
.rem-view .rem-view-time.rem-expired{opacity:.45}
.exp-donut{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.exp-donut .lbl{font-size:11px;color:var(--sub);font-weight:700;margin-bottom:2px}
.donut-wrap{display:flex;align-items:center;gap:16px;padding:6px 0;flex-wrap:wrap}
.donut{width:98px;height:98px;border-radius:50%;position:relative;flex-shrink:0}
.donut-hole{position:absolute;inset:22%;background:#fff;border-radius:50%}
.donut-col{display:flex;align-items:flex-start;flex-shrink:0}
.donut-leader{width:40px;height:30px;display:block;margin-top:-18px}
.donut-side{display:flex;flex-direction:column;gap:6px;min-width:0}
.donut-legend{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--sub);margin-top:2px}
.donut-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-legend span{white-space:nowrap;cursor:pointer;padding:2px 6px;border-radius:6px;transition:background .15s}
.donut-legend span:hover{background:#f0f0f5}
.donut-detail{margin-top:2px;border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:3px}
.dd-row{display:flex;justify-content:space-between;font-size:12px;color:#55556a;gap:12px}
.dd-row b{color:var(--ink);white-space:nowrap}

/* 添加一天 */
.add-day-wrap{padding:20px;display:flex;justify-content:center}
.add-day-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:999px;
  border:2px dashed #d8d8e0;color:var(--sub);font-weight:700;font-size:14px;transition:all .2s}
.add-day-btn:hover{border-color:var(--accent);color:var(--accent);background:#fff}

/* ============ 模态 ============ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,20,40,.45);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal{
  background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto;
  padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popIn .2s ease;
}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field label{font-size:12px;font-weight:700;color:var(--sub)}
/* emoji 行：label 与输入框同行，输入框拉满剩余宽度、高度略低 */
.emoji-row{flex-direction:row;align-items:center}
.emoji-row label{flex-shrink:0;margin-right:4px}
.form-field.emoji-row input{flex:1;min-width:0;padding:7px 12px}
.form-field input,select{padding:9px 12px;border-radius:12px}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-dot{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .12s}
.color-dot:hover{transform:scale(1.15)}
.color-dot.sel{border-color:var(--ink);transform:scale(1.1)}
.color-dot.custom-btn{display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:#f7f7fa;border:1.5px dashed #c9c9d4;color:var(--sub)}
.custom-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:7px;margin-top:10px;padding:12px;background:#f7f7fa;border:1px solid var(--line);border-radius:12px}
.custom-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:transform .1s}
.custom-dot:hover{transform:scale(1.2)}
.custom-dot.sel{border-color:var(--ink)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

/* 数据管理面板 */
.st-title{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:1px;margin-bottom:10px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 2px;
  border-bottom:1px dashed var(--line);font-size:14px;font-weight:600}
.set-row.clickable{cursor:pointer}
.set-row.clickable:hover{background:#fafafc;border-radius:8px;padding-left:6px;padding-right:6px}
.set-opts{display:flex;gap:6px}
.set-opt{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--sub);
  background:#f2f2f7;border:1.5px solid transparent;transition:all .15s}
.set-opt:hover{border-color:var(--accent-border)}
.set-opt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.set-version{margin-top:8px;background:#fafafc;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.set-version a{color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all}
/* 大字体 */
/* 大字体：所有内容字号统一 +1.5px（与标准档同比例） */
body.font-large{font-size:15.5px}
body.font-large .rem-view-time{font-size:14px}
body.font-large .exp-view-cat{font-size:15.5px}
body.font-large .seg-view-time,body.font-large .seg-view-path,body.font-large .seg-view-trans{font-size:15.5px}
body.font-large .seg-view-chip{font-size:14.5px}
body.font-large .seg-view-price{font-size:15.5px}
body.font-large .exp-view-item,body.font-large .lodge-view-name,body.font-large .rem-view-title{font-size:15.5px}
body.font-large .exp-view-amt,body.font-large .lodge-view-price{font-size:15.5px}
body.font-large .seg-view-sub,body.font-large .exp-view-note,body.font-large .lodge-view-sub{font-size:13.5px}
body.font-large .btn{font-size:14.5px}
/* 渐变壁纸 */
/* 渐变壁纸（行程级）：在行程编辑面板选择，颜色跟随该行程主题 */
#view-detail.wall-gradient{background:linear-gradient(165deg,var(--accent-soft) 0%,var(--bg) 45%)}
#view-detail.wall-gradient .day-card{box-shadow:0 4px 18px rgba(28,28,60,.08)}
.data-panel .dp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.data-panel .dp-row span{color:var(--sub);font-weight:700;white-space:nowrap}
.data-panel .dp-row b{font-weight:700;text-align:right}
.data-panel .dp-note{font-size:13px;font-style:italic;color:var(--sub);background:#f7f7fa;border-radius:10px;
  padding:9px 12px;margin-top:12px;line-height:1.7}
.data-panel .dp-warn{font-size:13px;font-style:italic;color:#e5484d;background:var(--accent-soft);border:1px solid #f3c1c3;
  border-radius:10px;padding:9px 12px;margin-top:8px;line-height:1.7}


/* ============ 提示 ============ */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);z-index:999;
  background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ PDF 文档视图 ============ */
#doc{position:fixed;inset:0;background:rgba(20,20,40,.6);backdrop-filter:blur(6px);z-index:320;display:flex;flex-direction:column}
.doc-toolbar{display:flex;align-items:center;gap:10px;padding:14px 22px;color:#fff}
.doc-toolbar .t{font-weight:800;font-size:15px;margin-right:auto}
.doc-toolbar .btn{background:rgba(255,255,255,.15);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.25)}
.doc-toolbar .btn:hover{background:rgba(255,255,255,.28)}
.doc-scroll{flex:1;overflow:auto;padding:22px 20px 60px;display:flex;justify-content:center}
.doc-body{background:#fff;width:100%;max-width:820px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.3);padding:46px 54px;height:fit-content}
.doc-cover{position:relative;color:#fff;border-radius:18px;padding:34px 34px 30px;overflow:hidden}
.doc-cover::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.25),transparent 65%);top:-100px;right:-80px}
.doc-cover .doc-emoji{font-size:40px;position:relative;z-index:1}
.doc-cover h1{font-size:27px;font-weight:900;margin-top:8px;position:relative;z-index:1;line-height:1.35}
.doc-meta{margin-top:6px;font-size:13px;opacity:.92;position:relative;z-index:1}
.doc-toc{margin:26px 0 8px;padding:22px 26px;background:#fafafc;border:1px solid var(--line);border-radius:16px}
.doc-toc h2{font-size:15px;font-weight:900;letter-spacing:2px;margin-bottom:14px;color:var(--ink)}
.toc-item{display:flex;align-items:baseline;gap:10px;padding:7px 0;text-decoration:none;color:var(--ink);border-bottom:1px dashed #e5e5ec;font-size:13.5px}
.toc-item:last-child{border-bottom:none}
.toc-item:hover .toc-date{color:var(--accent)}
.toc-no{font-weight:900;color:var(--accent);font-size:12px;min-width:46px}
.toc-date{font-weight:700}
.toc-dots{flex:1;border-bottom:2px dotted #d5d5dd;transform:translateY(-3px)}
.toc-sum{color:var(--sub);font-size:12px;white-space:nowrap}
.doc-day{padding:22px 0 6px;border-top:1px solid var(--line);margin-top:18px}
.doc-day-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:900;margin-bottom:12px}
.doc-cl-item{display:flex;gap:8px;padding:5px 0;font-size:14px;border-bottom:1px dashed #e5e5ec}
.doc-day-no{background:linear-gradient(160deg,var(--accent),var(--accent2));color:#fff;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.doc-day-wk{color:var(--sub);font-weight:600;font-size:13px}
.doc-table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0 12px}
.doc-table th{background:#f6f6f9;text-align:left;padding:7px 10px;font-size:11px;color:var(--sub);font-weight:800;letter-spacing:.5px}
.doc-table td{padding:7px 10px;border-bottom:1px solid #f0f0f4;vertical-align:top}
.doc-table .d-time{white-space:nowrap;font-weight:700;color:var(--accent);font-size:11.5px}
.doc-table .d-path{font-weight:700}
.doc-table .d-trans{white-space:nowrap}
.doc-table .d-det{color:#55556a;font-size:11.5px}
.doc-table .d-note{color:var(--sub);font-size:11.5px}
.doc-table.exp{width:72%}
.doc-table .d-amt{font-weight:800;text-align:right;white-space:nowrap}
/* 路线表价格列：居中、不加粗 */
.doc-table .d-price{text-align:center;white-space:nowrap}
.doc-empty{color:var(--sub);font-size:12.5px;font-style:italic;margin:6px 0 12px}
.doc-lodge{display:flex;flex-direction:column;gap:3px;background:#fff8f0;border:1px solid #ffe8cc;border-radius:12px;padding:9px 15px;font-size:12.5px;margin:4px 0 12px;width:fit-content;max-width:100%}
.doc-lodge-main{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.doc-lodge-note{font-size:11.5px;color:var(--sub)}
.doc-lodge-price{color:#b0712e;font-weight:800;margin-left:auto}
.doc-day-sum{display:flex;flex-wrap:wrap;gap:8px 18px;background:#fafafc;border-radius:12px;padding:10px 15px;font-size:12.5px;color:var(--sub);margin-top:6px}
.doc-day-sum b{color:var(--accent)}
.doc-day-note{font-style:italic;color:var(--sub);background:#fafafc;border-radius:10px;padding:8px 12px;margin:4px 0 10px;font-size:12.5px}
.doc-note{font-style:italic;color:var(--sub);flex-basis:100%}
.doc-total{display:flex;flex-wrap:wrap;gap:10px 30px;background:linear-gradient(135deg,var(--ink),#3a3a52);color:#fff;border-radius:16px;padding:18px 26px;margin-top:26px;font-size:14px}
.doc-total b{color:#FFC24B}

/* ============ 平板适配（HD 版，body.pad） ============ */
/* 平板逻辑宽度常落在 700~1100px，强制走宽屏双列布局 + 加大触控目标 */
body.pad { font-size: 15px; }
body.pad #topbar { padding: 12px 18px; }
body.pad #topbar .logo { font-size: 19px; }
body.pad .btn { padding: 10px 18px; }
body.pad .btn-small { padding: 8px 14px; }
body.pad #btn-export, body.pad #btn-import { display: none; }              /* 导出/导入在 ⚙️ 面板 */
body.pad #btn-back .lbl, body.pad #btn-pdf .lbl, body.pad #btn-new .lbl { display: none; } /* 顶栏纯图标 */
body.pad #btn-back, body.pad #btn-pdf, body.pad #btn-new, body.pad #btn-data { padding: 10px 12px; }
body.pad #view-list { max-width: 1200px; padding: 0 24px; }
body.pad .trip-cover { height: 130px; }
body.pad .stat-card { min-width: 130px; padding: 12px 20px; }
body.pad .stat-card .num { font-size: 20px; }
body.pad .detail-body { grid-template-columns: 190px 1fr !important; gap: 24px; }
body.pad .day-nav { position: sticky !important; flex-direction: column !important; gap: 8px; overflow: visible !important; }
body.pad .day-nav .nav-title { display: block !important; }
body.pad .day-nav button { padding: 10px 14px; }
body.pad .day-grid { grid-template-columns: 1fr 1fr !important; }
body.pad .detail-body>* { min-width: 0; }        /* 平板：grid 子项可收缩，防内容撑宽溢出 */
body.pad .day-grid>* { min-width: 0; }
body.pad .block { padding: 16px 20px; }
body.pad .block.lodge-block { padding: 16px 20px; }
body.pad .block.full { grid-column: 1/-1 !important; border-right: none !important; }
body.pad .day-col.col-l { border-right: 1px solid var(--line) !important; }
body.pad .day-head { padding: 14px 22px; }
body.pad .day-badge { min-width: 60px; height: 60px; }
body.pad .modal { max-width: 720px; }
body.pad .form-grid { grid-template-columns: 1fr 1fr; }
body.pad .doc-body { max-width: 900px; padding: 40px 48px; }
body.pad .seg-row { flex-wrap: wrap; }                                     /* 平板编辑行允许换行，避免截断 */
body.pad .seg-row input[type=time] { width: 92px; }
body.pad .seg-row input { width: 108px; }
body.pad .seg-row select { width: 104px; }

/* ============ 安卓 WebView（手机/平板）emoji 图标对齐 ============
   Noto Color Emoji 字形自带左右内边距 → 图标视觉左缘比文字偏右；
   统一左移 2px 补偿：标题类图标（block-title）、内容类图标（交通/住宿类型/花销类别/备注）左侧对齐 */
body.pad .block-title .tag, body.phone .block-title .tag { margin-left: -2px; }
body.pad .seg-view-trans, body.phone .seg-view-trans { margin-left: -2px; }
body.pad .lodge-view-type, body.phone .lodge-view-type { margin-left: -2px; }
body.pad .exp-view-cat, body.phone .exp-view-cat { margin-left: -2px; }
body.pad .note-emoji, body.phone .note-emoji { margin-left: -2px; }
body.pad .day-nav .nav-title, body.phone .day-nav .nav-title { margin-left: -2px; }

/* ============ 手机端适配（≤560px） ============ */
@media (max-width: 560px) {
  /* 编辑态行程：手机窄屏收窄时间下拉，五行布局保持不换行 */
  .seg-wrap.editing .seg-time-sel{width:52px}
  .seg-wrap.editing .seg-line{gap:6px}
  /* 手机端紧凑：列距 8px、按钮缩小、价格行换行 → 主行(时间+地点+交通)能一行放下 */
  .seg-view { gap: 8px; }
  .seg-main { column-gap: 8px; row-gap: 4px; }
  .seg-trail { gap: 8px; flex-basis: 100%; }
  .drag-handle { width: 20px; }
  .seg-view-actions .icon-btn { width: 26px; height: 26px; }
  /* 手机端：主行剩余空间给地名设上限（按最宽时间列+跨天角标计算），保证时间+地名+按钮一行不拆散 */
  /* 手机端：地名上限=主行剩余空间（时间列最宽含跨天角标 97px + 间距），任意屏宽都保证主行一行 */
  .seg-view-path { max-width: calc(100% - 110px); }
  #topbar { padding: 10px 10px; gap: 6px; }
  #topbar .logo { font-size: 16px; }
  #btn-export, #btn-import, #save-state { display: none; }        /* 导出/导入在 ⚙️ 数据面板中 */
  #btn-back .lbl, #btn-pdf .lbl, #btn-new .lbl { display: none; } /* 顶栏图标化 */
  #btn-back, #btn-pdf, #btn-new, #btn-data { padding: 8px 10px; }

  #view-list { margin: 14px auto; padding: 0 12px; }
  .trip-grid { gap: 14px; grid-template-columns: 1fr; }
  .trip-cover { height: 92px; }

  #view-detail { padding: 0 12px 40px; }
  .detail-head { padding: 14px 0 4px; }
  .detail-head h1 { font-size: 19px; }
  .stat-strip { gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; margin: 12px 0 2px; -webkit-overflow-scrolling: touch; }
  .stat-card { min-width: 96px; padding: 8px 14px; }
  .stat-card .num { font-size: 16px; }

  .detail-body { grid-template-columns: 1fr; gap: 14px; }
  .day-nav { position: static; flex-direction: row; flex-wrap: nowrap; overflow-x: auto; gap: 6px;
    padding-bottom: 6px; -webkit-overflow-scrolling: touch; }
  .day-nav .nav-titles { display: contents; }
  .day-nav .nav-dates { display: flex; gap: 6px; }
  .day-nav .nav-title { display: inline-flex; align-items: center; flex-shrink: 0; margin: 0; padding: 8px 12px; font-size: 13px; background: var(--accent-soft); border-radius: 10px; }
  .day-nav .nav-link:hover { background: transparent; }
  /* 日期按钮：黑色文字（金额保持主题色）、无底色 */
  .day-nav button { padding: 4px 10px; font-size: 12.5px; border-radius: 8px; background: transparent; border: none; box-shadow: none; color: var(--ink); font-weight: 800; font-family: 'PingFang SC','HarmonyOS Sans SC','MiSans','Noto Sans CJK SC',sans-serif; }
  .day-nav button .d { font-size: 12.5px; min-width: 40px; flex: 0 0 40px; font-weight: 900; color: var(--ink); }
  .day-nav button .w { font-size: 12.5px; color: var(--ink); font-weight: 600; }
  .day-nav button .info { display: block; margin-left: auto; font-size: 12.5px; color: var(--accent); font-weight: 800; font-style: italic; text-align: right; }
  .day-nav button.empty { opacity: .4; }
  .days-col { gap: 16px; }

  .day-head { padding: 12px 14px; gap: 10px; }
  .day-badge { min-width: 46px; height: 46px; }
  .day-badge .n { font-size: 17px; }
  .day-info h3 { font-size: 15px; }
  .block { padding: 14px 14px; }
  .block-title { margin-bottom: 10px; }

  .doc-toolbar { padding: 10px 10px; gap: 6px; }
  .doc-toolbar .t { font-size: 13px; }
  .doc-toolbar .lbl { display: none; }
  .doc-toolbar .btn { padding: 8px 10px; }

  .doc-scroll { padding: 10px 8px 40px; }
  .doc-body { padding: 24px 16px; }
  .doc-cover { padding: 24px 20px 22px; }
  .doc-cover h1 { font-size: 22px; }
  .doc-toc { padding: 16px 16px; }
  .doc-table.exp { width: 100%; }

  .modal { padding: 18px 16px; }
  .form-grid { grid-template-columns: 1fr; }
  .modal-actions { flex-wrap: wrap; }

  .lodge-grid { grid-template-columns: 1fr; }
  .overview-grid { grid-template-columns: 1fr; }
  .seg-detail-row .seg-pax-chips { flex-basis: 100%; }
  .block.exp-split { grid-template-columns: 1fr; }
  .exp-split .exp-col { padding: 14px 14px; }
  .block.lodge-block { padding: 14px 14px; }
  .exp-split .exp-col-l { border-right: none; border-bottom: 1px solid var(--line); }
}

/* ============ 标题层级 ============
   二级标题：页面/区块（每日行程、旅行清单）；三级标题：子区块 */
.h2-title{font-size:16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.h3-title{font-size:13.5px;font-weight:700;color:var(--sub);margin:10px 0 6px}
/* 旅行清单面板（详情页内嵌，点击左侧标题切换显示） */
.cl-panel{max-width:760px;margin:0 auto;padding:6px 0 40px;width:100%}
.cl-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cl-panel .h2-title{margin-bottom:4px}
.cl-panel .cl-hint{margin-bottom:14px}
.cl-toolbar .t{font-size:16px;font-weight:800;color:var(--ink);flex:1}
.cl-body{max-width:760px;margin:0 auto;padding:22px 20px 60px}
.cl-hint{font-size:13px;color:var(--sub);font-style:italic;margin:0 0 14px}
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.cl-item .cl-check{font-size:16px;flex-shrink:0}
.cl-item .cl-text{font-size:14px;color:var(--ink);flex:1}
.cl-item.done .cl-text{color:var(--sub);text-decoration:line-through}
/* ============ 旅行清单正式版（对齐行程页区块/标题/字体规范） ============ */
.pk-wrap{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.pk-card{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:18px 20px}
.pk-card .block-hint{margin-bottom:12px;font-size:12px}
.pk-groups{display:flex;flex-direction:column;gap:10px}
.pk-group{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;background:#fcfcfd}
.pk-group-head{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:6px}
.pk-group-ic{font-size:15px}
.pk-group-count{margin-left:auto;font-size:11.5px;color:var(--sub)}
.pk-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px dashed #f0f0f5;line-height:1.5;flex-wrap:wrap}
.pk-row:last-child{border-bottom:none}
.pk-cat{font-size:12px;color:var(--sub);background:#f0f0f5;border-radius:8px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.pk-name{font-weight:600;font-size:14px;min-width:0;flex:1}
.pk-imp{font-size:11px;border-radius:99px;padding:1px 8px;white-space:nowrap;flex-shrink:0}
.pk-imp[data-imp="必需品"]{background:#ffe9e9;color:#c0392b}
.pk-imp[data-imp="非必需"]{background:#eef2f7;color:#5b6b7f}
.pk-imp[data-imp="待定"]{background:#f4f1e8;color:#8a7a45}
.pk-status{font-size:11.5px;cursor:pointer;white-space:nowrap;flex-shrink:0;color:var(--sub);padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:#fff}
.pk-status.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.pk-bag-tag{font-size:11px;color:#4a5d78;background:#f0f6ff;border:1px solid #d8e6fa;border-radius:99px;padding:1px 8px;white-space:nowrap;flex-shrink:0}
.pk-note{flex:1 1 100%;min-width:100%;margin-left:34px;font-size:12px;color:var(--sub);line-height:1.5;padding-right:8px}
.pk-actions{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
/* 物品编辑表单（沿用 .edit-form 风格） */

<script>
'use strict';
/* ================================================================
 * 工具函数
 * ================================================================ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
/** 时间输入自动格式化：冒号始终保留（空时显示冒号占位；9 → 9:；0900 → 09:00） */
const fmtTimeInput = v => {
  const d = String(v).replace(/\D/g, '').slice(0, 4);
  if (!d) return ':';
  if (d.length === 1 || d.length === 2) return d + ':';
  return d.slice(0, 2) + ':' + d.slice(2);
};
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmtMoney = v => '¥' + Math.round(num(v)).toLocaleString('zh-CN');
/** 圆环中心金额：大额缩写（≥1亿 → 亿、≥1万 → 万），避免超长数字溢出被圆遮挡 */
const fmtMoneyShort = v => {
  const n = num(v);
  if (n >= 1e8) return '¥' + (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + '亿';
  if (n >= 1e4) return '¥' + (n / 1e4).toFixed(1).replace(/\.0$/, '') + '万';
  return fmtMoney(n);
};
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const diffDays = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
const weekdayCN = d => '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];
const fmtDateCN = d => { const [y, m, dd] = d.split('-'); return `${Number(m)}月${Number(dd)}日`; };
const isInRange = (trip, d) => trip.startDate <= d && d <= trip.endDate;
const dayNo = (trip, d) => isInRange(trip, d) ? diffDays(trip.startDate, d) + 1 : '—';

const TRANSPORTS = [['🚇','地铁'],['✈️','飞机'],['🚕','打车'],['🚌','公交'],['🚶','步行'],['🚄','高铁'],['🚗','自驾'],['🚙','租车'],['🛥️','游船'],['🚲','骑行'],['🧭','其他']];

/** 版本信息（设置 → 额外设置 → 版本管理） */
const APP_VERSION = '2.0';
const GITHUB_URL = 'https://github.com/miaoyuLovewxjjt/travel-planner';

/** 设备模式：'pad'（平板版 App）| 'phone'（手机版 App）| 'web'（浏览器）；支持 ?device=pad 模拟（调试用） */
const DEVICE = (window.AndroidBridge && window.AndroidBridge.getDevice) ? window.AndroidBridge.getDevice()
  : new URLSearchParams(location.search).get('device') || 'web';
if (DEVICE === 'pad') document.body.classList.add('pad');
if (DEVICE === 'phone') document.body.classList.add('phone');

/** 外观偏好已移入行程级（主题色/渐变壁纸在行程编辑面板）；清理旧版全局设置残留 */
(function initPrefs() {
  localStorage.removeItem('theme');
  localStorage.removeItem('font');
  localStorage.removeItem('wall');
})();
const CATS = [['🚆','交通'],['🍜','餐饮'],['🌌','住宿'],['🎫','门票'],['🛍️','购物'],['📌','其他']];
const PRESET_COLORS = ['#FF6B6B','#FF9A5A','#FFC24B','#4ECB71','#4D96FF','#7B5CF0','#F0619B','#0FB5AE','#B58A5A','#5A6B8C'];
/** 自定义色卡面板色板：20 基础色 ×（原色 + 浅一档 + 深一档），点击即选、无系统弹窗 */
const CUSTOM_COLORS = (() => {
  const base = ['#E5484D','#FF6B6B','#FF9A5A','#FF8C42','#FFC24B','#F6C945','#4ECB71','#30A46C','#0FB5AE','#12A594','#4D96FF','#3E63DD','#7B5CF0','#8E4EC6','#F0619B','#D6409F','#B58A5A','#AD7F58','#5A6B8C','#687076'];
  const out = [];
  base.forEach(c => { out.push(c); out.push(mixWhite(c, 0.5)); out.push(shade(c, -32)); });
  return out;
})();
const emojiOf = t => (TRANSPORTS.find(x => x[1] === t) || TRANSPORTS[9])[0];
/** 简约垃圾桶图标（银色 SVG） */
const trashIcon = () => '<svg class="trash-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#757585" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
/** 简约铅笔图标（SVG，与垃圾桶同规格） */
const pencilIcon = () => '<svg class="pencil-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#757585" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>';
const catEmoji = c => (CATS.find(x => x[1] === c) || CATS[5])[0];

/** 地图库是否已就绪（Leaflet 为异步动态加载） */
const isMapReady = () => window.leafletReady === true || !!window.L;
/** 瓦片层：高德栅格瓦片（国内快、中文标注、免 Key）优先，连续失败自动降级 OpenStreetMap */
function baseTileLayer() {
  const urls = [
    'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  ];
  const layer = L.tileLayer(urls[0], {
    maxZoom: 18, subdomains: ['1', '2', '3', '4'],
    attribution: '© 高德地图 · © OpenStreetMap',
  });
  let idx = 0, fails = 0;
  layer.on('tileerror', () => {
    fails++;
    if (fails >= 4 && idx < urls.length - 1) { idx++; fails = 0; layer.setUrl(urls[idx], true); }
  });
  return layer;
}

/* ================================================================
 * 数据层
 * ================================================================ */
let state = { trips: [] };
let currentTripId = null;
let saveTimer = null;
let saving = false;
let dataMode = 'server'; // 'server'（电脑 Node 服务）| 'local'（手机本地 localStorage，APK/离线模式）

async function loadData() {
  try {
    const r = await fetch('/api/trips');
    if (!r.ok) throw new Error(String(r.status));
    state = await r.json();
    if (!Array.isArray(state.trips)) state = { trips: [] };
    dataMode = 'server';
  } catch (e) {
    // 电脑服务不可用（如 APK 内 WebView）→ 降级为手机本地存储
    dataMode = 'local';
    try {
      const raw = localStorage.getItem('trips-data');
      state = raw ? JSON.parse(raw) : { trips: [] };
    } catch (_) { state = { trips: [] }; }
    if (!Array.isArray(state.trips)) state = { trips: [] };
  }
  render();
  // App 启动后重新同步提醒到系统闹钟（覆盖已过期的）
  (state.trips || []).forEach(t => syncReminders(t));
}

function saveNow() {
  if (saving) { scheduleSave(); return; }
  saving = true;
  setSaveState('保存中…');
  clearTimeout(saveTimer);
  if (dataMode === 'local') {
    try {
      localStorage.setItem('trips-data', JSON.stringify(state));
      setSaveState('✓ 已保存到本机 ' + new Date().toTimeString().slice(0, 5));
    } catch (_) { setSaveState('⚠️ 保存失败'); }
    saving = false;
    return;
  }
  fetch('/api/trips', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state),
  }).then(r => {
    if (!r.ok) throw new Error(r.status);
    setSaveState('✓ 已保存 ' + new Date().toTimeString().slice(0, 5));
  }).catch(() => setSaveState('⚠️ 保存失败，请检查服务'))
    .finally(() => { saving = false; });
}
const scheduleSave = () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); };
function setSaveState(t) { $('#save-state').textContent = t; }

/** 收集出行计划全部提醒 [{id, title, ts}] */
function collectReminders(t) {
  const list = [];
  Object.keys(t.days || {}).forEach(d => {
    (t.days[d].reminders || []).forEach(r => {
      if (r.title && r.date && !r.draft && r.enabled !== false) {
        const ts = new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime();
        if (!isNaN(ts) && ts > Date.now()) list.push({ id: t.id + '-' + d + '-' + r.id, title: r.title, ts });
      }
    });
  });
  return list;
}
/** 检查通知/闹钟授权：未授权则提醒保存失败（自动删除该行） */
async function canRemind() {
  if (window.AndroidBridge && window.AndroidBridge.getNotifyPermission) {
    // Android：13+ 未授权 → 发起请求并视为失败；13- 默认允许
    if (window.AndroidBridge.getNotifyPermission() === 'denied') {
      if (window.AndroidBridge.requestNotifyPermission) window.AndroidBridge.requestNotifyPermission();
      return false;
    }
    return true;
  }
  if (window.Notification) {
    if (Notification.permission === 'granted') return true;
    if (Notification.permission === 'default') {
      try { return (await Notification.requestPermission()) === 'granted'; } catch (_) { return true; }
    }
    return false;
  }
  return true; // 无 Notification 支持（极老浏览器）→ 允许（页面内提示仍可用）
}

/** 同步提醒：手机 App → Android 系统闹钟；网页 → 浏览器通知（页面打开时） */
function syncReminders(t) {
  if (!t) return;
  const list = collectReminders(t);
  if (window.AndroidBridge && window.AndroidBridge.scheduleAllReminders) {
    try { window.AndroidBridge.scheduleAllReminders(JSON.stringify(list)); } catch (_) {}
  } else if (Notification && Notification.permission === 'default' && list.length) {
    Notification.requestPermission();
  }
}
/** 网页到期检测：每分钟检查，到期弹浏览器通知 + 页面提示（页面需保持打开） */
function checkWebReminders() {
  const now = Date.now();
  let hit = false;
  (state.trips || []).forEach(t => Object.keys(t.days || {}).forEach(d => {
    (t.days[d].reminders || []).forEach(r => {
      if (r.title && r.date && !r.draft && !r.reminded && r.enabled !== false) {
        const ts = new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime();
        if (!isNaN(ts) && ts <= now) {
          r.reminded = true;
          hit = true;
          showToast('⏰ 提醒：' + r.title);
          if (Notification && Notification.permission === 'granted') {
            try { new Notification('⏰ 我的行程提醒', { body: r.title }); } catch (_) {}
          }
        }
      }
    });
  }));
  if (hit) scheduleSave();
}
setInterval(checkWebReminders, 60000);

/** 导出全部数据为 JSON 文件（电脑 ⇄ 手机迁移） */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = '行程数据-' + new Date().toISOString().slice(0, 10) + '.json';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  showToast('已导出数据文件');
}
/** 从 JSON 文件导入数据 */
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.trips)) throw new Error('格式不对');
      state = d;
      if (dataMode === 'local') localStorage.setItem('trips-data', JSON.stringify(state));
      else scheduleSave();
      render();
      showToast('✓ 已导入 ' + d.trips.length + ' 个出行计划');
    } catch (e) {
      showToast('⚠️ 导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

const getTrip = id => state.trips.find(t => t.id === id);
const emptyDay = () => ({ notes: '', lodging: { name: '', location: '', pricePerNight: 0, notes: '' },
  travelers: [], expenses: [], segments: [], pins: [] });

/* —— 统计 —— */
/* 消费构成颜色：跟随行程主题色（applyTripTheme 按深浅派生 --cat-1..6），同行程内同类别永远同色 */
const CAT_COLORS = { '交通': 'var(--cat-1)', '餐饮': 'var(--cat-2)', '住宿': 'var(--cat-3)', '门票': 'var(--cat-4)', '购物': 'var(--cat-5)', '其他': 'var(--cat-6)' };
function dayStats(day) {
  // 路线价格（交通）+ 住宿价格（住宿）自动计入当日合计，并计入消费构成对应类别（环形图完整呈现）
  const segs = day.segments || [];
  const segExp = segs.reduce((s, x) => s + num(x.price), 0);
  const lodge = day.lodging;
  const lodgeExp = (lodge && (lodge.name || lodge.location)) ? num(lodge.pricePerNight) : 0;
  const expByCat = {};
  (day.expenses || []).forEach(e => { expByCat[e.category] = (expByCat[e.category] || 0) + num(e.amount); });
  if (segExp) expByCat['交通'] = (expByCat['交通'] || 0) + segExp;
  if (lodgeExp) expByCat['住宿'] = (expByCat['住宿'] || 0) + lodgeExp;
  const exp = Object.values(expByCat).reduce((a, b) => a + b, 0);
  return {
    exp, expByCat, segs: segs.length,
    lodge: lodge && (lodge.name || lodge.location) ? lodge : null,
    pins: (day.pins || []).length,
  };
}
/** 每日总览环形图（按类别占比，中间总金额；图例可点击展开明细） */
function donutChart(expByCat) {
  const cats = Object.keys(expByCat || {}).filter(c => expByCat[c] > 0);
  const total = cats.reduce((s, c) => s + expByCat[c], 0);
  if (!total) return '';
  let acc = 0;
  const stops = cats.map(c => {
    const start = acc / total * 360;
    acc += expByCat[c];
    return `${CAT_COLORS[c] || '#B0B0BC'} ${start.toFixed(1)}deg ${(acc / total * 360).toFixed(1)}deg`;
  }).join(', ');
  // 最大余数法：整数百分比总和恒为 100（避免逐项四舍五入后 99% 之类）
  const pcts = cats.map(c => expByCat[c] / total * 100);
  const ints = pcts.map(p => Math.floor(p));
  let diff = 100 - ints.reduce((a, b) => a + b, 0);
  const order = pcts.map((p, i) => ({ i, frac: p - Math.floor(p) })).sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < diff; k++) ints[order[k % order.length].i]++;
  const legend = cats.map((c, i) =>
    `<span data-cat="${c}" title="点击查看该类别明细"><i style="background:${CAT_COLORS[c] || '#B0B0BC'}"></i>${catEmoji(c)}${c} ${ints[i]}%</span>`).join('');
  // 占比环形图：总额由左侧「记账 → 当日合计」承担，此处只保留类别占比，不重复显示金额
  return `<div class="donut-wrap">
    <div class="donut-col">
      <div class="donut" style="background:conic-gradient(${stops})"><div class="donut-hole"></div></div>
    </div>
    <div class="donut-side">
      <div class="donut-legend">${legend}</div>
    </div>
  </div>`;
}
/** 某类别下每一笔明细：手动记账 + 自动计入（交通=各段路线价格、住宿=住宿价格），确保图例点击都有数据 */
function catDetails(day, cat) {
  const rows = [];
  if (cat === '交通') {
    (day.segments || []).forEach(s => {
      const p = num(s.price);
      if (p > 0) {
        const path = [s.from, s.to].filter(Boolean).join('→');
        rows.push({ label: `${emojiOf(s.transport)} ${s.transport || '交通'}${path ? ' ' + path : ''}`.trim(), amt: p });
      }
    });
  } else if (cat === '住宿') {
    const lg = day.lodging;
    if (lg && (lg.name || lg.location) && num(lg.pricePerNight) > 0) {
      rows.push({ label: lg.name || lg.location || '住宿', amt: num(lg.pricePerNight) });
    }
  }
  (day.expenses || []).forEach(e => { if (e.category === cat && num(e.amount)) rows.push({ label: e.item || '未命名', amt: num(e.amount) }); });
  return rows;
}
function tripStats(trip) {
  const dates = Object.keys(trip.days || {}).sort();
  let exp = 0, segs = 0, lodges = 0;
  dates.forEach(d => { const s = dayStats(trip.days[d]); exp += s.exp; segs += s.segs; if (s.lodge) lodges++; });
  const budget = num(trip.budget);
  return { days: dates.length, exp, segs, lodges, budget, dates };
}
function tripTravelers(trip) { return trip.travelers || []; }
function dayTravelers(trip, day) { return day.travelers && day.travelers.length ? day.travelers : tripTravelers(trip); }

/** 颜色变暗/变亮 */
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + pct / 100))));
  return '#' + [f(r), f(g), f(b)].map(x => pad2(x.toString(16))).join('');
}
/** 向白色混合：t=0 保持原色，t=1 纯白（生成浅色渐变端/柔和底色/描边色） */
function mixWhite(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.round(c + (255 - c) * t);
  return '#' + [f((n >> 16) & 255), f((n >> 8) & 255), f(n & 255)].map(x => pad2(x.toString(16))).join('');
}
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
/** 按行程颜色设置整套 --accent* 变量：详情页/旅行记录/PDF 全部跟随行程色，互不影响 */
function applyTripTheme(root, color) {
  const c = /^#[0-9a-fA-F]{6}$/.test(color || '') ? color : '#FF6B6B';
  root.style.setProperty('--accent', c);
  root.style.setProperty('--accent2', mixWhite(c, 0.22));
  root.style.setProperty('--accent-soft', mixWhite(c, 0.88));
  root.style.setProperty('--accent-border', mixWhite(c, 0.62));
  root.style.setProperty('--accent-shadow', hexToRgba(c, 0.35));
  // 消费构成色板：同一行程内类别深浅固定（交通最深 → 其他最浅），跨行程随主题变化
  root.style.setProperty('--cat-1', shade(c, -32));
  root.style.setProperty('--cat-2', shade(c, -14));
  root.style.setProperty('--cat-3', c);
  root.style.setProperty('--cat-4', mixWhite(c, 0.32));
  root.style.setProperty('--cat-5', mixWhite(c, 0.55));
  root.style.setProperty('--cat-6', mixWhite(c, 0.75));
}

/* 拖动图标与主行文字顶部平齐（CSS 顶对齐已保证）；编辑/删除按钮 30px 比文字行高，
   按时间列实际中心微调按钮垂直位置（第一行高度随换行变化，纯 CSS 无法预知） */
let segAlignRO = null;
function alignSegActions() {
  document.querySelectorAll('#view-detail .seg-view').forEach(v => {
    const t = v.querySelector('.seg-view-time'), a = v.querySelector('.seg-view-actions');
    if (!t || !a) return;
    const mr = v.querySelector('.seg-main').getBoundingClientRect();
    const tr = t.getBoundingClientRect(), ar = a.getBoundingClientRect();
    // 按钮中心对齐主行文字中心（margin 相对容器 padding 边，故以 seg-main 为基准）
    a.style.marginTop = ((tr.top + tr.height / 2 - mr.top) - ar.height / 2) + 'px';
  });
}
function watchSegAlign() {
  if (segAlignRO) segAlignRO.disconnect();
  const root = document.getElementById('view-detail');
  if (!root || typeof ResizeObserver === 'undefined') return;
  segAlignRO = new ResizeObserver(alignSegActions);
  root.querySelectorAll('.seg-view').forEach(v => segAlignRO.observe(v));
  alignSegActions();
}
/* 窗口跨过 560px 阈值（手机横竖屏/平板分屏）时重渲染：路线段主行结构随窄屏切换 */

/* ================================================================
 * 旅行清单（正式版）：① 计划携带物品 ② 行李携带可行性模拟
 * 数据模型（挂在 trip 上，随 state 整体保存/导出）：
 *   t.packing      [{id, category, name, importance, status, notes, bag}]
 *   t.packingOrder [itemId, ...] 扁平顺序（支持整表/跨组拖动）
 *   t.luggageBags  [{id, name, icon}]
 * ================================================================ */
const PACK_CATS = [['🪪','证件'],['🔌','电子设备'],['👕','衣物'],['🧴','洗护用品'],['💊','药品'],['🍫','食品'],['📌','其他']];
const PACK_IMPORTANCE = ['待定', '必需品', '非必需'];   // 默认待定
const PACK_STATUS = ['未携带', '已携带'];
const bagIconOf = i => ['🧳','👜','🎒','🧰','📦','🛄'][i] || '🧳';
const packCatIcon = c => (PACK_CATS.find(x => x[1] === c) || ['📦', c])[0];
/** 分类下拉选项：默认项 + 用过的自定义分类（保证可再次直接选） + 其他 */
function packCatOptions(t) {
  const used = [...new Set((t.packing || []).map(p => p.category).filter(c => c && c !== '其他' && !PACK_CATS.some(x => x[1] === c)))];
  const opts = PACK_CATS.slice();
  used.forEach(c => opts.push(['📦', c]));
  return opts;
}
/** 惰性初始化：老 demo 清单(t.checklist) 一次性迁移为物品（其他/待定/未携带）；补全 id/字段 */
function ensurePacking(t) {
  if (!Array.isArray(t.packing)) {
    t.packing = [];
    if (Array.isArray(t.checklist)) {
      t.checklist.forEach((c, i) => {
        if (c && (c.text || '').trim()) {
          t.packing.push({ id: 'pk' + uid() + i, category: '其他', name: c.text.trim(),
            importance: '待定', status: c.done ? '已携带' : '未携带', notes: '', bag: null });
        }
      });
      t.checklist = [];
    }
  }
  t.packing.forEach((p, i) => { if (!p.id) p.id = 'pk' + uid() + i; });
  t.packingOrder = Array.isArray(t.packingOrder) ? t.packingOrder.filter(id => t.packing.some(p => p.id === id)) : t.packing.map(p => p.id);
  t.packing.forEach(p => {
    p.bag = p.bag || null;
    if (!PACK_IMPORTANCE.includes(p.importance)) p.importance = '待定';
    if (!PACK_STATUS.includes(p.status)) p.status = '未携带';
  });
  if (!Array.isArray(t.luggageBags) || !t.luggageBags.length) {
    t.luggageBags = [['1号行李箱','🧳'],['2号手提袋','👜'],['3号随身携带','🎒']]
      .map(([nm, ic], i) => ({ id: 'bag' + uid() + i, name: nm, icon: ic }));
  }
  t.luggageBags.forEach((b, i) => { if (!b.id) b.id = 'bag' + uid() + i; if (!b.icon) b.icon = bagIconOf(i); });
  return t;
}
/** 旅行清单专用重渲染：保留面板显示状态（renderDetail 默认会隐藏清单面板，避免操作后跳回每日视图） */
function pkSaveAndRender(t) {
  const wasOn = !$('#cl-panel').classList.contains('hidden');
  saveAndRender(t);
  if (wasOn) {
    $('#cl-panel').classList.remove('hidden');
    $('#days-col').classList.add('hidden');
  }
}

/** 旅行清单：详情页内嵌面板（两块：物品清单 + 行李模拟，对齐行程页区块/标题/字体规范） */
function checklistPanelHtml(t) {
  ensurePacking(t);
  const items = t.packing;
  const byId = {};
  items.forEach(p => byId[p.id] = p);
  // 展示顺序：packingOrder 优先，未收录的追加
  const order = (t.packingOrder || []).filter(id => byId[id]);
  items.forEach(p => { if (!order.includes(p.id)) order.push(p.id); });
  // 同品类自动分组（按出现顺序）
  const groups = [];
  order.forEach(id => {
    const it = byId[id];
    const g = groups.find(x => x.cat === it.category);
    if (g) g.items.push(it); else groups.push({ cat: it.category, items: [it] });
  });

  // —— 物品行（展示态 / 编辑态） ——
  const catOpts = packCatOptions(t);
  const itemRow = it => {
    const cat = it.category || '';
    if (it.draft) {
      const isAwaitCustom = !cat || cat === '__custom__';
      const selOpts = catOpts.map(([ic, name]) =>
          `<option value="${esc(name)}" ${!isAwaitCustom && cat === name ? 'selected' : ''}>${ic}${esc(name)}</option>`).join('')
        + `<option value="__custom__" ${isAwaitCustom ? 'selected' : ''}>✏️ 其他（自定义）</option>`;
      return `<div class="pk-edit">
        <div class="ef-line">
          <select data-path="__pk.${it.id}.category">${selOpts}</select>
          <input class="pk-custom-cat" data-path="__pk.${it.id}.category" data-custom-cat maxlength="12"
            placeholder="自定义分类（不填则归「其他」）" value="${isAwaitCustom ? esc(it.category === '__custom__' ? '' : cat) : ''}" ${isAwaitCustom ? '' : 'hidden'}>
          <input data-path="__pk.${it.id}.name" maxlength="20" value="${esc(it.name)}" placeholder="物品名称（最多20字）">
        </div>
        <div class="ef-line">
          <select data-path="__pk.${it.id}.importance">${PACK_IMPORTANCE.map(v => `<option value="${v}" ${it.importance === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <select data-path="__pk.${it.id}.status">${PACK_STATUS.map(v => `<option value="${v}" ${it.status === v ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <input data-path="__pk.${it.id}.notes" maxlength="30" placeholder="备注（可选）" value="${esc(it.notes || '')}">
          <span class="ef-actions">
            <button class="done-btn" data-action="pk-done" data-id="${it.id}" title="确认保存">✓</button>
            <button class="done-btn gray" data-action="pk-cancel" data-id="${it.id}" title="取消（删除）">✕</button>
          </span>
        </div>
      </div>`;
    }
    const c = it.category || '其他';
    const bag = it.bag ? (t.luggageBags.find(b => b.id === it.bag) || null) : null;

/** 公共交通（显示车次/座位/乘客详情的交通方式） */
const PUB_TRANSPORTS = ['高铁', '飞机', '地铁', '公交', '游船'];
const LODGE_TYPES = ['酒店', '民宿', '青旅', '其他'];
const lodgeEmoji = ty => ({ '酒店': '🏨', '民宿': '🏡', '青旅': '🛏️', '其他': '🏠' })[ty] || '🏨';

/** 时间段显示：优先结构化 departTime/arriveTime，兼容旧 time 文本；跨天自动标 (+N) */
function timeRange(seg) {
  if (seg.departTime || seg.arriveTime) {
    const dep = seg.departTime || '';
    const arr = seg.arriveTime || '';
    if (dep && arr) {
      const cd = crossDays(seg);
      return cd > 0 ? dep + '-' + arr + ' (+' + cd + ')' : dep + '-' + arr;
    }
    return [dep, arr].filter(Boolean).join('-');
  }
  // 兼容旧数据：仅 time 文本（如 "23:00-01:00"），同样提示跨天
  const t = seg.time || '—';
  const cd = crossDays(seg);
  return cd > 0 ? t + ' (+' + cd + ')' : t;
}
/** 跨天天数：显式 crossDays 优先；否则到达<出发自动视为 +1（任何交通方式都提示，含地铁/步行）；结束≥开始且仅残留 +1 时按当天处理 */
function crossDays(seg) {
  if (seg.crossDays && Number(seg.crossDays) > 1) return Number(seg.crossDays); // 显式 +2/+3 必是用户设置
  const dep = seg.departTime, arr = seg.arriveTime;
  if (dep && arr) {
    if (arr < dep) return Number(seg.crossDays) > 0 ? Number(seg.crossDays) : 1;
    // 结束 ≥ 开始：当天（除非显式 >1）
    return 0;
  }
  // 兼容旧数据：仅 time 文本，到达<出发也视为跨天
  const m = String(seg.time || '').match(/(\d{1,2}:\d{2})\s*[-–—→~]\s*(\d{1,2}:\d{2})/);
  if (m && m[2] < m[1]) return Number(seg.crossDays) > 0 ? Number(seg.crossDays) : 1;
  return 0;
}
const isCrossDay = seg => crossDays(seg) > 0;
/** 跨天可编辑的交通方式（长途交通可调 +1~+4；步行/地铁/公交等默认 +1 固定） */
const CROSS_EDITABLE = ['飞机', '高铁', '自驾', '租车'];
/** 跨天段的后续接续段（dayOffset=1..N）：全天接续 + 到达日 00:00→到达 */
function nextDayTails(day) {
  const tails = [];
  (day.segments || []).forEach(s => {
    const cd = crossDays(s);
    if (cd > 0 && s.arriveTime) {
      const [h, m] = s.arriveTime.split(':').map(Number);
      for (let k = 1; k <= cd; k++) {
        tails.push({
          from: s.from || '?', to: s.to || '?', transport: s.transport,
          dayOffset: k,
          arrive: k === cd ? s.arriveTime : '24:00',
          dur: k === cd ? h * 60 + m : 1440,
        });
      }
    }
  });
  return tails;
}
/** 段的当天部分时长（跨天段 = 出发→24:00；普通段 = 全程） */
function dayPartDuration(seg) {
  if (isCrossDay(seg)) {
    const [h, m] = seg.departTime.split(':').map(Number);
    return 1440 - (h * 60 + m);
  }
  return segDuration(seg);
}
/** 解析出出发/到达时间（供时间选择器回填；旧数据 time="10:30-11:30" 自动拆分） */
function segTimes(seg) {
  if (seg.departTime || seg.arriveTime) return { depart: seg.departTime || '', arrive: seg.arriveTime || '' };
  const m = String(seg.time || '').match(/(\d{1,2}:\d{2})\s*[-–—→~]\s*(\d{1,2}:\d{2})/);
  return m ? { depart: m[1], arrive: m[2] } : { depart: '', arrive: '' };
}
/** 时间下拉组件：时（00-23）+ 分（00-59）两个下拉，组合写入 HH:MM；「-」占位表示不输入（可随时选回清除） */
function timeSelHtml(time, path) {
  const [h = '', m = ''] = String(time || '').split(':');
  const hrs = ['<option value="">-</option>'].concat(Array.from({ length: 24 }, (_, i) => {
    const v = String(i).padStart(2, '0');
    return `<option value="${v}" ${h === v ? 'selected' : ''}>${v}</option>`;
  })).join('');
  const mins = ['<option value="">-</option>'].concat(Array.from({ length: 60 }, (_, i) => {
    const v = String(i).padStart(2, '0');
    return `<option value="${v}" ${m === v ? 'selected' : ''}>${v}</option>`;
  })).join('');
  return `<span class="time-sel"><select class="seg-time-sel" data-path="${path}" data-part="h">${hrs}</select><i class="time-sel-colon">:</i><select class="seg-time-sel" data-path="${path}" data-part="m">${mins}</select></span>`;
}
/** 交通方式颜色（每日总览路线条） */
const TRANS_COLORS = {
  '高铁': '#4D96FF', '飞机': '#7B5CF0', '地铁': '#0FB5AE', '公交': '#4ECB71',
  '打车': 'var(--accent2)', '自驾': '#FF8C42', '步行': '#B0B0BC', '游船': '#38B2AC',
  '骑行': '#F0619B', '其他': '#8A8A9A',
};
const transColor = tr => TRANS_COLORS[tr] || '#8A8A9A';
/** 计算路线段时长（分钟）：优先结构化时间（含跨天 +N 天），兼容 time 文本与 "4h" 写法 */
function segDuration(seg) {
  if (seg.departTime && seg.arriveTime) {
    const a = seg.departTime.split(':').map(Number), b = seg.arriveTime.split(':').map(Number);
    let m = (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]) + 1440 * crossDays(seg);
    if (m < 0) m += 1440;
    return m;
  }
  const t = String(seg.time || '');
  const mm = t.match(/(\d{1,2}):(\d{2})\s*[-–—→~]\s*(\d{1,2}):(\d{2})/);
  if (mm) {
    let m = (Number(mm[3]) * 60 + Number(mm[4])) - (Number(mm[1]) * 60 + Number(mm[2]));
    if (m < 0) m += 1440;
    return m;
  }
  const h = t.match(/(\d+(?:\.\d+)?)\s*h/i);
  return h ? Math.round(parseFloat(h[1]) * 60) : 0;
}
/** 分钟 → "4h" / "45m" / "1h30m" */
function fmtDur(min) {
  if (!min) return '';
  if (min < 60) return min + 'm';
  const h = Math.floor(min / 60), m = min % 60;
  return m ? h + 'h' + m + 'm' : h + 'h';
}
/** 乘客数据规范化：一律返回 [{name, seat}]（兼容旧数据字符串数组 + 单值 seat） */
function normPax(seg) {
  if (!seg || !Array.isArray(seg.passengers)) return [];
  const ps = seg.passengers;
  if (ps.length && typeof ps[0] === 'string') {
    // 旧数据：字符串数组，seg.seat 为整段单值 → 给第一个乘客
    return ps.map((n, i) => ({ name: n, seat: i === 0 && seg.seat ? seg.seat : '' }));
  }
  return ps.map(p => (typeof p === 'string' ? { name: p, seat: '' } : p));
}
/** 乘客展示文本：'我（3车5D）、小美' */
function paxText(seg) {
  return normPax(seg).map(p => p.seat ? `${p.name}（${p.seat}）` : p.name).join('、');
}
