        </div>
      </div>
      ${sub ? `<div class="seg-view-sub">${sub}</div>` : ''}
    </div>`;
  }).join('');

  const expRows = (day.expenses || []).map((e, i) => {
    if (e.draft) {
      // —— 编辑态：填写中，✓ 确认 / ✕ 取消 ——
      return { key: 'e' + i, html: `<div class="edit-form">
        <div class="ef-line">
          <select data-path="days.${d}.expenses.${i}.category">
            ${CATS.map(c => `<option value="${c[1]}" ${e.category === c[1] ? 'selected' : ''}>${c[0]}${c[1]}</option>`).join('')}
          </select>
          <input class="amt" type="number" min="0" data-num data-path="days.${d}.expenses.${i}.amount" value="${num(e.amount) || ''}" placeholder="请输入价格">
        </div>
        <input class="item" maxlength="30" data-path="days.${d}.expenses.${i}.item" value="${esc(e.item)}" placeholder="项目（如：午餐 / 门票 / 打车）">
        <input class="exp-note-input" maxlength="30" data-path="days.${d}.expenses.${i}.note" value="${esc(e.note || '')}" placeholder="备注（如：和谁吃的、哪家店）">
        <div class="ef-line">
          <span class="ef-actions">
            <button class="done-btn" data-action="exp-done" data-date="${d}" data-idx="${i}" title="确认保存">✓</button>
            <button class="done-btn gray" data-action="exp-cancel" data-date="${d}" data-idx="${i}" title="取消（删除）">✕</button>
          </span>
        </div>
      </div>` };
    }
    // —— 展示态：已确认，✏️ 编辑 / 🗑️ 删除 ——
    return { key: 'e' + i, html: `<div class="exp-wrap">
      <div class="exp-view" draggable="true" data-date="${d}" data-idx="${i}" data-key="e${i}" data-type="expenses" title="拖动排序">
        <span class="drag-handle">≡</span>
        <span class="exp-view-cat"><i class="ic">${catEmoji(e.category)}</i>${esc(e.category)}</span>
        <span class="exp-view-item">${esc(e.item || '—')}</span>
        <span class="exp-view-amt">${fmtMoney(e.amount)}</span>
        <div class="exp-view-actions">
          <button class="icon-btn" data-action="exp-edit" data-date="${d}" data-idx="${i}" title="编辑">${pencilIcon()}</button>
          <button class="icon-btn" data-action="exp-del" data-date="${d}" data-idx="${i}" title="删除">${trashIcon()}</button>
        </div>
      </div>
      ${e.note ? `<div class="exp-view-note"><i class="note-emoji">💬</i> ${esc(e.note)}</div>` : ''}
    </div>` };
  });

  // 自动计入条目：路线交通（按交通工具合并）+ 住宿（项目名为类别），不可编辑、标注来源
  const autoExpRows = (() => {
    const rows = [];
    const transSum = {};
    (day.segments || []).forEach(s => {
      const p = num(s.price);
      if (p > 0) transSum[s.transport || '交通'] = (transSum[s.transport || '交通'] || 0) + p;
    });
    Object.entries(transSum).forEach(([tr, p]) => {
      rows.push({ key: 't' + tr, html: `<div class="exp-wrap auto-row">
        <div class="exp-view" draggable="true" data-date="${d}" data-key="t${tr}" data-type="auto-exp" title="拖动排序">
          <span class="drag-handle">≡</span>
          <span class="exp-view-cat"><i class="ic">${emojiOf(tr)}</i>交通</span>
          <span class="exp-view-item">${esc(tr)}</span>
          <span class="exp-view-amt">${fmtMoney(p)}</span>
          <div class="exp-view-actions"><span class="auto-tag">路线</span></div>
        </div>
      </div>` });
    });
    const lg = day.lodging;
    if (lg && (lg.name || lg.location) && num(lg.pricePerNight) > 0) {
      rows.push({ key: 'l', html: `<div class="exp-wrap auto-row">
        <div class="exp-view" draggable="true" data-date="${d}" data-key="l" data-type="auto-exp" title="拖动排序">
          <span class="drag-handle">≡</span>
          <span class="exp-view-cat"><i class="ic">${lodgeEmoji(lg.type || '酒店')}</i>住宿</span>
          <span class="exp-view-item">${esc(lg.type || '住宿')}</span>
          <span class="exp-view-amt">${fmtMoney(num(lg.pricePerNight))}</span>
          <div class="exp-view-actions"><span class="auto-tag">住宿</span></div>
        </div>
      </div>` });
    }
    return rows;
  })();

  // 记账区条目（手动 + 自动）按 day.expOrder 排序；未拖过则默认（手动在前、自动在后）
  const allExp = [...expRows, ...autoExpRows];
  const expOrder = (day.expOrder || []).filter(k => allExp.some(x => x.key === k));
  const expRest = allExp.filter(x => !expOrder.includes(x.key));
  const expListHtml = [...expOrder.map(k => allExp.find(x => x.key === k)), ...expRest].map(x => x.html).join('');

  const lodge = day.lodging || emptyDay().lodging;
  const hasLodge = !!(t.days[d] && t.days[d].lodging); // 仅真实数据中有住宿对象才显示（空白日显示添加按钮）
  const lodgeType = lodge.type && LODGE_TYPES.includes(lodge.type) ? lodge.type : '酒店';
  const lodgeDraft = hasLodge && t.days[d].lodging.draft;
  let lodgeHtml;
  if (!hasLodge) {
    // 无住宿 → 添加按钮
    lodgeHtml = `<div class="lodge-none">今日暂无住宿安排</div>
      <button class="add-row-btn" data-action="add-lodge" data-date="${d}">＋ 添加住宿</button>`;
  } else if (lodgeDraft) {
    // —— 编辑态：填写中，✓ 确认 / ✕ 取消 ——
    lodgeHtml = `
      <div class="edit-form">
        <div class="ef-line">
          <select data-path="days.${d}.lodging.type">
            ${LODGE_TYPES.map(x => `<option ${lodgeType === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
          <input class="amount" type="number" min="0" data-num data-path="days.${d}.lodging.pricePerNight" value="${num(lodge.pricePerNight) || ''}" placeholder="请输入价格">
        </div>
        <input maxlength="30" data-path="days.${d}.lodging.name" value="${esc(lodge.name)}" placeholder="${lodgeType}名（如：西湖边青旅）">
        <input maxlength="30" data-path="days.${d}.lodging.location" value="${esc(lodge.location)}" placeholder="位置（如：杭州西湖区）">
        <input maxlength="30" data-path="days.${d}.lodging.notes" value="${esc(lodge.notes)}" placeholder="备注（如：含早餐）">
        <div class="ef-line">
          <span class="ef-actions">
            <button class="done-btn" data-action="lodge-done" data-date="${d}" title="确认保存">✓</button>
            <button class="done-btn gray" data-action="lodge-cancel" data-date="${d}" title="取消（删除）">✕</button>
          </span>
        </div>
      </div>`;
  } else {
    // —— 展示态：已确认，✏️ 编辑 / 🗑️ 删除 ——
    // 位置与备注各自独立一行（备注无论长短都独占一行），缩进与主行对齐
    lodgeHtml = `
      <div class="lodge-view">
        <div class="lodge-view-main">
          <span class="lodge-view-type"><i class="ic">${lodgeEmoji(lodgeType)}</i></span>
          <span class="lodge-view-name">${esc(lodge.name || '未命名住宿')}</span>
          ${num(lodge.pricePerNight) ? `<span class="lodge-view-price">¥${Math.round(num(lodge.pricePerNight)).toLocaleString('zh-CN')}/晚</span>` : ''}
          <div class="lodge-view-actions">
            <button class="icon-btn" data-action="lodge-edit" data-date="${d}" title="编辑">${pencilIcon()}</button>
            <button class="icon-btn" data-action="lodge-del" data-date="${d}" title="删除">${trashIcon()}</button>
          </div>
        </div>
        ${lodge.location ? `<div class="lodge-view-sub">📍 ${esc(lodge.location)}</div>` : ''}
        ${lodge.notes ? `<div class="lodge-view-note">💬 ${esc(lodge.notes)}</div>` : ''}
      </div>`;
  }

  // 提醒列表（自动按时间排序，草稿行排最后；双态：编辑 ✓✕ / 展示 ✏️🗑）
  if (Array.isArray(day.reminders) && day.reminders.length > 1) {
    const drafts = day.reminders.filter(r => r.draft);
    const done = day.reminders.filter(r => !r.draft)
      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.time || '').localeCompare(String(b.time || '')));
    day.reminders = [...done, ...drafts];
  }
  const remRows = (day.reminders || []).map((r, i) => {
    if (r.draft) {
      return `<div class="rem-row">
        <input type="date" data-path="days.${d}.reminders.${i}.date" value="${esc(r.date || '')}" title="提醒日期">
        <input type="time" data-path="days.${d}.reminders.${i}.time" value="${esc(r.time || '')}" title="提醒时间">
        <input class="rem-title" maxlength="30" data-path="days.${d}.reminders.${i}.title" value="${esc(r.title || '')}" placeholder="提醒内容，如：9点抢票">
        <label class="switch" title="${r.enabled === false ? '关闭：不发送手机通知' : '开启：发送手机通知'}">
          <input type="checkbox" data-path="days.${d}.reminders.${i}.enabled" ${r.enabled === false ? '' : 'checked'}>
          <span class="track"></span>
        </label>
        <button class="done-btn" data-action="rem-done" data-date="${d}" data-idx="${i}" title="确认保存">✓</button>
        <button class="done-btn gray" data-action="rem-cancel" data-date="${d}" data-idx="${i}" title="取消（删除）">✕</button>
      </div>`;
    }
    const expired = !!(r.date && new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime() <= Date.now());
    return `<div class="rem-view">
      <span class="rem-dot"></span>
      <span class="rem-view-time${expired ? ' rem-expired' : ''}">${fmtDateCN(r.date || '')} ${esc(r.time || '')}</span>
      <span class="rem-view-title">${esc(r.title || '未命名提醒')}</span>
      <div class="rem-view-actions">
        <label class="switch" title="${r.enabled === false ? '关闭：不发送手机通知' : '开启：发送手机通知'}">
          <input type="checkbox" data-path="days.${d}.reminders.${i}.enabled" ${r.enabled === false ? '' : 'checked'}>
          <span class="track"></span>
        </label>
        <button class="icon-btn" data-action="rem-edit" data-date="${d}" data-idx="${i}" title="编辑">${pencilIcon()}</button>
        <button class="icon-btn" data-action="rem-del" data-date="${d}" data-idx="${i}" title="删除">${trashIcon()}</button>
      </div>
    </div>`;
  }).join('');

  return `<section class="day-card" id="day-${d}">
    <div class="day-head">
      <div class="day-badge"><span class="n">${Number(d.slice(8,10))}</span><span class="w">${Number(d.slice(5,7))}月</span></div>
      <div class="day-info">
        <h3><span class="t">${no === '—' ? '额外行程' : '第' + no + '天'} · ${fmtDateCN(d)} 星期${weekdayCN(d)}</span>
          ${day.weather && day.weather.cond
            ? `<span class="wx-badge" data-action="set-wx" data-date="${d}" title="点击设置天气">${wxEmoji(day.weather.cond)} ${esc(day.weather.cond)}${num(day.weather.low) != null ? ' ' + Math.round(num(day.weather.low)) + '°' : ''}~${num(day.weather.high) != null ? Math.round(num(day.weather.high)) + '°' : ''}</span>`
            : `<span class="wx-badge wx-empty" data-action="set-wx" data-date="${d}" title="设置天气">＋ 天气</span>`}
        </h3>
      </div>
      <button class="icon-btn del-day" data-date="${d}" title="删除当日行程">${trashIcon()}</button>
    </div>
    <div class="day-grid">
      <div class="block notes-box col-left">
        <div class="block-title"><span class="tag">📝</span>备注</div>
        <textarea maxlength="80" data-path="days.${d}.notes" placeholder="今日行程备注、提醒、注意事项…">${esc(day.notes || '')}</textarea>
      </div>
      <div class="block col-right">
        <div class="block-title"><span class="tag">⏰</span>提醒</div>
        <div class="rem-list">${remRows || '<div class="lodge-none">暂无提醒，可设置抢票、出发等定时提醒</div>'}</div>
        <button class="add-row-btn" data-action="add-rem" data-date="${d}">＋ 添加提醒</button>
      </div>
      <div class="block full lodge-block">
        <div class="block-title"><span class="tag">🌌</span>住宿</div>
        ${lodgeHtml}
      </div>
      <div class="block full">
        <div class="block-title"><span class="tag">🗺️</span>行程路线</div>
        <div class="seg-list">${segRows || '<div class="lodge-none">还没有路线，点击下方添加</div>'}</div>
        <button class="add-row-btn" data-action="add-seg" data-date="${d}">＋ 添加路线</button>
      </div>
      <div class="block full exp-split">
        <div class="exp-col exp-col-l">
          <div class="block-title"><span class="tag">🧾</span>记账</div>
          <div class="block-hint">💡 记录购物、吃饭、门票等日常消费</div>
          <div class="exp-list">${expListHtml || '<div class="lodge-none">还没有花销记录</div>'}</div>
          <button class="add-row-btn" data-action="add-exp" data-date="${d}">＋ 添加花销</button>
          <div class="exp-total"><span class="t">当日合计</span><span class="amt">${fmtMoney(st.exp)}</span></div>
        </div>
        <div class="exp-col exp-col-r">
          <div class="block-title"><span class="tag">💰</span>消费构成</div>
          ${donutChart(st.expByCat) || '<div class="lodge-none" style="margin:4px 0 0">今日暂无日常消费</div>'}
          <div class="donut-detail" id="donut-detail-${d}" hidden></div>
        </div>
      </div>
    </div>
  </section>`;
}

/* ================================================================
 * 事件：详情页（委托）
 * ================================================================ */
/** 每日行程 ↔ 旅行清单 切换：各自记住滚动位置，避免切回每日行程时跳到第一天 */
let savedScrollDaily = 0, savedScrollCl = 0;
function switchDetailView(showCl) {
  if (showCl) {
    savedScrollDaily = window.scrollY || 0;
    $('#days-col').classList.add('hidden');
    $('#cl-panel').classList.remove('hidden');
    requestAnimationFrame(() => window.scrollTo(0, savedScrollCl));
  } else {
    savedScrollCl = window.scrollY || 0;
    $('#cl-panel').classList.add('hidden');
    $('#days-col').classList.remove('hidden');
    requestAnimationFrame(() => window.scrollTo(0, savedScrollDaily));
  }
}
$('#view-detail').addEventListener('click', async e => {
  const t = currentTripId ? getTrip(currentTripId) : null;
  if (!t) return;

  // 天气徽章：打开天气设置
  const wxBtn = e.target.closest('[data-action="set-wx"]');
  if (wxBtn) { openWxModal(wxBtn.dataset.date); return; }
  // 左侧二级标题导航：旅行清单（页内切换）/ 每日行程（返回日期视图）
  // 每日行程右侧的折叠图标：只负责折叠/展开下面的日期列表，不跳转、不切换面板（在清单页点它也不跳回每日行程）
  const navCaret = e.target.closest('.day-nav .nav-caret');
  if (navCaret) {
    const title = navCaret.closest('.day-nav .nav-link[data-nav="daily"]');
    const dates = $('#nav-dates');
    if (title && dates) {
      dates.classList.toggle('hidden');
      title.classList.toggle('collapsed', dates.classList.contains('hidden'));
    }
    return;
  }
  const navLink = e.target.closest('.day-nav .nav-link');
  if (navLink) {
    const nav = navLink.dataset.nav;
    if (nav === 'checklist') {
      switchDetailView(true);
    } else if (nav === 'daily') {
      const panelOpen = !$('#cl-panel').classList.contains('hidden');
      if (panelOpen) {
        // 从旅行清单切回每日行程：不跳转回第一天，恢复上次每日视图的滚动位置
        switchDetailView(false);
      } else {
        // 已在每日视图时：点击「每日行程」折叠/展开日期列表（收起时只保留标题）
        const dates = $('#nav-dates');
        if (dates) {
          dates.classList.toggle('hidden');
          navLink.classList.toggle('collapsed', dates.classList.contains('hidden'));
        }
      }
    }
    return;
  }
  // 清单面板内返回按钮
  const clBack = e.target.closest('[data-action="cl-back"]');
  if (clBack) {
    switchDetailView(false);
    return;
  }

  // ===== 旅行清单（正式版）：物品 & 行李 =====
  const addPk = e.target.closest('[data-action="add-pk"]');
  if (addPk) {
    ensurePacking(t);
    const it = { id: 'pk' + uid(), category: '其他', name: '', importance: '待定', status: '未携带', notes: '', bag: null, draft: true };
    t.packing.push(it); t.packingOrder.push(it.id);
    pkSaveAndRender(t);
    return;
  }
  const pkAct = e.target.closest('[data-action^="pk-"]:not([data-action="pk-sync"])');
  if (pkAct) {
    ensurePacking(t);
    const i = t.packing.findIndex(p => p.id === pkAct.dataset.id);
    if (i < 0) return;
    const it = t.packing[i], act = pkAct.dataset.action;
    if (act === 'pk-done') {
      it.name = (it.name || '').trim();
      if (!it.category || it.category === '__custom__') it.category = '其他';
      if (!it.name) { t.packing.splice(i, 1); t.packingOrder = (t.packingOrder || []).filter(x => x !== it.id); }
      else { delete it.draft; delete it._snap; }
    } else if (act === 'pk-cancel') {
      if (cancelEdit(it)) { t.packing.splice(i, 1); t.packingOrder = (t.packingOrder || []).filter(x => x !== it.id); }
    } else if (act === 'pk-edit') { editSnap(it); it.draft = true; }
    else if (act === 'pk-del') { t.packing.splice(i, 1); t.packingOrder = (t.packingOrder || []).filter(x => x !== it.id); }
    else if (act === 'pk-toggle-status') { it.status = it.status === '已携带' ? '未携带' : '已携带'; }
    pkSaveAndRender(t);
    return;
  }
  const addBag = e.target.closest('[data-action="add-bag"]');
  if (addBag) {
    ensurePacking(t);
    t.luggageBags.push({ id: 'bag' + uid(), name: '', icon: bagIconOf(t.luggageBags.length), editing: true });
    pkSaveAndRender(t);
    return;
  }
  const bagAct = e.target.closest('[data-action^="bag-"]');
  if (bagAct) {
    ensurePacking(t);
    const b = t.luggageBags.find(x => x.id === bagAct.dataset.id);
    const act = bagAct.dataset.action;
    if (!b) return;
    if (act === 'bag-rename') { b._snap = JSON.parse(JSON.stringify(b)); b.editing = true; }
    else if (act === 'bag-done') { b.name = (b.name || '').trim() || ('行李' + (t.luggageBags.indexOf(b) + 1)); delete b.editing; delete b._snap; }
    else if (act === 'bag-cancel') {
      if (b._snap) { Object.assign(b, b._snap); delete b._snap; delete b.editing; }
      else t.luggageBags = t.luggageBags.filter(x => x.id !== b.id);
    }
    else if (act === 'bag-del') {
      t.packing.forEach(p => { if (p.bag === b.id) p.bag = null; });
      t.luggageBags = t.luggageBags.filter(x => x.id !== b.id);
    }
    pkSaveAndRender(t);
    return;
  }
  const chipOut = e.target.closest('[data-action="chip-out"]');
  if (chipOut) {
    ensurePacking(t);
    const p = t.packing.find(x => x.id === chipOut.dataset.id);
    if (p) p.bag = null;
    pkSaveAndRender(t);
    return;
  }
  const pkSync = e.target.closest('[data-action="pk-sync"]');
  if (pkSync) {
    ensurePacking(t);
    t.packing.forEach(p => { if (p.name && !p.draft) p.status = p.bag ? '已携带' : '未携带'; });
    pkSaveAndRender(t);
    showToast('✔ 已按收纳结果同步：放入的=已携带，未放入的=未携带');
    return;
  }

  // 日期导航跳转（在旅行清单页点日期同样生效：切回每日视图并定位到该天）
  const navBtn = e.target.closest('.day-nav button');
  if (navBtn) {
    const d = navBtn.dataset.date;
    if (!$('#cl-panel').classList.contains('hidden')) {
      savedScrollCl = window.scrollY || 0;
      $('#cl-panel').classList.add('hidden');
      $('#days-col').classList.remove('hidden');
    }
    if (t.days[d]) jumpToDay(d);
    else { ensureDay(t, d); renderDetail(t.id); jumpToDay(d); }
    return;
  }
  // 跳转并高亮
  function jumpToDay(d) {
    const el = document.getElementById('day-' + d);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); flashDay(el); }
  }

  const addSeg = e.target.closest('[data-action="add-seg"]');
  if (addSeg) {
    const d = addSeg.dataset.date;
    ensureDay(t, d);
    t.days[d].segments.push({ from: '', to: '', time: '', transport: '地铁', notes: '', draft: true });
    saveAndRender(t);
    return;
  }
  const addExp = e.target.closest('[data-action="add-exp"]');
  if (addExp) {
    const d = addExp.dataset.date;
    ensureDay(t, d);
    t.days[d].expenses.push({ category: '餐饮', item: '', amount: 0, when: '', draft: true });
    saveAndRender(t);
    return;
  }
  // 添加住宿（空状态按钮）
  const addLodge = e.target.closest('[data-action="add-lodge"]');
  if (addLodge) {
    const d = addLodge.dataset.date;
    ensureDay(t, d);
    t.days[d].lodging = { type: '酒店', name: '', location: '', pricePerNight: 0, notes: '', draft: true };
    saveAndRender(t);
    return;
  }
  // 住宿：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除
  const lodgeAction = e.target.closest('[data-action^="lodge-"]');
  if (lodgeAction) {
    const d = lodgeAction.dataset.date;
    const lg = t.days[d] ? t.days[d].lodging : null;
    if (!lg) return;
    const act = lodgeAction.dataset.action;
    if (act === 'lodge-done') {
      const empty = !(lg.name || '').trim() && !(lg.location || '').trim() && !num(lg.pricePerNight);
      if (empty) delete t.days[d].lodging;   // 空住宿确认 → 删除
      else delete lg.draft;                  // 确认保存 → 展示态
    } else if (act === 'lodge-cancel') { if (!cancelEdit(lg)) { /* 恢复编辑态原值 */ } else delete t.days[d].lodging; }
    else if (act === 'lodge-edit') { editSnap(lg); lg.draft = true; }
    else if (act === 'lodge-del') delete t.days[d].lodging; // 直接删除，不确认
    saveAndRender(t);
    return;
  }
  /* 环形图图例点击 → 展开该类别明细 */
  const leg = e.target.closest('.donut-legend span[data-cat]');
  if (leg) {
    const card = leg.closest('.day-card');
    const d = card ? card.id.slice(4) : null;
    if (d && t.days[d]) {
      const box = card.querySelector('.donut-detail');
      if (box) {
        if (!box.hidden && box.dataset.cat === leg.dataset.cat) { box.hidden = true; return; }
        const rows = catDetails(t.days[d], leg.dataset.cat);
        box.innerHTML = rows.length
          ? rows.map(r => `<div class="dd-row"><span>${esc(r.label)}</span><b>${fmtMoney(r.amt)}</b></div>`).join('')
          : '<div class="dd-row"><span style="color:var(--sub)">无明细</span></div>';
        box.dataset.cat = leg.dataset.cat;
        box.hidden = false;
      }
    }
    return;
  }

  const toggleSeg = e.target.closest('[data-action="toggle-seg"]');
  if (toggleSeg) {
    const wrap = toggleSeg.closest('.seg-wrap');
    if (wrap) {
      const detail = wrap.querySelector('.seg-detail');
      if (detail) {
        detail.classList.toggle('open');
        toggleSeg.classList.toggle('open');
      }
    }
    return;
  }

  const pickPax = e.target.closest('[data-action="pick-pax"]');
  if (pickPax) {
    openPaxPanel(t, pickPax.dataset.date, Number(pickPax.dataset.idx));
    return;
  }

  // 提醒：＋ 添加 / ✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除
  const remAction = e.target.closest('[data-action="add-rem"], [data-action^="rem-"]');
  if (remAction) {
    const d = remAction.dataset.date, i = Number(remAction.dataset.idx);
    const rems = t.days[d] ? t.days[d].reminders : null;
    const act = remAction.dataset.action;
    if (act === 'add-rem') {
      ensureDay(t, d);
      if (!Array.isArray(t.days[d].reminders)) t.days[d].reminders = [];
      t.days[d].reminders.push({ id: uid(), title: '', date: d, time: '', draft: true });
    } else if (rems && rems[i]) {
      if (act === 'rem-done') {
        const r = rems[i];
        if (!(r.title || '').trim() || !(r.date || '').trim()) rems.splice(i, 1);
        else if (await canRemind()) {
          delete r.draft; delete r.reminded;
          // 日期已过期：保留记录但不提醒（防止保存后立即触发）
          const ts = new Date(r.date + 'T' + (r.time || '09:00') + ':00').getTime();
          if (!isNaN(ts) && ts <= Date.now()) r.reminded = true;
        }
        else { rems.splice(i, 1); showToast('⚠️ 未授权通知权限，提醒已取消'); }
      } else if (act === 'rem-cancel') { if (cancelEdit(rems[i])) rems.splice(i, 1); }
      else if (act === 'rem-edit') { editSnap(rems[i]); rems[i].draft = true; delete rems[i].reminded; }
      else if (act === 'rem-del') rems.splice(i, 1);
    }
    saveAndRender(t);
    syncReminders(t);
    return;
  }

  /* —— 路线：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除 —— */
  const segAction = e.target.closest('[data-action^="seg-"]');
  if (segAction) {
    const d = segAction.dataset.date, i = Number(segAction.dataset.idx);
    const segs = t.days[d] ? t.days[d].segments : null;
    if (!segs || !segs[i]) return;
    const act = segAction.dataset.action;
    if (act === 'seg-done') {
      const s = segs[i];
      // 时间戳校验：已填时间必须为合法 HH:MM（小时 00-23、分钟 00-59），非法拦截不保存
      const TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
      const bad = [s.departTime, s.arriveTime].some(t => t && !TIME_RE.test(String(t)));
      if (bad) {
        const row = document.querySelector(`#day-${d} .seg-wrap.editing`);
        if (row) row.querySelectorAll('.seg-time').forEach(el => el.style.borderColor = '#e5484d');
        setSaveState('⏰ 时间格式不正确：小时 00-23、分钟 00-59');
        return;
      }
      const empty = !(s.from || '').trim() && !(s.to || '').trim() && !(s.time || '').trim() &&
        !(s.notes || '').trim() && !(s.vehicleNo || '').trim() && !(s.seat || '').trim() && !(s.passengers || []).length && !num(s.price);
      if (empty) segs.splice(i, 1);   // 空记录确认 → 直接删除
      else delete s.draft;            // 确认保存 → 展示态
    } else if (act === 'seg-cancel') { if (cancelEdit(segs[i])) segs.splice(i, 1); }
    else if (act === 'seg-edit') { editSnap(segs[i]); segs[i].draft = true; }
    else if (act === 'seg-del') segs.splice(i, 1);   // 单条记录直接删除，不弹窗
    saveAndRender(t);
    return;
  }

  /* —— 花销：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除 —— */
  const expAction = e.target.closest('[data-action^="exp-"]');
  if (expAction) {
    const d = expAction.dataset.date, i = Number(expAction.dataset.idx);
    const exps = t.days[d] ? t.days[d].expenses : null;
    if (!exps || !exps[i]) return;
    const act = expAction.dataset.action;
    if (act === 'exp-done') {
      const x = exps[i];
      const empty = !(x.item || '').trim() && !num(x.amount) && !(x.when || '').trim() && !(x.note || '').trim();
      if (empty) exps.splice(i, 1);   // 空记录确认 → 直接删除
      else delete x.draft;            // 确认保存 → 展示态
    } else if (act === 'exp-cancel') { if (cancelEdit(exps[i])) exps.splice(i, 1); }
    else if (act === 'exp-edit') { editSnap(exps[i]); exps[i].draft = true; }
    else if (act === 'exp-del') exps.splice(i, 1);   // 单条记录直接删除，不弹窗
    saveAndRender(t);
    return;
  }

  const delDay = e.target.closest('.del-day');
  if (delDay) {
    if (confirm('删除 ' + delDay.dataset.date + ' 当天的全部行程？')) {
      delete t.days[delDay.dataset.date];
      saveAndRender(t);
    }
    return;
  }
});

/** 编辑快照：编辑开始存原值，取消时恢复（新增记录无快照则删除） */
function editSnap(o) { o._snap = JSON.parse(JSON.stringify(o)); delete o._snap.draft; delete o._snap._snap; }
function cancelEdit(o) {
  if (o && o._snap) {
    Object.keys(o).forEach(k => { if (k !== '_snap') delete o[k]; });
    Object.assign(o, o._snap);
    delete o._snap; delete o.draft;
    return false; // 恢复编辑（未删除）
  }
  return true; // 无快照 → 调用方删除
}
/** 按 path 删除数据（days.2026-08-15.segments.0） */
function delByPath(t, path) {
  const parts = path.split('.');
  let cur = t;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  const key = parts[parts.length - 1];
  if (Array.isArray(cur)) cur.splice(Number(key), 1);
  else delete cur[key];
}

/** 编辑字段（委托：input / change） */
$('#view-detail').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.path) {
    const t = getTrip(currentTripId);
    if (!t) return;
    // 旅行清单：__pk.<itemId>.<field> / __bag.<bagId>.<field> → 直接写对象
    if (el.dataset.path.startsWith('__pk.') || el.dataset.path.startsWith('__bag.')) {
      const [ns, id, field] = el.dataset.path.split('.');
      const src = ns === '__pk' ? t.packing : t.luggageBags;
      const obj = (src || []).find(o => o.id === id);
      if (obj) obj[field] = el.dataset.num ? num(el.value) : el.value;
      scheduleSave();
      return;
    }
    // 滑动开关：checkbox 读 checked 写入 enabled，并即时重新同步系统提醒
    if (el.type === 'checkbox') {
      setByPath(t, el.dataset.path, el.checked);
      if (el.dataset.path.includes('reminders')) { saveAndRender(t); syncReminders(t); }
      return;
    }
    // 时间输入：输入/删除都统一格式化（冒号始终保留；纯冒号占位不写入数据）
    if (el.classList.contains('seg-time')) {
      const fmt = fmtTimeInput(el.value);
      el.value = fmt;
      setByPath(t, el.dataset.path, fmt === ':' ? '' : fmt);
    } else {
      setByPath(t, el.dataset.path, el.dataset.num ? num(el.value) : el.value);
      if (el.classList.contains('seg-time-native')) el.classList.toggle('empty', !el.value);
    }
    // 出发/到达时间变化 → 同步组合 time 字段；跨天自动 +1（结束<开始时），改回当天自动清除
    syncSegTimeFields(t, el.dataset.path);
    scheduleSave();
    updateTotalsUI(t, el.dataset.path); // 金额变化时局部刷新合计，不重渲染、不打断输入
  }
});

/** 旅行清单：分类选择「其他（自定义）」时展开自定义输入框 */
$('#cl-panel').addEventListener('change', e => {
  const sel = e.target.closest('select[data-path]');
  if (!sel) return;
  const m = (sel.dataset.path || '').match(/^__pk\.([^.]+)\.category$/);
  if (!m) return;
  const t = getTrip(currentTripId);
  if (!t) return;
  ensurePacking(t);
  const it = t.packing.find(p => p.id === m[1]);
  if (!it) return;
  const customInp = sel.closest('.pk-edit') ? sel.closest('.pk-edit').querySelector('[data-custom-cat]') : null;
  if (sel.value === '__custom__') {
    it.category = '';
    if (customInp) { customInp.hidden = false; customInp.focus(); }
  } else {
    it.category = sel.value;
    if (customInp) customInp.hidden = true;
  }
  scheduleSave();
});

/** 出发/到达时间变化后的联动：组合 time 字段、跨天自动 +1/清除、同步跨天下拉 */
function syncSegTimeFields(t, path) {
  const parts = path.split('.');
  if (parts[2] !== 'segments' || (parts[4] !== 'departTime' && parts[4] !== 'arriveTime')) return;
  const seg = t.days[parts[1]] && t.days[parts[1]].segments[Number(parts[3])];
  if (!seg) return;
  if (seg.departTime && seg.arriveTime) {
    if (seg.arriveTime < seg.departTime) {
      // 跨天：未设置时自动 +1；显式值（含用户选的 0）保持
      if (seg.crossDays === undefined || seg.crossDays === '') seg.crossDays = 1;
    } else if (seg.crossDays === undefined || seg.crossDays === '' || Number(seg.crossDays) === 1) {
      // 结束 ≥ 开始：清除自动的 +1（显式 +2/+3 保持）
      delete seg.crossDays;
    }
    seg.time = [seg.departTime, seg.arriveTime].filter(Boolean).join('-');
  } else if (!seg.departTime && !seg.arriveTime) {
    // 时间全部清空：同步清除组合字段与跨天标记，避免展示残留旧时间
    delete seg.time;
    delete seg.crossDays;
  } else {
    seg.time = [seg.departTime, seg.arriveTime].filter(Boolean).join('-');
  }
  // 同步更新跨天下拉选中值（如自动 +1 后）
  const cdSel = document.querySelector(`select[data-path="days.${parts[1]}.segments.${parts[3]}.crossDays"]`);
  if (cdSel) cdSel.value = String(crossDays(seg));
}

// 时间退格：删数字、冒号保留（光标在末尾时拦截 Backspace 自定义删除；有选区走浏览器默认）
$('#view-detail').addEventListener('keydown', e => {
  const el = e.target;
  if (!el.classList.contains('seg-time') || e.key !== 'Backspace') return;
  if (el.selectionStart !== el.selectionEnd) return;
  e.preventDefault();
  let nv = el.value;
  if (nv.endsWith(':')) nv = nv.slice(0, -1); // 末尾是冒号：越过冒号删前面的数字
  nv = nv.slice(0, -1);
  el.value = fmtTimeInput(nv);
  el.dispatchEvent(new Event('input', { bubbles: true }));
});

// 时间输入失焦时规整格式（删除到一半的状态也会标准化），纯冒号占位清空
$('#view-detail').addEventListener('focusout', e => {
  const el = e.target;
  if (!el.classList.contains('seg-time') || !el.dataset.path) return;
  const t = getTrip(currentTripId);
  if (!t) return;
  const fmt = fmtTimeInput(el.value);
  if (el.value !== fmt) {
    el.value = fmt;
    setByPath(t, el.dataset.path, fmt === ':' ? '' : fmt);
    scheduleSave();
  }
});

/** 编辑金额后局部更新当日合计 / 头部花费 / 总览 / 统计条 / 日期导航 */
function updateTotalsUI(t, path) {
  const parts = path.split('.');
  const isExpense = parts[2] === 'expenses';
  const isLodgePrice = parts[2] === 'lodging' && parts[3] === 'pricePerNight';
  const isSegPrice = parts[2] === 'segments' && parts[4] === 'price';
  if (!(isExpense || isLodgePrice || isSegPrice)) return;
  const d = parts[1];
  const day = t.days[d];
  if (!day) return;
  const s = dayStats(day);
  const fmt = fmtMoney(s.exp);
  const q = sel => { const el = document.querySelector(sel); if (el) el.textContent = fmt; };
  q(`#day-${d} .exp-total .amt`);                 // 记账合计
  // 总览住宿（lodging 编辑时，住宿是总览第 1 项）
  if (parts[2] === 'lodging') {
    const lodge = day.lodging || emptyDay().lodging;
    const ovLodge = document.querySelector(`#day-${d} .overview-grid .ov-item:nth-child(1)`);
    if (ovLodge) {
      const numEl = ovLodge.querySelector('.num'), lblEl = ovLodge.querySelector('.lbl');
      if (numEl) numEl.textContent = lodge.name ? esc(lodge.name) : '—';
      if (lblEl) lblEl.textContent = (lodge.name || lodge.location) ?
        `${esc(lodge.location || '')} · ${num(lodge.pricePerNight) ? fmtMoney(lodge.pricePerNight) + '/晚' : '价格未填'}` : '今日无住宿';
    }
  }
  // 顶部统计条：总花费 / 预算结余（长框内 data-key 定位）
  const st = tripStats(t);
  const statExp = document.querySelector('#stat-strip .stat-long [data-key="exp"] .num');
  if (statExp) statExp.textContent = fmtMoney(st.exp);
  // 预算结余
  const remain = st.budget - st.exp;
  const statRemain = document.querySelector('#stat-strip .stat-long [data-key="remain"] .num');
  if (statRemain) { statRemain.textContent = st.budget ? fmtMoney(remain) : '—'; statRemain.classList.toggle('over', remain < 0); }
  // 日期导航按钮金额
  const navInfo = document.querySelector(`#day-nav button[data-date="${d}"] .info`);
  if (navInfo) navInfo.textContent = fmt;
}
$('#view-detail').addEventListener('change', e => {
  const el = e.target;
  const t = getTrip(currentTripId);
  if (!t) return;
  // 时间下拉（时/分两个 select 组合为 HH:MM 写入同一 path；选「-」清空）
  if (el.classList.contains('seg-time-sel')) {
    const wrap = el.closest('.time-sel');
    if (!wrap) return;
    const h = wrap.querySelector('[data-part="h"]').value;
    const m = wrap.querySelector('[data-part="m"]').value;
    const v = (h && m) ? h + ':' + m : '';
    setByPath(t, el.dataset.path, v);
    syncSegTimeFields(t, el.dataset.path);
    scheduleSave();
    return;
  }
  if (el.dataset.path) {
    setByPath(t, el.dataset.path, el.value);
    scheduleSave();
    // 交通方式切换 / 住宿类型变化 → 重渲染以显示/隐藏对应 UI
    if (el.classList.contains('seg-trans') || el.dataset.path.endsWith('.lodging.type')) {
      renderDetail(t.id);
    }
  }
});

/** 交通乘客选择面板：与出行人挂钩 + 每人独立座位号 */
function openPaxPanel(t, date, idx) {
  const day = t.days[date];
  if (!day || !day.segments[idx]) return;
  const seg = day.segments[idx];
  const sel = new Map(normPax(seg).map(p => [p.name, p.seat || '']));
  const all = tripTravelers(t);
  $('#modal-box').innerHTML = `
    <div class="pax-panel">
      <h2>👥 乘客与座位（${esc(seg.transport || '')} ${esc((seg.from || '?') + '→' + (seg.to || '?'))}）</h2>
      <div class="pax-list" id="pax-list">
        ${all.length ? all.map(n =>
          `<span class="pax-opt ${sel.has(n) ? 'sel' : ''}" data-n="${esc(n)}">${esc(n)}</span>`).join('')
          : '<span class="lodge-none">出行计划还没有出行人，可以直接在下方输入乘客名字</span>'}
      </div>
      <div class="pax-custom">
        <input id="pax-custom-name" maxlength="30" placeholder="输入其他乘客姓名">
        <button class="btn btn-ghost" id="pax-add-custom">＋ 添加</button>
      </div>
      <div class="pax-seats" id="pax-seats"></div>
      <div class="pax-hint">💡 点击名字选中/取消；每个乘客可单独填写座位号（如 3车5D）。</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pax-cancel">取消</button>
        <button class="btn btn-primary" id="pax-ok">确定</button>
      </div>
    </div>`;
  $('#modal-root').classList.remove('hidden');

  const seatsBox = $('#pax-seats');
  function renderSeats() {
    seatsBox.innerHTML = [...sel.entries()].map(([name, seat]) => `
      <div class="pax-seat-row">
        <span class="pax-seat-name">👤 ${esc(name)}</span>
        <input class="pax-seat-input" maxlength="30" data-name="${esc(name)}" value="${esc(seat)}" placeholder="座位号，如 3车5D">
        <button class="done-btn gray" data-rm="${esc(name)}" title="移除">✕</button>
      </div>`).join('') || '<span class="lodge-none">尚未选择乘客</span>';
  }
  renderSeats();

  $('#pax-list').addEventListener('click', e => {
    const opt = e.target.closest('.pax-opt');
    if (opt) {
      opt.classList.toggle('sel');
      if (opt.classList.contains('sel')) sel.set(opt.dataset.n, '');
      else sel.delete(opt.dataset.n);
      renderSeats();
    }
  });
  $('#pax-add-custom').addEventListener('click', () => {
    const v = $('#pax-custom-name').value.trim();
    if (!v) return;
    if (!sel.has(v)) {
      const dup = [...document.querySelectorAll('.pax-opt')].some(el => el.dataset.n === v);
      if (!dup) {
        const s = document.createElement('span');
        s.className = 'pax-opt sel';
        s.dataset.n = v;
        s.textContent = v;
        $('#pax-list').appendChild(s);
      }
      sel.set(v, '');
    }
    $('#pax-custom-name').value = '';
    renderSeats();
  });
  // 座位号输入实时同步
  seatsBox.addEventListener('input', e => {
    const inp = e.target.closest('.pax-seat-input');
    if (inp) sel.set(inp.dataset.name, inp.value);
  });
  seatsBox.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      sel.delete(rm.dataset.rm);
      const opt = [...document.querySelectorAll('.pax-opt')].find(el => el.dataset.n === rm.dataset.rm);
      if (opt) opt.classList.remove('sel');
      renderSeats();
    }
  });
  $('#pax-cancel').addEventListener('click', closeModal);
  $('#pax-ok').addEventListener('click', () => {
    seg.passengers = [...sel.entries()].map(([name, seat]) => ({ name, seat }));
    delete seg.seat; // 座位已归属到各乘客
    closeModal();
    saveAndRender(t);
  });
}

function setByPath(t, path, v) {
  const parts = path.split('.');
  let cur = t;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = v;
}

function ensureDay(t, d) { if (!t.days[d]) t.days[d] = emptyDay(); }
function saveAndRender(t) { scheduleSave(); renderDetail(t.id); }
function flashDay(el) {
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

/* ================================================================
 * 事件：列表页 & 顶栏

/* 俏皮日历：自绘日期选择器（今天=虚线圆圈，选中=实心主题色；开始/结束联动 min） */
let dpFor = null, dpYear = 0, dpMonth = 0;
const dpPad = n => String(n).padStart(2, '0');
function updateDpTrigger(forId, v) {
  const el = document.getElementById('dp-' + (forId === 'm-start' ? 'start' : 'end'));
  if (!el) return;
  el.textContent = v ? `${Number(v.slice(5, 7))}月${Number(v.slice(8, 10))}日` : '请选择日期';
  el.classList.toggle('empty', !v);
}
function openDatePicker(forId) {
  dpFor = forId;
  const cur = document.getElementById(forId).value;
  const min = forId === 'm-end' ? document.getElementById('m-start').value : '';
  // 结束日期：优先定位到已选值，其次开始日期所在月（避免整月禁用需翻月）
  const base = cur ? new Date(cur + 'T00:00:00') : (min ? new Date(min + 'T00:00:00') : new Date());
  dpYear = base.getFullYear(); dpMonth = base.getMonth();
  renderDatePanel();
  document.getElementById('dp-panel').classList.remove('hidden');
}
function renderDatePanel() {
  const first = new Date(dpYear, dpMonth, 1);
  const startDow = first.getDay();
  const days = new Date(dpYear, dpMonth + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);
  const min = dpFor === 'm-end' ? document.getElementById('m-start').value : '';
  const sel = document.getElementById(dpFor).value;
  let cells = '';
  for (let i = 0; i < startDow; i++) cells += '<span class="dp-d disabled"></span>';
  for (let d = 1; d <= days; d++) {
    const ds = dpYear + '-' + dpPad(dpMonth + 1) + '-' + dpPad(d);
    const cls = ['dp-d'];
    if (ds === todayStr) cls.push('today');
    if (min && ds < min) cls.push('disabled');
    if (ds === sel) cls.push('sel');
    cells += `<span class="${cls.join(' ')}" data-d="${ds}">${d}</span>`;
  }
  document.getElementById('dp-grid').innerHTML = cells;
  document.getElementById('dp-title').textContent = dpYear + '年' + (dpMonth + 1) + '月';
}
function pickDate(v) {
  document.getElementById(dpFor).value = v;
  updateDpTrigger(dpFor, v);
  if (dpFor === 'm-start') {
    const end = document.getElementById('m-end');
    if (end.value && end.value < v) { end.value = ''; updateDpTrigger('m-end', ''); }
  }
  document.getElementById('dp-panel').classList.add('hidden');
}
// 日历交互（委托：触发器 / 翻月 / 选日）
document.addEventListener('click', e => {
  const trig = e.target.closest('.dp-trigger');
  if (trig) { openDatePicker(trig.dataset.for); return; }
  if (e.target.closest('#dp-prev')) { dpMonth--; renderDatePanel(); return; }
  if (e.target.closest('#dp-next')) { dpMonth++; renderDatePanel(); return; }
  const cell = e.target.closest('.dp-d:not(.disabled)');
  if (cell && dpFor && cell.dataset.d) { pickDate(cell.dataset.d); return; }
});

    // 找一个范围内还没有行程的日期；范围内排满则在已有行程最后一天之后追加一天
    let next = null;
    for (let i = 0; i <= diffDays(t.startDate, t.endDate); i++) {
      const d = addDays(t.startDate, i);
      if (!t.days[d]) { next = d; break; }
    }
    if (!next) {
      const keys = Object.keys(t.days || {}).sort();
      next = addDays(keys[keys.length - 1] || t.endDate, 1);
    }
    ensureDay(t, next);
    saveAndRender(t);
    setTimeout(() => { const el = document.getElementById('day-' + next); if (el) { el.scrollIntoView({ behavior: 'smooth' }); flashDay(el); } }, 60);
    showToast('已为 ' + next + ' 添加空白行程');
  }
});

/* ============ 拖拽排序（路线 / 花销） ============ */
let dragState = null;
function dragRowFrom(e) {
  return e.target.closest('.seg-view, .exp-view');
}
$('#days-col').addEventListener('dragstart', e => {
  const row = dragRowFrom(e);
  if (!row) return;
  dragState = { date: row.dataset.date, type: row.dataset.type, idx: Number(row.dataset.idx), key: row.dataset.key || null };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'drag'); } catch (_) { /* 某些浏览器要求 setData */ }
});
$('#days-col').addEventListener('dragover', e => {
  if (!dragState) return;
  const row = dragRowFrom(e);
  if (!row) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // 根据鼠标在目标行的上半/下半决定插入位置，并高亮插入指示线
  const rect = row.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('drag-over', 'drag-over-after'));
  row.classList.add(after ? 'drag-over-after' : 'drag-over');
});
$('#days-col').addEventListener('drop', e => {
  e.preventDefault();
  if (!dragState) return;
  const row = dragRowFrom(e);
  if (!row) return;
  const t = getTrip(currentTripId);
  if (t) {
    const day = t.days[dragState.date];
    // 记账区（手动 expenses + 自动 auto-exp）混合排序：expOrder 持久化显示顺序
    if (day && (dragState.type === 'expenses' || dragState.type === 'auto-exp')
        && (row.dataset.type === 'expenses' || row.dataset.type === 'auto-exp')
        && row.dataset.date === dragState.date && dragState.key && row.dataset.key) {
      const allKeys = (day.expenses || []).map((_, i) => 'e' + i)
        .concat(Object.entries((() => { const s2 = {}; (day.segments || []).forEach(x => { if (num(x.price) > 0) s2[x.transport || '交通'] = 1; }); return s2; })()).map(([tr]) => 't' + tr))
        .concat((day.lodging && (day.lodging.name || day.lodging.location) && num(day.lodging.pricePerNight) > 0) ? ['l'] : []);
      const order = (day.expOrder || []).filter(k => allKeys.includes(k));
      allKeys.forEach(k => { if (!order.includes(k)) order.push(k); });
      const from = order.indexOf(dragState.key);
      const to = order.indexOf(row.dataset.key);
      if (from >= 0 && to >= 0 && from !== to) {
        const rect = row.getBoundingClientRect();
        let dest = to + (e.clientY > rect.top + rect.height / 2 ? 1 : 0);
        if (dest > from) dest--;
        const [k] = order.splice(from, 1);
        order.splice(dest, 0, k);
        day.expOrder = order;
        saveAndRender(t);
      }
      document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
      dragState = null;
      return;
    }
    const list = day ? day[dragState.type] : null;
    if (list && row.dataset.date === dragState.date && row.dataset.type === dragState.type) {
      const from = dragState.idx;
      const rect = row.getBoundingClientRect();
      let to = Number(row.dataset.idx) + (e.clientY > rect.top + rect.height / 2 ? 1 : 0);
      if (from !== to && to !== from + 1) {
        const [item] = list.splice(from, 1);
        list.splice(from < to ? to - 1 : to, 0, item);
        saveAndRender(t);
      }
    }
  }
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
  dragState = null;
});
$('#days-col').addEventListener('dragend', () => {
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
  dragState = null;
});

/* ============ 旅行清单：物品行 & 行李chip 拖拽（排序 / 跨组改分类 / 拖入行李） ============ */
let pkDrag = null;
$('#cl-panel').addEventListener('dragstart', e => {
  const row = e.target.closest('.pk-row, .pk-chip');
  if (!row) return;
  pkDrag = { id: row.dataset.id, type: row.dataset.type };
  row.classList.add('dragging');

  try { e.dataTransfer.setData('text/plain', 'pk'); } catch (_) {}
});
$('#cl-panel').addEventListener('dragover', e => {
  if (!pkDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // 行李卡高亮
  const bag = e.target.closest('.lug-card:not(.editing)');
  document.querySelectorAll('.lug-card').forEach(el => el.classList.remove('pk-drop'));
  if (bag) bag.classList.add('pk-drop');
  // 物品行排序指示线
  const row = e.target.closest('.pk-row:not(.dragging)');
  document.querySelectorAll('.pk-row').forEach(el => el.classList.remove('drag-over', 'drag-over-after'));
  if (row && pkDrag.type === 'packing') {
    const rect = row.getBoundingClientRect();
    row.classList.add(e.clientY > rect.top + rect.height / 2 ? 'drag-over-after' : 'drag-over');
  }
});
$('#cl-panel').addEventListener('drop', e => {
  if (!pkDrag) return;
  e.preventDefault();
  const t = currentTripId ? getTrip(currentTripId) : null;
  if (!t) { pkDrag = null; return; }
  ensurePacking(t);
  const p = t.packing.find(x => x.id === pkDrag.id);
  const bag = e.target.closest('.lug-card:not(.editing)');
  const row = e.target.closest('.pk-row:not(.dragging)');
  if (bag && p) {                       // 拖入行李卡
    if (p.bag !== bag.dataset.bagId) { p.bag = bag.dataset.bagId; pkSaveAndRender(t); }
  } else if (e.target.closest('.pk-pool') && p) {  // 拖回物品池
    if (p.bag) { p.bag = null; pkSaveAndRender(t); }
  } else if (row && p && pkDrag.type === 'packing') { // 整表排序（跨组即改品类）
    const order = (t.packingOrder || []).filter(id => t.packing.some(x => x.id === id));
    const from = order.indexOf(pkDrag.id);
    let to = order.indexOf(row.dataset.id);
    if (from >= 0 && to >= 0 && from !== to) {
      const rect = row.getBoundingClientRect();
      let dest = to + (e.clientY > rect.top + rect.height / 2 ? 1 : 0);
      if (dest > from) dest--;
      const [id] = order.splice(from, 1);
      order.splice(dest, 0, id);
      t.packingOrder = order;
      // 拖到别的品类组内 → 该物品自动改为目标组品类
      const target = t.packing.find(x => x.id === row.dataset.id);
      if (target && target.category !== p.category) p.category = target.category;
      pkSaveAndRender(t);
    }
  }
  pkDrag = null;
});
$('#cl-panel').addEventListener('dragend', () => {
  document.querySelectorAll('.pk-row, .pk-chip').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
  document.querySelectorAll('.lug-card').forEach(el => el.classList.remove('pk-drop'));
  pkDrag = null;
});

function closeModal() {
  $('#modal-root').classList.add('hidden');
  if ($('#btn-new').dataset.wasHidden === '0') $('#btn-new').hidden = false; // 恢复顶栏入口（原为可见时）
}
$('#modal-root').addEventListener('click', e => { if (e.target === $('#modal-root')) closeModal(); });


/* ================================================================
 * PDF 文档视图（带目录，目录标题为日期）
 * ================================================================ */
$('#btn-pdf').addEventListener('click', () => { const t = getTrip(currentTripId); if (t) openDoc(t); });
$('#btn-close-doc').addEventListener('click', closeDoc);
// 打印前重新生成文档，确保打印内容与最新数据同步（新增内容无需刷新页面）
$('#btn-doc-print').addEventListener('click', () => {
  const t = getTrip(currentTripId);
  if (t) buildDoc(t);
  window.print();
});

function openDoc(t) { $('#doc').classList.remove('hidden'); applyTripTheme($('#doc'), t.color); buildDoc(t); }
function closeDoc() { $('#doc').classList.add('hidden'); }

function buildDoc(t) {
  const st = tripStats(t);
  const dates = st.dates;
  const travelers = tripTravelers(t);
  const grad = `linear-gradient(135deg,${t.color},${shade(t.color, -35)})`;

  const tocHtml = dates.map(d => {
    const s = dayStats(t.days[d]);
    return `<a class="toc-item" href="#doc-day-${d}">
      <span class="toc-no">Day ${dayNo(t, d)}</span>
      <span class="toc-date">${fmtDateCN(d)} · 周${weekdayCN(d)}</span>
      <span class="toc-dots"></span>
      <span class="toc-sum">${fmtMoney(s.exp)} · ${s.segs} 段</span>
    </a>`;
  }).join('');

  const daysHtml = dates.map(d => {
    const day = t.days[d];
    const s = dayStats(day);
    const lodge = s.lodge;
    const lodgeType = lodge && lodge.type && LODGE_TYPES.includes(lodge.type) ? lodge.type : '酒店';

    const segRows = (day.segments || []).filter(s => !s.draft).map(seg => {
      // 班次 / 乘客 / 座位 / 价格 分四列；空值显示 -
      const paxs = normPax(seg);
      const paxNames = paxs.map(p => p.name).join('、');
      const seats = paxs.map(p => p.seat).filter(Boolean).join('、') || seg.seat || '';
      return `<tr>
        <td class="d-time">${esc(timeRange(seg))}</td>
        <td class="d-path">${esc(seg.from || '?')} → ${esc(seg.to || '?')}</td>
        <td class="d-trans">${emojiOf(seg.transport)} ${esc(seg.transport || '—')}</td>
        <td>${esc(seg.vehicleNo || '—')}</td>
        <td>${esc(paxNames || '—')}</td>
        <td>${esc(seats || '—')}</td>
        <td class="d-price">${num(seg.price) ? fmtMoney(seg.price) : '—'}</td>
        <td class="d-note">${esc(seg.notes || '—')}</td>
      </tr>`;
    }).join('');

    const expRows = (day.expenses || []).filter(e => !e.draft).map(e => {
      return `<tr>
        <td>${catEmoji(e.category)} ${esc(e.category)}</td>
        <td>${esc(e.item || '—')}</td>
        <td class="d-amt">${fmtMoney(e.amount)}</td>
      </tr>`;
    }).join('');

    // 提醒（仅已确认的，按时间排序）
    const remRows = (day.reminders || []).filter(r => r.title && r.date && !r.draft)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.time || '').localeCompare(String(b.time || '')))
      .map(r => `<tr><td class="d-time">${esc(fmtDateCN(r.date))} ${esc(r.time || '')}</td><td>${esc(r.title)}</td></tr>`).join('');
    // 今日路线总时长（含跨天接续，与详情页总览一致）
    const tails = [];
    for (let back = 1; back <= 7; back++) {
      const pd = t.days[addDays(d, -back)];
      if (!pd) continue;
      nextDayTails(pd).forEach(tl => { if (tl.dayOffset === back) tails.push(tl); });
    }
    const totalMin = (day.segments || []).reduce((a, sg) => a + dayPartDuration(sg), 0)
      + tails.reduce((a, tl) => a + tl.dur, 0);

    return `<section class="doc-day" id="doc-day-${d}">
      <h2 class="doc-day-title"><span class="doc-day-no">Day ${dayNo(t, d)}</span> ${fmtDateCN(d)} <span class="doc-day-wk">周${weekdayCN(d)} · ${d}</span></h2>
      ${day.notes ? `<div class="doc-day-note">📝 ${esc(day.notes)}</div>` : ''}
      ${remRows ? `<table class="doc-table rem"><thead><tr><th>提醒时间</th><th>提醒内容</th></tr></thead><tbody>${remRows}</tbody></table>` : ''}
      ${segRows ? `<table class="doc-table"><thead><tr><th>时间</th><th>路线</th><th>交通</th><th>班次</th><th>乘客</th><th>座位</th><th>价格</th><th>备注</th></tr></thead><tbody>${segRows}</tbody></table>` : '<p class="doc-empty">当日暂无路线安排</p>'}
      ${lodge ? `<div class="doc-lodge">
        <div class="doc-lodge-main">${lodgeEmoji(lodgeType)} ${esc(lodgeType)} · <b>${esc(lodge.name)}</b>${lodge.location ? ' · ' + esc(lodge.location) : ''}<span class="doc-lodge-price">${num(lodge.pricePerNight) ? fmtMoney(lodge.pricePerNight) + '/晚' : '价格未填'}</span></div>
        ${lodge.notes ? `<div class="doc-lodge-note">💬 ${esc(lodge.notes)}</div>` : ''}
      </div>` : ''}
      ${expRows ? `<table class="doc-table exp"><thead><tr><th>类别</th><th>项目</th><th>金额</th></tr></thead><tbody>${expRows}</tbody></table>` : ''}
      <div class="doc-day-sum">
        <span>当日花费：<b>${fmtMoney(s.exp)}</b></span>
        <span>路线 ${s.segs} 段${totalMin ? ' · 总时长 ' + fmtDur(totalMin) : ''}</span>
        ${lodge ? `<span>住宿：${esc(lodge.name || lodge.location)}</span>` : '<span>无住宿</span>'}
        <span>出行人：${esc(travelers.join('、')) || '—'}</span>
      </div>
    </section>`;
  }).join('');

  const remain = st.budget - st.exp;
  // 旅行清单章节（与清单页数据同步：t.packing=[{category,name,importance,status}]，兼容旧 t.checklist）
  const pkItems = (Array.isArray(t.packing) && t.packing.length)
    ? t.packing.filter(p => (p.name || '').trim())
    : (Array.isArray(t.checklist) ? t.checklist.filter(c => c.text).map(c => ({ category: '其他', name: c.text, importance: '待定', status: c.done ? '已携带' : '未携带' })) : []);
  const clHtml = pkItems.length ? `<div class="doc-day"><h3 class="doc-day-title">🧳 旅行清单</h3>
      ${pkItems.map(p => `<div class="doc-cl-item"><span style="font-size:14px">${p.status === '已携带' ? '☑' : '☐'}</span><b style="flex:1">${esc(p.name)}</b><span style="font-size:12px;color:var(--sub)">${packCatIcon(p.category)} ${esc(p.category)} · ${p.importance}</span></div>`).join('')}
    </div>` : '';
  $('#doc-body').innerHTML = `
    <div class="doc-cover" style="background:${grad}">
      <div class="doc-emoji">${t.emoji || ''}</div>
      <h1>${esc(t.name)}</h1>
      <div class="doc-meta">🗓️ ${esc(t.startDate)} — ${esc(t.endDate)} · 共 ${Math.max(1, diffDays(t.startDate, t.endDate) + 1)} 天</div>
      <div class="doc-meta">👥 ${travelers.map(esc).join('、') || '一个人说走就走'}</div>
    </div>
    <div class="doc-toc">
      <h2>📑 目录</h2>
      ${tocHtml || '<p class="doc-empty">还没有每日行程</p>'}
    </div>
    ${clHtml}
    <div class="doc-days">${daysHtml}</div>
    <div class="doc-total">
      <span>行程总花费 <b>${fmtMoney(st.exp)}</b></span>
      ${st.budget ? `<span>预算 <b>${fmtMoney(st.budget)}</b> · 结余 <b>${fmtMoney(remain)}</b></span>` : ''}
      <span>行程天数 <b>${st.days} 天</b> · 路线 <b>${st.segs} 段</b> · 住宿 <b>${st.lodges} 晚</b></span>
    </div>`;
}

// 目录点击 → 滚动到对应日期章节（阻止默认锚点跳转污染 hash 路由）
$('#doc-body').addEventListener('click', e => {
  const item = e.target.closest('.toc-item');
  if (item) {
    e.preventDefault();
    const el = document.getElementById(item.dataset.href || item.getAttribute('href').slice(1));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

/* ================================================================
 * 提示 & 初始化
 * ================================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDoc(); } });

/* 双击页面顶部空白区域 → 平滑回到最上方（不响应按钮/链接/输入框） */
document.addEventListener('dblclick', e => {
  if (e.target.closest('button, a, input, select, textarea, label')) return;
  if (e.clientY < window.innerHeight * 0.25) window.scrollTo({ top: 0, behavior: 'smooth' });
});
loadData();
</script>
