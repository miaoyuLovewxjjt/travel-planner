        ${srcVal === 'custom' ? `<input class="src-custom" data-path="days.${d}.expenses.${i}.source.label" value="${esc(src ? src.label || '' : '')}" placeholder="自定义来源名称">` : ''}
        <input class="exp-note-input" data-path="days.${d}.expenses.${i}.note" value="${esc(e.note || '')}" placeholder="备注（如：和谁吃的、哪家店）">
        <button class="done-btn" data-action="exp-done" data-date="${d}" data-idx="${i}" title="确认保存">✓</button>
        <button class="done-btn gray" data-action="exp-cancel" data-date="${d}" data-idx="${i}" title="取消（删除）">✕</button>
      </div>`;
    }
    // —— 展示态：已确认，✏️ 编辑 / 🗑️ 删除 ——
    let srcTxt = '';
    if (e.source && e.source.type === 'seg') {
      const seg = (day.segments || [])[e.source.idx] || {};
      srcTxt = `${emojiOf(seg.transport)} ${(seg.from || '?') + '→' + (seg.to || '?')}`;
    } else if (e.source && e.source.type === 'lodge') {
      srcTxt = '🏨 ' + ((day.lodging && (day.lodging.name || day.lodging.location)) || '住宿');
    } else if (e.source && e.source.type === 'custom') {
      srcTxt = e.source.label || '自定义';
    }
    return `<div class="exp-view" draggable="true" data-date="${d}" data-idx="${i}" data-type="expenses" title="拖动排序">
      <span class="drag-handle">≡</span>
      <span class="exp-view-cat">${catEmoji(e.category)}${esc(e.category)}</span>
      <span class="exp-view-item">${esc(e.item || '—')}</span>
      ${srcTxt ? `<span class="exp-src-chip${e.source.type === 'custom' ? ' other' : ''}">源自 ${esc(srcTxt)}</span>` : ''}
      <span class="exp-view-amt">${fmtMoney(e.amount)}</span>
      ${e.note ? `<div class="exp-view-note">💬 ${esc(e.note)}</div>` : ''}
      <div class="exp-view-actions">
        <button class="icon-btn" data-action="exp-edit" data-date="${d}" data-idx="${i}" title="编辑">${pencilIcon()}</button>
        <button class="icon-btn" data-action="exp-del" data-date="${d}" data-idx="${i}" title="删除">${trashIcon()}</button>
      </div>
    </div>`;
  }).join('');

  const lodge = day.lodging || emptyDay().lodging;
  const hasLodge = !!(t.days[d] && t.days[d].lodging); // 仅真实数据中有住宿对象才显示（空白日显示添加按钮）
  const lodgeType = lodge.type && LODGE_TYPES.includes(lodge.type) ? lodge.type : '酒店';
  const lodgeDraft = hasLodge && t.days[d].lodging.draft;
  let lodgeHtml;
  if (!hasLodge) {
    // 无住宿 → 添加按钮
    lodgeHtml = `<div class="lodge-none">今日暂无住宿安排</div>
      <button class="add-row-btn" data-action="add-lodge" data-date="${d}">＋ 添加住宿</button>`;
  } else if (lodgeDraft) {
    // —— 编辑态：填写中，✓ 确认 / ✕ 取消 ——
    lodgeHtml = `
      <div class="lodge-grid">
        <div class="f"><label>类型</label>
          <select data-path="days.${d}.lodging.type">
            ${LODGE_TYPES.map(x => `<option ${lodgeType === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </div>
        <div class="f"><label>${lodgeType}名</label><input data-path="days.${d}.lodging.name" value="${esc(lodge.name)}" placeholder="如：西湖边青旅"></div>
        <div class="f"><label>位置</label><input data-path="days.${d}.lodging.location" value="${esc(lodge.location)}" placeholder="如：杭州西湖区"></div>
        <div class="f"><label>每晚价格（元）</label><input class="amount" type="number" min="0" data-num data-path="days.${d}.lodging.pricePerNight" value="${num(lodge.pricePerNight)}"></div>
        <div class="f" style="grid-column:1/-1"><label>备注</label><input data-path="days.${d}.lodging.notes" value="${esc(lodge.notes)}" placeholder="如：含早餐"></div>
      </div>
      <div class="lodge-actions" style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button class="done-btn" data-action="lodge-done" data-date="${d}" title="确认保存">✓</button>
        <button class="done-btn gray" data-action="lodge-cancel" data-date="${d}" title="取消（删除）">✕</button>
      </div>`;
  } else {
    // —— 展示态：已确认，✏️ 编辑 / 🗑️ 删除 ——
    const subParts = [];
    if (lodge.location) subParts.push('📍 ' + esc(lodge.location));
    if (lodge.notes) subParts.push('💬 ' + esc(lodge.notes));
    lodgeHtml = `
      <div class="lodge-view">
        <div class="lodge-view-main">
          <span class="lodge-view-type">${lodgeEmoji(lodgeType)}</span>
          <span class="lodge-view-name">${esc(lodge.name || '未命名住宿')}</span>
          ${num(lodge.pricePerNight) ? `<span class="lodge-view-price">¥${Math.round(num(lodge.pricePerNight)).toLocaleString('zh-CN')}/晚</span>` : ''}
          <div class="lodge-view-actions">
            <button class="icon-btn" data-action="lodge-edit" data-date="${d}" title="编辑">${pencilIcon()}</button>
            <button class="icon-btn" data-action="lodge-del" data-date="${d}" title="删除">${trashIcon()}</button>
          </div>
        </div>
        ${subParts.length ? `<div class="lodge-view-sub">${subParts.join('　')}</div>` : ''}
      </div>`;
  }

  const transSummary = [...new Set((day.segments || []).map(s => s.transport).filter(Boolean))]
    .map(x => `${emojiOf(x)} ${x}`).join(' · ') || '—';

  // 提醒列表（自动按时间排序，草稿行排最后；双态：编辑 ✓✕ / 展示 ✏️🗑）
  if (Array.isArray(day.reminders) && day.reminders.length > 1) {
    const drafts = day.reminders.filter(r => r.draft);
    const done = day.reminders.filter(r => !r.draft)
      .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.time || '').localeCompare(String(b.time || '')));
    day.reminders = [...done, ...drafts];
  }
  const remRows = (day.reminders || []).map((r, i) => {
    if (r.draft) {
      return `<div class="rem-row">
        <input type="date" data-path="days.${d}.reminders.${i}.date" value="${esc(r.date || '')}" title="提醒日期">
        <input type="time" data-path="days.${d}.reminders.${i}.time" value="${esc(r.time || '')}" title="提醒时间">
        <input class="rem-title" data-path="days.${d}.reminders.${i}.title" value="${esc(r.title || '')}" placeholder="提醒内容，如：9点抢票">
        <button class="done-btn" data-action="rem-done" data-date="${d}" data-idx="${i}" title="确认保存">✓</button>
        <button class="done-btn gray" data-action="rem-cancel" data-date="${d}" data-idx="${i}" title="取消（删除）">✕</button>
      </div>`;
    }
    return `<div class="rem-view">
      <span class="rem-dot"></span>
      <span class="rem-view-time">${fmtDateCN(r.date || '')} ${esc(r.time || '')}</span>
      <span class="rem-view-title">${esc(r.title || '未命名提醒')}</span>
      <div class="rem-view-actions">
        <button class="icon-btn" data-action="rem-edit" data-date="${d}" data-idx="${i}" title="编辑">${pencilIcon()}</button>
        <button class="icon-btn" data-action="rem-del" data-date="${d}" data-idx="${i}" title="删除">${trashIcon()}</button>
      </div>
    </div>`;
  }).join('');

  // 每日总览：路线分段条形图（时长按交通时间比例；颜色跟随主题色同色系渐变）
  // 跨天段自动拆分：本日显示当天部分（出发→24:00），次日自动追加"接昨日"续段（00:00→到达）
  const segsOfDay = day.segments || [];
  // 跨天接续：扫描前 7 天，取覆盖到今日的接续段（+2 天行程会在两个次日各显示一段）
  const tails = [];
  for (let back = 1; back <= 7; back++) {
    const pd = t.days[addDays(d, -back)];
    if (!pd) continue;
    nextDayTails(pd).forEach(tl => { if (tl.dayOffset === back) tails.push(tl); });
  }
  const segDurs = segsOfDay.map(dayPartDuration);
  const totalMin = segDurs.reduce((s, x) => s + x, 0) + tails.reduce((s, x) => s + x.dur, 0);
  const accentHex = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#FF6B6B';
  const barItems = [
    ...segsOfDay.map((seg, i) => ({
      dur: segDurs[i],
      color: segsOfDay.length === 1 ? accentHex : shade(accentHex, -22 + (i / (segsOfDay.length - 1)) * 44),
      label: `${emojiOf(seg.transport)}${segDurs[i] ? ' ' + fmtDur(segDurs[i]) : ''}`,
      title: `${esc(seg.from || '?')} → ${esc(seg.to || '?')}${segDurs[i] ? ' · ' + fmtDur(segDurs[i]) : ''}${isCrossDay(seg) ? ' · 次日到达' : ''}`,
    })),
    ...tails.map(t => ({
      dur: t.dur,
      color: accentHex,
      label: `↪${emojiOf(t.transport)} ${t.arrive}`,
      title: `接昨日 ${esc(t.from)} → ${esc(t.to)} · ${fmtDur(t.dur)}`,
    })),
  ];
  const segBarHtml = barItems.length ? barItems.map(b =>
    `<div class="rb-seg" style="flex:${b.dur || 1};background:${b.color}" title="${b.title}">
      <span class="rb-txt">${b.label}</span></div>`).join('')
    : '<div class="rb-seg" style="flex:1;background:#e8e8ef;color:var(--sub);min-width:auto">暂无路线</div>';

  return `<section class="day-card" id="day-${d}">
    <div class="day-head">
      <div class="day-badge"><span class="n">${Number(d.slice(8,10))}</span><span class="w">${Number(d.slice(5,7))}月</span></div>
      <div class="day-info">
        <h3>${no === '—' ? '额外行程' : '第' + no + '天'} · ${fmtDateCN(d)} 星期${weekdayCN(d)}</h3>
        <div class="day-sub">${st.segs ? st.segs + '段路线 · ' + transSummary : '今日暂无路线'}</div>
      </div>
      <div class="day-cost">
        <div class="amt">${fmtMoney(st.exp)}</div>
        <div class="lbl">今日花费</div>
      </div>      <button class="icon-btn del-day" data-date="${d}" title="删除当日行程">${trashIcon()}</button>
    </div>
    <div class="day-grid">
      <div class="block notes-box col-left">
        <div class="block-title"><span class="tag">📝</span>备注</div>
        <textarea data-path="days.${d}.notes" placeholder="今日行程备注、提醒、注意事项…">${esc(day.notes || '')}</textarea>
      </div>
      <div class="block col-right">
        <div class="block-title"><span class="tag">⏰</span>提醒</div>
        <div class="rem-list">${remRows || '<div class="lodge-none">暂无提醒，可设置抢票、出发等定时提醒</div>'}</div>
        <button class="add-row-btn" data-action="add-rem" data-date="${d}">＋ 添加提醒</button>
      </div>
      <div class="block full">
        <div class="block-title"><span class="tag">🗺️</span>行程路线</div>
        <div class="seg-list">${segRows || '<div class="lodge-none">还没有路线，点击下方添加</div>'}</div>
        <button class="add-row-btn" data-action="add-seg" data-date="${d}">＋ 添加路线</button>
      </div>
      <div class="day-col col-l">
        <div class="block lodge-block">
          <div class="block-title"><span class="tag">🏨</span>住宿</div>
          ${lodgeHtml}
        </div>
        <div class="block">
          <div class="block-title"><span class="tag">📊</span>行程总览</div>
          <div class="overview-grid">
            <div class="ov-item"><span class="num">${st.lodge ? lodgeEmoji(lodgeType) + ' ' + esc(st.lodge.name || st.lodge.location) : '—'}</span><span class="lbl">${st.lodge ? esc(lodgeType) + ' · ' + esc(st.lodge.location || '') + ' · ' + (num(st.lodge.pricePerNight) ? fmtMoney(st.lodge.pricePerNight) + '/晚' : '价格未填') : '今日无住宿'}</span></div>
            <div class="ov-item"><span class="num">${travelers.length ? esc(travelers.join('、')) : '—'}</span><span class="lbl">出行人</span></div>
            <div class="ov-route">
              <div class="lbl">🗺️ 今日路线 · 共 ${st.segs} 段${totalMin ? ' · 总时长 ' + fmtDur(totalMin) : ''}</div>
              <div class="route-bar">${segBarHtml}</div>
            </div>
          </div>
        </div>
      </div>
      <div class="day-col col-r">
        <div class="block">
          <div class="block-title"><span class="tag">🧾</span>记账</div>
          <div class="block-hint">💡 记录购物、吃饭、门票等日常消费，自动计入今日花费</div>
          <div class="exp-list">${expRows || '<div class="lodge-none">还没有花销记录</div>'}</div>
          <button class="add-row-btn" data-action="add-exp" data-date="${d}">＋ 添加花销</button>
          <div class="exp-total"><span class="t">当日合计</span><span class="amt">${fmtMoney(st.exp)}</span></div>
          <div class="exp-donut">
            <div class="lbl">💰 消费构成（点击类别查看明细）</div>
            ${donutChart(st.expByCat) || '<div class="lodge-none" style="margin:4px 0 0">今日暂无消费</div>'}
            <div class="donut-detail" id="donut-detail-${d}" hidden></div>
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

/* ================================================================
 * 事件：详情页（委托）
 * ================================================================ */
$('#view-detail').addEventListener('click', async e => {
  const t = currentTripId ? getTrip(currentTripId) : null;
  if (!t) return;

  // 日期导航跳转
  const navBtn = e.target.closest('.day-nav button');
  if (navBtn) {
    const d = navBtn.dataset.date;
    if (t.days[d]) jumpToDay(d);
    else { ensureDay(t, d); renderDetail(t.id); jumpToDay(d); }
    return;
  }
  // 跳转并高亮
  function jumpToDay(d) {
    const el = document.getElementById('day-' + d);
    if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); flashDay(el); }
  }

  const addSeg = e.target.closest('[data-action="add-seg"]');
  if (addSeg) {
    const d = addSeg.dataset.date;
    ensureDay(t, d);
    t.days[d].segments.push({ from: '', to: '', time: '', transport: '地铁', notes: '', draft: true });
    saveAndRender(t);
    return;
  }
  const addExp = e.target.closest('[data-action="add-exp"]');
  if (addExp) {
    const d = addExp.dataset.date;
    ensureDay(t, d);
    t.days[d].expenses.push({ category: '餐饮', item: '', amount: 0, when: '', draft: true });
    saveAndRender(t);
    return;
  }
  // 添加住宿（空状态按钮）
  const addLodge = e.target.closest('[data-action="add-lodge"]');
  if (addLodge) {
    const d = addLodge.dataset.date;
    ensureDay(t, d);
    t.days[d].lodging = { type: '酒店', name: '', location: '', pricePerNight: 0, notes: '', draft: true };
    saveAndRender(t);
    return;
  }
  // 住宿：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除
  const lodgeAction = e.target.closest('[data-action^="lodge-"]');
  if (lodgeAction) {
    const d = lodgeAction.dataset.date;
    const lg = t.days[d] ? t.days[d].lodging : null;
    if (!lg) return;
    const act = lodgeAction.dataset.action;
    if (act === 'lodge-done') {
      const empty = !(lg.name || '').trim() && !(lg.location || '').trim() && !num(lg.pricePerNight);
      if (empty) delete t.days[d].lodging;   // 空住宿确认 → 删除
      else delete lg.draft;                  // 确认保存 → 展示态
    } else if (act === 'lodge-cancel') delete t.days[d].lodging;
    else if (act === 'lodge-edit') lg.draft = true;
    else if (act === 'lodge-del') delete t.days[d].lodging; // 直接删除，不确认
    saveAndRender(t);
    return;
  }
  /* 环形图图例点击 → 展开该类别明细 */
  const leg = e.target.closest('.donut-legend span[data-cat]');
  if (leg) {
    const card = leg.closest('.day-card');
    const d = card ? card.id.slice(4) : null;
    if (d && t.days[d]) {
      const box = card.querySelector('.donut-detail');
      if (box) {
        if (!box.hidden && box.dataset.cat === leg.dataset.cat) { box.hidden = true; return; }
        const rows = catDetails(t.days[d], leg.dataset.cat);
        box.innerHTML = rows.length
          ? rows.map(r => `<div class="dd-row"><span>${esc(r.label)}</span><b>${fmtMoney(r.amt)}</b></div>`).join('')
          : '<div class="dd-row"><span style="color:var(--sub)">无明细</span></div>';
        box.dataset.cat = leg.dataset.cat;
        box.hidden = false;
      }
    }
    return;
  }

  const toggleSeg = e.target.closest('[data-action="toggle-seg"]');
  if (toggleSeg) {
    const wrap = toggleSeg.closest('.seg-wrap');
    if (wrap) {
      const detail = wrap.querySelector('.seg-detail');
      if (detail) {
        detail.classList.toggle('open');
        toggleSeg.classList.toggle('open');
      }
    }
    return;
  }

  const pickPax = e.target.closest('[data-action="pick-pax"]');
  if (pickPax) {
    openPaxPanel(t, pickPax.dataset.date, Number(pickPax.dataset.idx));
    return;
  }

  // 提醒：＋ 添加 / ✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除
  const remAction = e.target.closest('[data-action="add-rem"], [data-action^="rem-"]');
  if (remAction) {
    const d = remAction.dataset.date, i = Number(remAction.dataset.idx);
    const rems = t.days[d] ? t.days[d].reminders : null;
    const act = remAction.dataset.action;
    if (act === 'add-rem') {
      ensureDay(t, d);
      if (!Array.isArray(t.days[d].reminders)) t.days[d].reminders = [];
      t.days[d].reminders.push({ id: uid(), title: '', date: d, time: '', draft: true });
    } else if (rems && rems[i]) {
      if (act === 'rem-done') {
        const r = rems[i];
        if (!(r.title || '').trim() || !(r.date || '').trim()) rems.splice(i, 1);
        else if (await canRemind()) { delete r.draft; delete r.reminded; }
        else { rems.splice(i, 1); showToast('⚠️ 未授权通知权限，提醒已取消'); }
      } else if (act === 'rem-cancel') rems.splice(i, 1);
      else if (act === 'rem-edit') { rems[i].draft = true; delete rems[i].reminded; }
      else if (act === 'rem-del') rems.splice(i, 1);
    }
    saveAndRender(t);
    syncReminders(t);
    return;
  }

  /* —— 路线：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除 —— */
  const segAction = e.target.closest('[data-action^="seg-"]');
  if (segAction) {
    const d = segAction.dataset.date, i = Number(segAction.dataset.idx);
    const segs = t.days[d] ? t.days[d].segments : null;
    if (!segs || !segs[i]) return;
    const act = segAction.dataset.action;
    if (act === 'seg-done') {
      const s = segs[i];
      const empty = !(s.from || '').trim() && !(s.to || '').trim() && !(s.time || '').trim() &&
        !(s.notes || '').trim() && !(s.vehicleNo || '').trim() && !(s.seat || '').trim() && !(s.passengers || []).length && !num(s.price);
      if (empty) segs.splice(i, 1);   // 空记录确认 → 直接删除
      else delete s.draft;            // 确认保存 → 展示态
    } else if (act === 'seg-cancel') segs.splice(i, 1);
    else if (act === 'seg-edit') segs[i].draft = true;
    else if (act === 'seg-del') segs.splice(i, 1);   // 单条记录直接删除，不弹窗
    saveAndRender(t);
    return;
  }

  /* —— 花销：✓ 确认 / ✕ 取消 / ✏️ 编辑 / 🗑️ 删除 —— */
  const expAction = e.target.closest('[data-action^="exp-"]');
  if (expAction) {
    const d = expAction.dataset.date, i = Number(expAction.dataset.idx);
    const exps = t.days[d] ? t.days[d].expenses : null;
    if (!exps || !exps[i]) return;
    const act = expAction.dataset.action;
    if (act === 'exp-done') {
      const x = exps[i];
      const empty = !(x.item || '').trim() && !num(x.amount) && !(x.when || '').trim() && !x.source && !(x.note || '').trim();
      if (empty) exps.splice(i, 1);   // 空记录确认 → 直接删除
      else delete x.draft;            // 确认保存 → 展示态
    } else if (act === 'exp-cancel') exps.splice(i, 1);
    else if (act === 'exp-edit') exps[i].draft = true;
    else if (act === 'exp-del') exps.splice(i, 1);   // 单条记录直接删除，不弹窗
    saveAndRender(t);
    return;
  }

  const delDay = e.target.closest('.del-day');
  if (delDay) {
    if (confirm('删除 ' + delDay.dataset.date + ' 当天的全部行程？')) {
      delete t.days[delDay.dataset.date];
      saveAndRender(t);
    }
    return;
  }
});

/** 按 path 删除数据（days.2026-08-15.segments.0） */
function delByPath(t, path) {
  const parts = path.split('.');
  let cur = t;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  const key = parts[parts.length - 1];
  if (Array.isArray(cur)) cur.splice(Number(key), 1);
  else delete cur[key];
}

/** 编辑字段（委托：input / change） */
$('#view-detail').addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.path) {
    const t = getTrip(currentTripId);
    if (!t) return;
    setByPath(t, el.dataset.path, el.dataset.num ? num(el.value) : el.value);
    // 出发/到达时间变化 → 同步组合 time 字段；跨天自动 +1（结束<开始时），改回当天自动清除
    const parts = el.dataset.path.split('.');
    if (parts[2] === 'segments' && (parts[4] === 'departTime' || parts[4] === 'arriveTime')) {
      const seg = t.days[parts[1]].segments[Number(parts[3])];
      if (seg) {
        if (seg.departTime && seg.arriveTime) {
          if (seg.arriveTime < seg.departTime) {
            // 跨天：未设置时自动 +1；显式值（含用户选的 0）保持
            if (seg.crossDays === undefined || seg.crossDays === '') seg.crossDays = 1;
          } else if (seg.crossDays === undefined || seg.crossDays === '' || Number(seg.crossDays) === 1) {
            // 结束 ≥ 开始：清除自动的 +1（显式 +2/+3 保持）
            delete seg.crossDays;
          }
          seg.time = [seg.departTime, seg.arriveTime].filter(Boolean).join('-');
        }
        // 同步更新跨天下拉选中值（如自动 +1 后）
        const cdSel = document.querySelector(`select[data-path="days.${parts[1]}.segments.${parts[3]}.crossDays"]`);
        if (cdSel) cdSel.value = String(crossDays(seg));
      }
    }
    scheduleSave();
    updateTotalsUI(t, el.dataset.path); // 金额变化时局部刷新合计，不重渲染、不打断输入
  }
});

/** 编辑金额后局部更新当日合计 / 头部花费 / 总览 / 统计条 / 日期导航 */
function updateTotalsUI(t, path) {
  const parts = path.split('.');
  const isExpense = parts[2] === 'expenses';
  const isLodgePrice = parts[2] === 'lodging' && parts[3] === 'pricePerNight';
  const isSegPrice = parts[2] === 'segments' && parts[4] === 'price';
  if (!(isExpense || isLodgePrice || isSegPrice)) return;
  const d = parts[1];
  const day = t.days[d];
  if (!day) return;
  const s = dayStats(day);
  const fmt = fmtMoney(s.exp);
  const q = sel => { const el = document.querySelector(sel); if (el) el.textContent = fmt; };
  q(`#day-${d} .exp-total .amt`);                 // 记账合计
  q(`#day-${d} .day-cost .amt`);                  // 卡片头部今日花费
  // 总览住宿（lodging 编辑时，住宿是总览第 1 项）
  if (parts[2] === 'lodging') {
    const lodge = day.lodging || emptyDay().lodging;
    const ovLodge = document.querySelector(`#day-${d} .overview-grid .ov-item:nth-child(1)`);
    if (ovLodge) {
      const numEl = ovLodge.querySelector('.num'), lblEl = ovLodge.querySelector('.lbl');
      if (numEl) numEl.textContent = lodge.name ? esc(lodge.name) : '—';
      if (lblEl) lblEl.textContent = (lodge.name || lodge.location) ?
        `${esc(lodge.location || '')} · ${num(lodge.pricePerNight) ? fmtMoney(lodge.pricePerNight) + '/晚' : '价格未填'}` : '今日无住宿';
    }
  }
  // 顶部统计条：总花费 / 预算结余（长框内 data-key 定位）
  const st = tripStats(t);
  const statExp = document.querySelector('#stat-strip .stat-long [data-key="exp"] .num');
  if (statExp) statExp.textContent = fmtMoney(st.exp);
  // 预算结余
  const remain = st.budget - st.exp;
  const statRemain = document.querySelector('#stat-strip .stat-long [data-key="remain"] .num');
  if (statRemain) { statRemain.textContent = st.budget ? fmtMoney(remain) : '—'; statRemain.style.color = budgetColor(remain); }
  // 日期导航按钮金额
  const navInfo = document.querySelector(`#day-nav button[data-date="${d}"] .info`);
  if (navInfo) navInfo.textContent = fmt;
}
$('#view-detail').addEventListener('change', e => {
  const el = e.target;
  const t = getTrip(currentTripId);
  if (!t) return;
  // 花销来源选择（特殊映射，不走 setByPath）
  if (el.dataset.action === 'exp-src') {
    const day = t.days[el.dataset.date];
    if (!day) return;
    const exp = day.expenses[Number(el.dataset.idx)];
    if (!exp) return;
    const v = el.value;
    if (!v) exp.source = null;
    else if (v.startsWith('seg-')) exp.source = { type: 'seg', idx: Number(v.slice(4)) };
    else if (v === 'lodge') exp.source = { type: 'lodge' };
    else exp.source = { type: 'custom', label: '' };
    saveAndRender(t);
    return;
  }
  if (el.dataset.path) {
    setByPath(t, el.dataset.path, el.value);
    scheduleSave();
    // 交通方式切换 / 住宿类型变化 → 重渲染以显示/隐藏对应 UI
    if (el.classList.contains('seg-trans') || el.dataset.path.endsWith('.lodging.type')) {
      renderDetail(t.id);
    }
  }
});

/** 交通乘客选择面板：与出行人挂钩 + 每人独立座位号 */
function openPaxPanel(t, date, idx) {
  const day = t.days[date];
  if (!day || !day.segments[idx]) return;
  const seg = day.segments[idx];
  const sel = new Map(normPax(seg).map(p => [p.name, p.seat || '']));
  const all = tripTravelers(t);
  $('#modal-box').innerHTML = `
    <div class="pax-panel">
      <h2>👥 乘客与座位（${esc(seg.transport || '')} ${esc((seg.from || '?') + '→' + (seg.to || '?'))}）</h2>
      <div class="pax-list" id="pax-list">
        ${all.length ? all.map(n =>
          `<span class="pax-opt ${sel.has(n) ? 'sel' : ''}" data-n="${esc(n)}">${esc(n)}</span>`).join('')
          : '<span class="lodge-none">大行程还没有出行人，可以直接在下方输入乘客名字</span>'}
      </div>
      <div class="pax-custom">
        <input id="pax-custom-name" placeholder="输入其他乘客姓名">
        <button class="btn btn-ghost" id="pax-add-custom">＋ 添加</button>
      </div>
      <div class="pax-seats" id="pax-seats"></div>
      <div class="pax-hint">💡 点击名字选中/取消；每个乘客可单独填写座位号（如 3车5D）。</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="pax-cancel">取消</button>
        <button class="btn btn-primary" id="pax-ok">确定</button>
      </div>
    </div>`;
  $('#modal-root').classList.remove('hidden');

  const seatsBox = $('#pax-seats');
  function renderSeats() {
    seatsBox.innerHTML = [...sel.entries()].map(([name, seat]) => `
      <div class="pax-seat-row">
        <span class="pax-seat-name">👤 ${esc(name)}</span>
        <input class="pax-seat-input" data-name="${esc(name)}" value="${esc(seat)}" placeholder="座位号，如 3车5D">
        <button class="done-btn gray" data-rm="${esc(name)}" title="移除">✕</button>
      </div>`).join('') || '<span class="lodge-none">尚未选择乘客</span>';
  }
  renderSeats();

  $('#pax-list').addEventListener('click', e => {
    const opt = e.target.closest('.pax-opt');
    if (opt) {
      opt.classList.toggle('sel');
      if (opt.classList.contains('sel')) sel.set(opt.dataset.n, '');
      else sel.delete(opt.dataset.n);
      renderSeats();
    }
  });
  $('#pax-add-custom').addEventListener('click', () => {
    const v = $('#pax-custom-name').value.trim();
    if (!v) return;
    if (!sel.has(v)) {
      const dup = [...document.querySelectorAll('.pax-opt')].some(el => el.dataset.n === v);
      if (!dup) {
        const s = document.createElement('span');
        s.className = 'pax-opt sel';
        s.dataset.n = v;
        s.textContent = v;
        $('#pax-list').appendChild(s);
      }
      sel.set(v, '');
    }
    $('#pax-custom-name').value = '';
    renderSeats();
  });
  // 座位号输入实时同步
  seatsBox.addEventListener('input', e => {
    const inp = e.target.closest('.pax-seat-input');
    if (inp) sel.set(inp.dataset.name, inp.value);
  });
  seatsBox.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      sel.delete(rm.dataset.rm);
      const opt = [...document.querySelectorAll('.pax-opt')].find(el => el.dataset.n === rm.dataset.rm);
      if (opt) opt.classList.remove('sel');
      renderSeats();
    }
  });
  $('#pax-cancel').addEventListener('click', closeModal);
  $('#pax-ok').addEventListener('click', () => {
    seg.passengers = [...sel.entries()].map(([name, seat]) => ({ name, seat }));
    delete seg.seat; // 座位已归属到各乘客
    closeModal();
    saveAndRender(t);
  });
}

function setByPath(t, path, v) {
  const parts = path.split('.');
  let cur = t;
  for (let i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  cur[parts[parts.length - 1]] = v;
}

function ensureDay(t, d) { if (!t.days[d]) t.days[d] = emptyDay(); }
function saveAndRender(t) { scheduleSave(); renderDetail(t.id); }
function flashDay(el) {
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

    showToast(trip ? '已保存修改' : '大行程已创建，开始添加每日行程吧');
  });
}

/* ============ 拖拽排序（路线 / 花销） ============ */
let dragState = null;
function dragRowFrom(e) {
  return e.target.closest('.seg-view, .exp-view');
}
$('#days-col').addEventListener('dragstart', e => {
  const row = dragRowFrom(e);
  if (!row) return;
  dragState = { date: row.dataset.date, type: row.dataset.type, idx: Number(row.dataset.idx) };
  row.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', 'drag'); } catch (_) { /* 某些浏览器要求 setData */ }
});
$('#days-col').addEventListener('dragover', e => {
  if (!dragState) return;
  const row = dragRowFrom(e);
  if (!row) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // 根据鼠标在目标行的上半/下半决定插入位置，并高亮插入指示线
  const rect = row.getBoundingClientRect();
  const after = e.clientY > rect.top + rect.height / 2;
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('drag-over', 'drag-over-after'));
  row.classList.add(after ? 'drag-over-after' : 'drag-over');
});
$('#days-col').addEventListener('drop', e => {
  e.preventDefault();
  if (!dragState) return;
  const row = dragRowFrom(e);
  if (!row) return;
  const t = getTrip(currentTripId);
  if (t) {
    const list = t.days[dragState.date] ? t.days[dragState.date][dragState.type] : null;
    if (list && row.dataset.date === dragState.date && row.dataset.type === dragState.type) {
      const from = dragState.idx;
      const rect = row.getBoundingClientRect();
      let to = Number(row.dataset.idx) + (e.clientY > rect.top + rect.height / 2 ? 1 : 0);
      if (from !== to && to !== from + 1) {
        const [item] = list.splice(from, 1);
        list.splice(from < to ? to - 1 : to, 0, item);
        saveAndRender(t);
      }
    }
  }
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
  dragState = null;
});
$('#days-col').addEventListener('dragend', () => {
  document.querySelectorAll('.seg-view, .exp-view').forEach(el => el.classList.remove('dragging', 'drag-over', 'drag-over-after'));
  dragState = null;
});

/** 本地图片压缩：最大边 900px、JPEG 0.82，转 dataURL 节省存储 */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('read fail')); };
    img.src = url;
  });
}

/* —— 预览地图（复古手账风：图钉足迹 + 手绘折线 + 交通徽标 + 点击跳转/开关） —— */
let postMapLocked = false;
let postMapTransOn = true;
let postTransMarks = [];
const PIN_SVG = `<svg viewBox="0 0 24 24" width="28" height="28">
  <path d="M12 1C7.6 1 4 4.6 4 9c0 5 8 14 8 14s8-9 8-14c0-4.4-3.6-8-8-8z" fill="#C0392B" stroke="#7B241C" stroke-width="1.4"/>
  <circle cx="12" cy="9" r="3.2" fill="#FDF6E3" stroke="#7B241C" stroke-width="1"/></svg>`;

function pinIcon(p) {
  const no = p.no === '—' ? '·' : p.no;
  const tag = `<div class="pin-tag"><b>Day ${no}</b> ${esc(p.name)}</div>`;
  return L.divIcon({ className: '', html: `<div class="pin-icon">${PIN_SVG}${tag}</div>`, iconSize: [0, 0], iconAnchor: [14, 28] });
}
function transIcon(emoji) {
  return L.divIcon({ className: '', html: `<div class="trans-badge">${emoji}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
}

function renderPostMap(points, color) {
  if (postMap) { postMap.remove(); postMap = null; }
  const box = $('#post-map');
  postMap = L.map(box, { zoomControl: true, attributionControl: false, scrollWheelZoom: true, touchZoom: true });
  baseTileLayer().addTo(postMap);
  postTransMarks = [];

  if (!points.length) {
    L.marker([35.5, 105]).addTo(postMap);
    postMap.setView([35.5, 105], 4);
    return;
  }
  // 图钉足迹：每个首末点一颗复古图钉，标签显示 Day + 地点名
  const mk = points.map(p => L.marker([p.lat, p.lng], { icon: pinIcon(p), zIndexOffset: 500 })
    .addTo(postMap)
    .bindTooltip(`${p.name} · ${p.date}`, { direction: 'top' }));
  mk.forEach((m, i) => m.on('click', () => { if (!postMapLocked) jumpToPostDay(points[i].date); }));
  // 手绘折线分段：每段独立可点击跳转 + 中点交通徽标
  if (points.length > 1) {
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      if (a.lat === b.lat && a.lng === b.lng) continue;
      const seg = L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
        color: '#8a5a2b', weight: 3, opacity: .9, dashArray: '2 7', lineCap: 'round', lineJoin: 'round'
      }).addTo(postMap);
      const d = a.date > b.date ? b.date : a.date; // 跳转两端的早一天（当天行程）
      seg.bindTooltip(`${a.name} → ${b.name}`, { direction: 'top' });
      seg.on('click', () => { if (!postMapLocked) jumpToPostDay(d); });
      // 该段交通徽标（取起点日期当天的交通方式）
      const transEmo = postTransEmojis(a.date);
      if (transEmo) {
        const mTrans = L.marker([(a.lat + b.lat) / 2, (a.lng + b.lng) / 2], {
          icon: transIcon(transEmo), interactive: false, keyboard: false, zIndexOffset: 800
        }).addTo(postMap);
        postTransMarks.push(mTrans);
      }
    }
  }
  // 交通开关状态同步
  const transBtn = $('#map-trans-toggle');
  if (transBtn && !postMapTransOn) postTransMarks.forEach(m => m.setOpacity(0));
  const bounds = L.latLngBounds(points.map(p => [p.lat, p.lng]));
  postMap.fitBounds(bounds.pad(0.35), { maxZoom: 11 });
}
/** 某天所有交通方式的 emoji（去重，用于折线徽标） */
function postTransEmojis(date) {
  const day = postTrip && postTrip.days[date];
  if (!day) return '';
  return [...new Set((day.segments || []).map(x => x.transport).filter(Boolean))].map(x => emojiOf(x)).join('');
}

function initPostMap(points, color) {
  const box = $('#post-map');
  if (!box) return;
  // 开关：点击跳转（仅预览模式）
  const toggle = $('#map-toggle');
  postMapLocked = false;
  if (toggle) {
    toggle.textContent = '🔓 点击跳转';
    toggle.classList.remove('lock');
    toggle.onclick = () => {
      postMapLocked = !postMapLocked;
      toggle.textContent = postMapLocked ? '🔒 仅预览' : '🔓 点击跳转';
      toggle.classList.toggle('lock', postMapLocked);
    };
  }
  // 开关：显示/隐藏交通徽标
  const transBtn = $('#map-trans-toggle');
  postMapTransOn = true;
  if (transBtn) {
    transBtn.textContent = '🚇 显示交通';
    transBtn.classList.remove('lock');
    transBtn.onclick = () => {
      postMapTransOn = !postMapTransOn;
      transBtn.textContent = postMapTransOn ? '🚇 显示交通' : '🚫 隐藏交通';
      transBtn.classList.toggle('lock', !postMapTransOn);
      postTransMarks.forEach(m => m.setOpacity(postMapTransOn ? 1 : 0));
    };
  }
  // 自动端点（无坐标）：异步地理编码
  if (points.length && points[0].lat === undefined) {
    const status = $('#map-geo-status');
    const names = [...new Set(points.map(p => p.name))];
    const geoMap = {};
    let done = 0;
    const step = async () => {
      while (true) {
        const i = names.findIndex(n => !(n in geoMap));
        if (i < 0) return;
        const n = names[i];
        geoMap[n] = null; // 先占位，避免并发 step 重复请求同一地点
        geoMap[n] = await geocodePlace(n);
        done++;
        if (status) status.textContent = `🗺️ 正在定位地点 ${done}/${names.length}…`;
      }
    };
    // 并发 3 个请求 + 停顿，兼顾速度与 Nominatim 限流
    Promise.all([step(), step(), step()]).then(() => {
      const located = points.filter(p => geoMap[p.name]).map(p => ({ ...p, ...geoMap[p.name] }));
      if (status) status.remove();
      if (!located.length) {
        box.insertAdjacentHTML('beforeend', `<div class="map-fallback">⚠️ 未能定位地点，请检查网络或补充更详细的地名</div>`);
        return;
      }
      renderPostMap(located, color);
    });
    return;
  }
  // 手动 pin（已有坐标）
  if (!isMapReady()) {
    box.insertAdjacentHTML('beforeend', '<div class="map-fallback">🗺️ 地图加载中…</div>');
    let n = 0;
    const wait = setInterval(() => {
      n++;
      if (isMapReady()) { clearInterval(wait); box.querySelector('.map-fallback')?.remove(); renderPostMap(points, color); }
      else if (n > 40 || window.__mapFail) {
        clearInterval(wait);
        const fb = box.querySelector('.map-fallback');
        if (fb) fb.textContent = '🌐 地图加载失败（请检查网络）';
      }
    }, 250);
    return;
  }
  renderPostMap(points, color);
}

/* —— 导出（手账 PNG 绑定已迁移到 #view-journal 委托：downloadJournalPNG） —— */

/* ================================================================
 * PDF 文档视图（带目录，目录标题为日期）
 * ================================================================ */
$('#btn-pdf').addEventListener('click', () => { const t = getTrip(currentTripId); if (t) openDoc(t); });
$('#btn-close-doc').addEventListener('click', closeDoc);
$('#btn-doc-print').addEventListener('click', () => window.print());

function openDoc(t) { $('#doc').classList.remove('hidden'); buildDoc(t); }
function closeDoc() { $('#doc').classList.add('hidden'); }

function buildDoc(t) {
  const st = tripStats(t);
  const dates = st.dates;
  const travelers = tripTravelers(t);
  const grad = `linear-gradient(135deg,${t.color},${shade(t.color, -35)})`;

  const tocHtml = dates.map(d => {
    const s = dayStats(t.days[d]);
    return `<a class="toc-item" href="#doc-day-${d}">
      <span class="toc-no">Day ${dayNo(t, d)}</span>
      <span class="toc-date">${fmtDateCN(d)} · 周${weekdayCN(d)}</span>
      <span class="toc-dots"></span>
      <span class="toc-sum">${fmtMoney(s.exp)} · ${s.segs} 段</span>
    </a>`;
  }).join('');

  const daysHtml = dates.map(d => {
    const day = t.days[d];
    const s = dayStats(day);
    const lodge = s.lodge;
    const lodgeType = lodge && lodge.type && LODGE_TYPES.includes(lodge.type) ? lodge.type : '酒店';

    const segRows = (day.segments || []).map(seg => {
      const det = [];
      if (seg.vehicleNo) det.push('班次 ' + esc(seg.vehicleNo));
      const paxTxt = paxText(seg);
      if (paxTxt) det.push('乘客 ' + esc(paxTxt));
      else if (seg.seat) det.push('座位 ' + esc(seg.seat));
      if (num(seg.price)) det.push('💴 ' + fmtMoney(seg.price));
      return `<tr>
        <td class="d-time">${esc(timeRange(seg))}</td>
        <td class="d-path">${esc(seg.from || '?')} → ${esc(seg.to || '?')}</td>
        <td class="d-trans">${emojiOf(seg.transport)} ${esc(seg.transport || '')}</td>
        <td class="d-det">${det.join(' · ') || '—'}</td>
        <td class="d-note">${esc(seg.notes || '')}</td>
      </tr>`;
    }).join('');

    const expRows = (day.expenses || []).map(e => {
      let srcTxt = '';
      if (e.source && e.source.type === 'seg') {
        const seg = (day.segments || [])[e.source.idx] || {};
        srcTxt = '源自 ' + (seg.from || '?') + '→' + (seg.to || '?');
      } else if (e.source && e.source.type === 'lodge') srcTxt = '源自住宿';
      else if (e.source && e.source.type === 'custom') srcTxt = e.source.label || '自定义';
      return `<tr>
        <td>${catEmoji(e.category)} ${esc(e.category)}</td>
        <td>${esc(e.item || '—')}</td>
        <td style="color:var(--sub);font-size:11.5px">${srcTxt ? esc(srcTxt) : '—'}</td>
        <td class="d-amt">${fmtMoney(e.amount)}</td>
      </tr>`;
    }).join('');

    return `<section class="doc-day" id="doc-day-${d}">
      <h2 class="doc-day-title"><span class="doc-day-no">Day ${dayNo(t, d)}</span> ${fmtDateCN(d)} <span class="doc-day-wk">周${weekdayCN(d)} · ${d}</span></h2>
      ${segRows ? `<table class="doc-table"><thead><tr><th>时间</th><th>路线</th><th>交通</th><th>班次 / 座位 / 乘客</th><th>备注</th></tr></thead><tbody>${segRows}</tbody></table>` : '<p class="doc-empty">当日暂无路线安排</p>'}
      ${lodge ? `<div class="doc-lodge">${lodgeEmoji(lodgeType)} ${esc(lodgeType)} · <b>${esc(lodge.name)}</b>${lodge.location ? ' · ' + esc(lodge.location) : ''}<span class="doc-lodge-price">${num(lodge.pricePerNight) ? fmtMoney(lodge.pricePerNight) + '/晚' : '价格未填'}</span></div>` : ''}
      ${expRows ? `<table class="doc-table exp"><thead><tr><th>类别</th><th>项目</th><th>来源</th><th>金额</th></tr></thead><tbody>${expRows}</tbody></table>` : ''}
      <div class="doc-day-sum">
        <span>当日花费：<b>${fmtMoney(s.exp)}</b></span>
        <span>路线 ${s.segs} 段</span>
        ${lodge ? `<span>住宿：${esc(lodge.name || lodge.location)}</span>` : '<span>无住宿</span>'}
        ${day.notes ? `<span class="doc-note">📝 ${esc(day.notes)}</span>` : ''}
      </div>
    </section>`;
  }).join('');

  const remain = st.budget - st.exp;
  $('#doc-body').innerHTML = `
    <div class="doc-cover" style="background:${grad}">
      <div class="doc-emoji">${t.emoji || '🧳'}</div>
      <h1>${esc(t.name)}</h1>
      <div class="doc-meta">🗓️ ${esc(t.startDate)} — ${esc(t.endDate)} · 共 ${Math.max(1, diffDays(t.startDate, t.endDate) + 1)} 天</div>
      <div class="doc-meta">👥 ${travelers.map(esc).join('、') || '一个人说走就走'}</div>
    </div>
    <div class="doc-toc">
      <h2>📑 目录</h2>
      ${tocHtml || '<p class="doc-empty">还没有每日行程</p>'}
    </div>
    <div class="doc-days">${daysHtml}</div>
    <div class="doc-total">
      <span>行程总花费 <b>${fmtMoney(st.exp)}</b></span>
      ${st.budget ? `<span>预算 <b>${fmtMoney(st.budget)}</b> · 结余 <b>${fmtMoney(remain)}</b></span>` : ''}
      <span>行程天数 <b>${st.days} 天</b> · 路线 <b>${st.segs} 段</b> · 住宿 <b>${st.lodges} 晚</b></span>
    </div>`;
}

// 目录点击 → 滚动到对应日期章节（阻止默认锚点跳转污染 hash 路由）
$('#doc-body').addEventListener('click', e => {
  const item = e.target.closest('.toc-item');
  if (item) {
    e.preventDefault();
    const el = document.getElementById(item.dataset.href || item.getAttribute('href').slice(1));
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

/* ================================================================
 * 提示 & 初始化
 * ================================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeJournal(); closeDoc(); } });
loadData();
</script>
</body>
